generalSettings.access.whatIsExternalUser=Ce este un utilizator invitat?
generalSettings.access.whatIsExternalUser.paragraph1=Utilizatorii invitați au acces limitat și se pot alătura spațiilor doar atunci când sunt invitați de administratorii spațiilor.
generalSettings.access.whatIsExternalUser.paragraph2=Nu pot accesa conținutul intern, inclusiv spațiile interne, directorul de persoane și directorul de spații.
generalSettings.access.whatIsExternalUser.paragraph3=Pagina lor de start este personalizată pentru a preveni orice acces neintenționat la zonele restricționate.

generalSettings.access.whatIsSpaceHost=Ce este un administrator al spațiului?
generalSettings.access.whatIsSpaceHost.paragraph1=Când creați un spațiu pentru a integra o comunitate, deveniți automat administrator al spațiului.
generalSettings.access.whatIsSpaceHost.paragraph2=Acest lucru vă permite să configurați spațiul pentru comunitatea dumneavoastră, inclusiv gestionarea membrilor, setările aplicațiilor și gestionarea conținutului.
generalSettings.access.whatIsSpaceHost.paragraph3=De asemenea, vă recomandăm să desemnați și alți membri ca administratori ai spațiului, pentru ca aceștia să vă poată ajuta la nevoie.

generalSettings.access.whatIsRegisteredUser=Ce este un utilizator înregistrat?
generalSettings.access.whatIsRegisteredUser.paragraph1=Utilizatorii care accesează platforma noastră se încadrează în diferite categorii de utilizatori înregistrați:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acces deschis: Oricine se poate înregistra și, odată înregistrat, devine utilizator înregistrat.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acces limitat: Numai utilizatorii creați și invitați de administrator pot accesa platforma și sunt considerați utilizatori înregistrați.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Acces pentru invitați: Utilizatorii invitați autorizați, cu acces limitat, sunt și ei utilizatori înregistrați, dar sunt identificați ca „invitați”.

generalSettings.access.whatIsDefaultSpace=Ce este un spațiu implicit?
generalSettings.access.whatIsDefaultSpace.paragraph1=Setarea unui spațiu implicit asigură că utilizatorii noi vor accesa automat acest spațiu la prima lor conectare.
generalSettings.access.whatIsDefaultSpace.paragraph2=Acest lucru simplifică integrarea în comunitate, oferind spații de explorat înainte de implicarea în alte activități ale comunității.
generalSettings.access.whatIsDefaultSpace.paragraph3=Utilizatorii pot totuși părăsi cu ușurință spațiul dacă, după conectare, acesta nu îi interesează.

generalSettings.access.whatIsMandatorySpace=Ce este un spațiu obligatoriu?
generalSettings.access.whatIsMandatorySpace.paragraph1=Setarea unui spațiu ca obligatoriu asigură că utilizatorilor li se acordă automat accesul și nu se pot retrage. Acest lucru asigură implicarea utilizatorilor în conținutul și comunitățile esențiale.
generalSettings.access.whatIsMandatorySpace.paragraph2=De exemplu, marcarea unui spațiu „Comunicare” ca obligatoriu garantează accesul universal și primirea mesajelor.
generalSettings.access.whatIsMandatorySpace.paragraph3=Puteți specifica spații obligatorii în funcție de profilul de apartenență al utilizatorului, adaptând accesul acestuia la spațiile profilate.

