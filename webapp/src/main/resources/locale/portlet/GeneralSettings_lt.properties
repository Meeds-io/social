generalSettings.access.whatIsExternalUser=Kas yra išorinis vartotojas?
generalSettings.access.whatIsExternalUser.paragraph1=Išoriniai vartotojai turi ribotą prieigą prie platformos ir gali prisijungti tik tada, kai pakviečia erdvės šeimininkai.
generalSettings.access.whatIsExternalUser.paragraph2=Jie negali pasiekti vidinio turinio, įskaitant vidines erdves, žmonių katalogą ir erdvių katalogą.
generalSettings.access.whatIsExternalUser.paragraph3=Jų pagrindinis puslapis yra pritaikytas taip, kad būtų išvengta bet kokios netyčinės prieigos prie apribotų zonų.

generalSettings.access.whatIsSpaceHost=Kas yra kosmoso šeimininkas?
generalSettings.access.whatIsSpaceHost.paragraph1=Kai sukuriate erdvę bendruomenei, automatiškai tampate erdvės šeimininku.
generalSettings.access.whatIsSpaceHost.paragraph2=Tai leidžia konfigūruoti bendruomenės erdvę, įskaitant narių valdymą, programos nustatymus ir turinio valdymą.
generalSettings.access.whatIsSpaceHost.paragraph3=Taip pat rekomenduojame identifikuoti kitus narius kaip erdvės šeimininkus ir suteikti jiems teisę padėti jums, jei reikia.

generalSettings.access.whatIsRegisteredUser=Kas yra registruotas vartotojas?
generalSettings.access.whatIsRegisteredUser.paragraph1=Vartotojai, kurie prisijungia prie mūsų platformos, skirstomi į skirtingas registruotų vartotojų kategorijas:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Atviroji prieiga: visi gali užsiregistruoti, o kai tik prisiregistruoja, tampa registruotais vartotojais.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ribota prieiga: prie platformos gali prisijungti tik administratoriaus sukurti ir pakviesti vartotojai ir jie laikomi registruotais vartotojais.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Išorinė prieiga: įgalioti išoriniai naudotojai, turintys ribotą prieigą, taip pat yra registruoti vartotojai, tačiau yra identifikuojami kaip „išoriniai“.

generalSettings.access.whatIsDefaultSpace=Kas yra numatytoji erdvė?
generalSettings.access.whatIsDefaultSpace.paragraph1=Numatytosios vietos nustatymas užtikrina, kad nauji vartotojai, pirmą kartą prisijungę, automatiškai pasieks šią erdvę.
generalSettings.access.whatIsDefaultSpace.paragraph2=Tai supaprastina bendruomenės prisijungimą, nes suteikia erdvės, kurias galima ištirti prieš pradedant kitą bendruomenės veiklą.
generalSettings.access.whatIsDefaultSpace.paragraph3=Prisijungę vartotojai vis tiek gali lengvai išeiti iš erdvės, jei tai jų nedomina.

generalSettings.access.whatIsMandatorySpace=Kas yra privaloma erdvė?
generalSettings.access.whatIsMandatorySpace.paragraph1=Nustačius tarpą kaip privalomą, naudotojams bus automatiškai suteikta prieiga ir jie negalės jos atsisakyti. Tai užtikrina vartotojų įsitraukimą į svarbų turinį ir bendruomenes.
generalSettings.access.whatIsMandatorySpace.paragraph2=Pavyzdžiui, „Bendravimo“ erdvės žymėjimas kaip privalomas garantuoja visuotinę prieigą ir pranešimų priėmimą.
generalSettings.access.whatIsMandatorySpace.paragraph3=Galite nurodyti privalomas erdves pagal vartotojo narystės profilį, pritaikydami jo prieigą prie profiliuotų erdvių.

