generalSettings.access.whatIsExternalUser=Misafir kullanıcı nedir?
generalSettings.access.whatIsExternalUser.paragraph1=Guest users have limited access and can only join spaces when invited by space admins.
generalSettings.access.whatIsExternalUser.paragraph2=Dahili alanlar, kişi dizini ve alan dizini dahil olmak üzere dahili içeriğe erişemezler.
generalSettings.access.whatIsExternalUser.paragraph3=Ana sayfaları, kısıtlı alanlara istenmeden erişilmesini önleyecek şekilde özelleştirilmiştir.

generalSettings.access.whatIsSpaceHost=Alan yöneticisi nedir?
generalSettings.access.whatIsSpaceHost.paragraph1=When you create a space to onboard a community, you automatically become a space host.
generalSettings.access.whatIsSpaceHost.paragraph2=This allows you to configure the space for your community, including member management, application settings, and content management.
generalSettings.access.whatIsSpaceHost.paragraph3=We also recommend identifying other members as space hosts, empowering them to assist you as needed.

generalSettings.access.whatIsRegisteredUser=What is a registered user?
generalSettings.access.whatIsRegisteredUser.paragraph1=Platformumuza erişen kullanıcılar farklı kayıtlı kullanıcı kategorilerine ayrılır:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Access: Anyone can sign up, and once they do, they become registered users.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Kısıtlı erişim: Platforma yalnızca yönetici tarafından oluşturulan ve davet edilen kullanıcılar erişebilir ve bu kullanıcılar kayıtlı kullanıcı sayılır.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Misafir erişimi: Sınırlı erişime sahip yetkili misafir kullanıcılar da kayıtlı kullanıcıdır ancak "misafir" olarak tanımlanır.

generalSettings.access.whatIsDefaultSpace=What is a default space?
generalSettings.access.whatIsDefaultSpace.paragraph1=Setting a default space ensures that new users, upon their first login, will automatically access this space.
generalSettings.access.whatIsDefaultSpace.paragraph2=This simplifies community onboarding by providing spaces to explore before engaging in other community activities.
generalSettings.access.whatIsDefaultSpace.paragraph3=Kullanıcılar, oturum açtıktan sonra ilgilerini çekmezse alandan yine de kolayca çıkabilir.

generalSettings.access.whatIsMandatorySpace=What is a mandatory space?
generalSettings.access.whatIsMandatorySpace.paragraph1=Bir alanı zorunlu olarak ayarlamak, kullanıcılara otomatik olarak erişim verilmesini ve alandan ayrılamamalarını sağlar. Bu, kullanıcıların kritik içerik ve topluluklarla etkileşimini güvence altına alır.
generalSettings.access.whatIsMandatorySpace.paragraph2=Örneğin, bir "İletişim" alanını zorunlu olarak işaretlemek, herkesin erişimini ve mesajları almasını garanti eder.
generalSettings.access.whatIsMandatorySpace.paragraph3=Zorunlu alanları kullanıcının üyelik profiline göre belirleyerek erişimini profiline uygun alanlara göre uyarlayabilirsiniz.

