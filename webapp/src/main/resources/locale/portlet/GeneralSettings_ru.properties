generalSettings.access.whatIsExternalUser=Что такое внешний пользователь?
generalSettings.access.whatIsExternalUser.paragraph1=Гостевые пользователи имеют ограниченный доступ и могут вступать в пространства только по приглашению.
generalSettings.access.whatIsExternalUser.paragraph2=Они не имеют доступа к внутреннему контенту, включая внутренние пространства, каталог людей и каталог пространств.
generalSettings.access.whatIsExternalUser.paragraph3=Их домашняя страница предназначена для предотвращения непреднамеренного доступа к закрытым районам.

generalSettings.access.whatIsSpaceHost=Кто такой администратор пространства?
generalSettings.access.whatIsSpaceHost.paragraph1=Когда вы создаете пространство для форума, вы автоматически становитесь носителем пространства.
generalSettings.access.whatIsSpaceHost.paragraph2=Это позволяет настроить пространство для вашего сообщества, включая управление участниками, настройки приложений и управление контентом.
generalSettings.access.whatIsSpaceHost.paragraph3=Мы также рекомендуем назначить других участников администраторами пространства, чтобы они могли помогать вам при необходимости.

generalSettings.access.whatIsRegisteredUser=Что такое зарегистрированный пользователь?
generalSettings.access.whatIsRegisteredUser.paragraph1=Пользователи, имеющие доступ к нашей платформе, относятся к различным категориям зарегистрированных пользователей:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Открытый доступ: Любой может зарегистрироваться и стать зарегистрированными пользователями.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ограниченный доступ: Только пользователи, созданные и приглашенные администратором могут получить доступ к платформе, и они считаются зарегистрированными пользователями.
generalSettings.access.whatIsRegisteredUser.paragraph4=Внешний доступ: авторизованные внешние пользователи с ограниченным доступом, являются также зарегистрированными пользователями, но определяются как "внешние".

generalSettings.access.whatIsDefaultSpace=Что такое пространство по умолчанию?
generalSettings.access.whatIsDefaultSpace.paragraph1=Установка пространства по умолчанию обеспечивает автоматический доступ новым пользователям при первом входе в систему.
generalSettings.access.whatIsDefaultSpace.paragraph2=Это упрощает адаптацию в сообществе: пользователи получают пространства для знакомства до участия в других активностях сообщества.
generalSettings.access.whatIsDefaultSpace.paragraph3=Пользователи по-прежнему могут быстро покинуть пространство, если оно им неинтересно.

generalSettings.access.whatIsMandatorySpace=Что является обязательным пространством?
generalSettings.access.whatIsMandatorySpace.paragraph1=Обязательное пространство гарантирует, что пользователи автоматически получают доступ и не могут отказаться от него. Это помогает знакомить пользователей с важными разделами.
generalSettings.access.whatIsMandatorySpace.paragraph2=Например, обязательное пространство «Коммуникация», где вы публикуете важную информацию, помогает охватить всех участников.
generalSettings.access.whatIsMandatorySpace.paragraph3=Обязательные пространства можно выбрать на основе групп пользователей.

generalSettings.access.restrictedChangeInformation1=Только зарегистрированные пользователи смогут получить доступ к платформе.
generalSettings.access.restrictedChangeInformation2=Это не повлияет на уже существующих пользователей
