generalSettings.access.whatIsExternalUser=Что такое внешний пользователь?
generalSettings.access.whatIsExternalUser.paragraph1=Внешние пользователи имеют ограниченный доступ к платформе и могут заходить в пространство только по приглашению узлов космоса.
generalSettings.access.whatIsExternalUser.paragraph2=Они не могут получить доступ к внутреннему содержимому, включая внутренние пробелы, директорию людей и директорию пробелов.
generalSettings.access.whatIsExternalUser.paragraph3=Их домашняя страница предназначена для предотвращения непреднамеренного доступа к закрытым районам.

generalSettings.access.whatIsSpaceHost=Что такое узел с пробелами?
generalSettings.access.whatIsSpaceHost.paragraph1=Когда вы создаете пространство для форума, вы автоматически становитесь носителем пространства.
generalSettings.access.whatIsSpaceHost.paragraph2=Это позволяет вам настроить пространство для вашего сообщества, включая управление членами, настройки приложений и управление контентом.
generalSettings.access.whatIsSpaceHost.paragraph3=Мы также рекомендуем идентифицировать других пользователей в качестве носителей космоса, предоставляя им права на то, чтобы помочь вам при необходимости.

generalSettings.access.whatIsRegisteredUser=Что такое зарегистрированный пользователь?
generalSettings.access.whatIsRegisteredUser.paragraph1=Пользователи, имеющие доступ к нашей платформе, относятся к различным категориям зарегистрированных пользователей:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Открытый доступ: Любой может зарегистрироваться и стать зарегистрированными пользователями.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ограниченный доступ: Только пользователи, созданные и приглашенные администратором могут получить доступ к платформе, и они считаются зарегистрированными пользователями.
generalSettings.access.whatIsRegisteredUser.paragraph4=Внешний доступ: авторизованные внешние пользователи с ограниченным доступом, являются также зарегистрированными пользователями, но определяются как "внешние".

generalSettings.access.whatIsDefaultSpace=Что такое пространство по умолчанию?
generalSettings.access.whatIsDefaultSpace.paragraph1=Установка пространства по умолчанию обеспечивает автоматический доступ новым пользователям при первом входе в систему.
generalSettings.access.whatIsDefaultSpace.paragraph2=Это упрощает посадочный талон, предоставляя места для исследования перед тем, как заниматься другими видами общественной деятельности.
generalSettings.access.whatIsDefaultSpace.paragraph3=Пользователи могут легко выйти из места, если он не интересует их после входа в систему.

generalSettings.access.whatIsMandatorySpace=Что является обязательным пространством?
generalSettings.access.whatIsMandatorySpace.paragraph1=Установка пространства обязательным образом обеспечивает автоматический доступ пользователей и не может отказаться от выбора. Это гарантирует вовлечение пользователей в критический контент и сообщества.
generalSettings.access.whatIsMandatorySpace.paragraph2=Например, пометка "Коммуникация" как обязательное место гарантирует универсальный доступ и прием сообщений.
generalSettings.access.whatIsMandatorySpace.paragraph3=Вы можете указать обязательные пробелы, основанные на профиле членства пользователя, настраивая их доступ к профилям.

