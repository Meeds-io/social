generalSettings.access.whatIsExternalUser=Czym jest użytkownik zewnętrzny?
generalSettings.access.whatIsExternalUser.paragraph1=Użytkownicy zewnętrzni mają ograniczony dostęp do platformy i mogą dołączyć do przestrzeni tylko wtedy, gdy są zaproszeni przez hosty kosmiczne.
generalSettings.access.whatIsExternalUser.paragraph2=Nie mogą uzyskać dostępu do wewnętrznych treści, w tym wewnętrznych przestrzeni, katalogu ludzi i spacji.
generalSettings.access.whatIsExternalUser.paragraph3=Ich strona główna jest dostosowana, aby zapobiec niezamierzonemu dostępowi do ograniczonych obszarów.

generalSettings.access.whatIsSpaceHost=Czym jest host przestrzeni kosmicznej?
generalSettings.access.whatIsSpaceHost.paragraph1=Gdy tworzysz miejsce na pokładzie społeczności, automatycznie stajesz się hostem przestrzeni kosmicznej.
generalSettings.access.whatIsSpaceHost.paragraph2=Pozwala to skonfigurować przestrzeń dla Twojej społeczności, w tym zarządzanie użytkownikami, ustawieniami aplikacji i zarządzaniem treścią.
generalSettings.access.whatIsSpaceHost.paragraph3=Zalecamy również zidentyfikowanie innych użytkowników jako hostów kosmicznych, umożliwiając im pomoc w razie potrzeby.

generalSettings.access.whatIsRegisteredUser=Kim jest zarejestrowany użytkownik?
generalSettings.access.whatIsRegisteredUser.paragraph1=Użytkownicy, którzy mają dostęp do naszej platformy, dzielą się na różne kategorie zarejestrowanych użytkowników:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Otwarty dostęp: każdy może się zarejestrować, a gdy tylko tak się stanie, stają się zarejestrowanymi użytkownikami.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ograniczony dostęp: Tylko użytkownicy utworzeni i zaproszeni przez administratora mogą się zalogować i być uważani za zarejestrowanych użytkowników.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Dostęp zewnętrzny: Autoryzowani użytkownicy zewnętrzni, z ograniczonym dostępem, są również zarejestrowanymi użytkownikami, ale są określani jako „zewnętrzny”.

generalSettings.access.whatIsDefaultSpace=Czym jest domyślna przestrzeń?
generalSettings.access.whatIsDefaultSpace.paragraph1=Ustawienie domyślnej przestrzeni sprawi, że nowi użytkownicy, po pierwszym zalogowaniu, automatycznie uzyskają dostęp do tej przestrzeni.
generalSettings.access.whatIsDefaultSpace.paragraph2=Ułatwia to wdrożenie przez społeczność poprzez zapewnienie przestrzeni do poszukiwania przed podjęciem innych działań na poziomie społeczności.
generalSettings.access.whatIsDefaultSpace.paragraph3=Użytkownicy nadal mogą z łatwością wyjść z miejsca, jeśli nie interesuje ich po zalogowaniu.

generalSettings.access.whatIsMandatorySpace=Czym jest przestrzeń obowiązkowa?
generalSettings.access.whatIsMandatorySpace.paragraph1=Ustawienie przestrzeni jako obowiązkowej gwarantuje, że użytkownicy są automatycznie uprawnieni do dostępu i nie mogą zrezygnować. Zapewnia to zaangażowanie użytkowników w krytyczne treści i społeczności.
generalSettings.access.whatIsMandatorySpace.paragraph2=Na przykład oznaczanie przestrzeni „komunikacji” jako obowiązkowego gwarantuje powszechny dostęp i odbieranie wiadomości.
generalSettings.access.whatIsMandatorySpace.paragraph3=Możesz określić obowiązkowe spacje na podstawie profilu członkostwa użytkownika, dostosowując ich dostęp do profilowanych przestrzeni.

