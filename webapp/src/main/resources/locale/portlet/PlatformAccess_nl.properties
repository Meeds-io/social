generalSettings.access.whatIsExternalUser=Wat is een gastgebruiker?
generalSettings.access.whatIsExternalUser.paragraph1=Gastgebruikers hebben beperkte toegang en kunnen alleen lid worden van ruimtes wanneer ze door ruimtebeheerders worden uitgenodigd.
generalSettings.access.whatIsExternalUser.paragraph2=Ze hebben geen toegang tot interne inhoud, waaronder interne ruimtes, het personenoverzicht en het ruimteoverzicht.
generalSettings.access.whatIsExternalUser.paragraph3=Hun homepage wordt aangepast om onbedoelde toegang tot beperkte gebieden te voorkomen.

generalSettings.access.whatIsSpaceHost=Wat is een ruimtebeheerder?
generalSettings.access.whatIsSpaceHost.paragraph1=Wanneer u een ruimte aanmaakt om een community te verwelkomen, wordt u automatisch ruimtebeheerder.
generalSettings.access.whatIsSpaceHost.paragraph2=Hiermee kunt u de ruimte voor uw community configureren, inclusief ledenbeheer, applicatie-instellingen en inhoudsbeheer.
generalSettings.access.whatIsSpaceHost.paragraph3=We raden u ook aan andere leden als ruimtebeheerder aan te wijzen, zodat ze u waar nodig kunnen helpen.

generalSettings.access.whatIsRegisteredUser=Wat is een geregistreerde gebruiker?
generalSettings.access.whatIsRegisteredUser.paragraph1=Gebruikers die toegang hebben tot ons platform vallen in verschillende categorieën van geregistreerde gebruikers:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Toegang: Iedereen kan zich inschrijven en zodra ze dat doen, worden ze geregistreerde gebruikers.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Beperkte toegang: Alleen gebruikers die zijn aangemaakt en uitgenodigd door de beheerder hebben toegang tot het platform, en ze worden beschouwd als geregistreerde gebruikers.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Gasttoegang: geautoriseerde gastgebruikers met beperkte toegang zijn ook geregistreerde gebruikers, maar worden aangeduid als "gasten".

generalSettings.access.whatIsDefaultSpace=Wat is een standaardruimte?
generalSettings.access.whatIsDefaultSpace.paragraph1=Het instellen van een standaardruimte zorgt ervoor dat nieuwe gebruikers bij hun eerste keer inloggen automatisch toegang krijgen tot deze ruimte.
generalSettings.access.whatIsDefaultSpace.paragraph2=Dit vereenvoudigt de onboarding van de community door het aanbieden van ruimtes om te verkennen alvorens deel te nemen aan andere gemeenschapsactiviteiten.
generalSettings.access.whatIsDefaultSpace.paragraph3=Gebruikers kunnen de ruimte na het inloggen nog steeds gemakkelijk verlaten als die hen niet interesseert.

generalSettings.access.whatIsMandatorySpace=Wat is een verplichte ruimte?
generalSettings.access.whatIsMandatorySpace.paragraph1=Door een ruimte als verplicht in te stellen, krijgen gebruikers automatisch toegang en kunnen ze zich niet afmelden. Zo blijven gebruikers betrokken bij essentiële inhoud en community's.
generalSettings.access.whatIsMandatorySpace.paragraph2=Door bijvoorbeeld een ruimte "Communicatie" als verplicht te markeren, zijn universele toegang en ontvangst van berichten gegarandeerd.
generalSettings.access.whatIsMandatorySpace.paragraph3=U kunt verplichte ruimtes opgeven op basis van het lidmaatschapsprofiel van een gebruiker, zodat de toegang wordt afgestemd op geprofileerde ruimtes.

