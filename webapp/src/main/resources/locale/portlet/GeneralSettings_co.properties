generalSettings.access.whatIsExternalUser=Cosa hè un utilizatore invitatu?
generalSettings.access.whatIsExternalUser.paragraph1=L'utilizatori invitati anu accessu limitatu è ponu unisce spazii solu per invitu.
generalSettings.access.whatIsExternalUser.paragraph2=Ùn ponu micca accede à u cuntenutu internu, cumpresi i spazii interni, u repertoriu di persone è u repertoriu di u spaziu.
generalSettings.access.whatIsExternalUser.paragraph3=A so pagina di casa hè diversa per impedisce l'accessu involontariu à e zone ristrette.

generalSettings.access.whatIsSpaceHost=Chì ghjè un amministratore di u spaziu?
generalSettings.access.whatIsSpaceHost.paragraph1=Quandu create un spaziu per imbarcà una cumunità, diventerete automaticamente un amministratore di u spaziu.
generalSettings.access.whatIsSpaceHost.paragraph2=Questu permette di cunfigurà u spaziu per a vostra cumunità, cumprese a gestione di membri, i paràmetri di l'applicazione è a gestione di cuntenutu.
generalSettings.access.whatIsSpaceHost.paragraph3=Hè ricumandemu ancu di identificà l'altri membri cum'è amministratori di u spaziu, chì li permettenu di aiutà vi cum'è necessariu.

generalSettings.access.whatIsRegisteredUser=Chì ghjè un utilizatore registratu?
generalSettings.access.whatIsRegisteredUser.paragraph1=L'utilizatori registrati sò utilizatori chì anu un contu validu. Questu pò accade in parechje manere secondu u modu di accessu:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Access: Qualchissia pò firmà, è una volta ch'elli facenu, diventanu utilizatori arregistrati.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Accessu Restricted: Solu l'utilizatori creati è invitati da un amministratore ponu accede è esse cunsideratu utilizatori registrati.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Accessu di l'ospiti: L'utilizatori d'invitati autorizati cù accessu limitatu sò utilizatori registrati, ma sò identificati cum'è invitati cù 🔹 dopu u so nome.

generalSettings.access.whatIsDefaultSpace=Chì ghjè un spaziu predeterminatu?
generalSettings.access.whatIsDefaultSpace.paragraph1=Stabilisce un spaziu predeterminatu assicura chì i novi utilizatori, à u so primu login, accedenu automaticamente à stu spaziu.
generalSettings.access.whatIsDefaultSpace.paragraph2=Questu simplifica l'imbarcu di a cumunità furnisce spazii per spiegà prima di impegnà in altre attività di a cumunità.
generalSettings.access.whatIsDefaultSpace.paragraph3=L'utilizatori ponu sempre lascià rapidamente u spaziu s'ellu ùn anu micca interessatu.

generalSettings.access.whatIsMandatorySpace=Chì ghjè un spaziu obligatoriu?
generalSettings.access.whatIsMandatorySpace.paragraph1=Stabilisce un spaziu cum'è ubligatoriu assicura chì l'utilizatori sò automaticamente cuncessi l'accessu è ùn ponu micca opt-out. Aiuta à espone l'utilizatori à e zone critiche.
generalSettings.access.whatIsMandatorySpace.paragraph2=Per esempiu, un spaziu ubligatoriu "Communication" induve spinghje l'infurmazioni essenziali aiuta à ghjunghje à tutti i membri.
generalSettings.access.whatIsMandatorySpace.paragraph3=Pudete selezziunà spazii ubligatoriu basatu annantu à i gruppi di utilizatori.

