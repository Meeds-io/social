generalSettings.access.whatIsExternalUser=O que é um utilizador convidado?
generalSettings.access.whatIsExternalUser.paragraph1=Os utilizadores convidados têm acesso limitado e só podem aderir a espaços por convite.
generalSettings.access.whatIsExternalUser.paragraph2=Não podem aceder a conteúdos internos, incluindo espaços internos, o diretório de pessoas e o diretório de espaços.
generalSettings.access.whatIsExternalUser.paragraph3=Sua homepage está personalizada para evitar qualquer acesso não intencional a áreas restritas.

generalSettings.access.whatIsSpaceHost=O que é um host espacial?
generalSettings.access.whatIsSpaceHost.paragraph1=Quando cria um espaço para integrar uma comunidade, torna-se automaticamente administrador do espaço.
generalSettings.access.whatIsSpaceHost.paragraph2=Isto permite-lhe configurar o espaço para a sua comunidade, incluindo a gestão de membros, as definições das aplicações e a gestão de conteúdos.
generalSettings.access.whatIsSpaceHost.paragraph3=Recomendamos também que designe outros membros como administradores do espaço, para que o possam ajudar quando necessário.

generalSettings.access.whatIsRegisteredUser=O que é um utilizador registado?
generalSettings.access.whatIsRegisteredUser.paragraph1=Os utilizadores registados são utilizadores com uma conta válida. Isto pode acontecer de várias formas, consoante o modo de acesso:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acesso aberto: qualquer pessoa pode registar-se e, depois de o fazer, torna-se um utilizador registado.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acesso restrito: apenas os utilizadores criados e convidados por um administrador podem iniciar sessão e ser considerados utilizadores registados.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Acesso de convidados: os utilizadores convidados autorizados, com acesso limitado, são utilizadores registados, mas são identificados como convidados com 🔹 após o nome.

generalSettings.access.whatIsDefaultSpace=O que é um espaço padrão?
generalSettings.access.whatIsDefaultSpace.paragraph1=Definir um espaço predefinido garante que os novos utilizadores acedem automaticamente a este espaço no primeiro início de sessão.
generalSettings.access.whatIsDefaultSpace.paragraph2=Isto simplifica a integração na comunidade, ao disponibilizar espaços para explorar antes de participar noutras atividades da comunidade.
generalSettings.access.whatIsDefaultSpace.paragraph3=Os utilizadores podem sempre sair rapidamente do espaço se não estiverem interessados.

generalSettings.access.whatIsMandatorySpace=O que é um espaço obrigatório?
generalSettings.access.whatIsMandatorySpace.paragraph1=Definir um espaço como obrigatório garante que os utilizadores obtêm acesso automaticamente e não podem sair. Ajuda a expor os utilizadores a áreas críticas.
generalSettings.access.whatIsMandatorySpace.paragraph2=Por exemplo, marcar um espaço de "Comunicação" como uma garantia obrigatória de acesso universal e de recepção de mensagens.
generalSettings.access.whatIsMandatorySpace.paragraph3=Pode selecionar espaços obrigatórios com base nos grupos de utilizadores.

