loggingLevels.title=Logging levels
loggingLevels.description=A change applies at once on this server and at the next refresh of the others (every 10 seconds by default), without a restart, and is kept after a restart unless it is given back after a delay. logback.xml is not modified: reset a logger to get its level back. TRACE and DEBUG can write a lot, personal data included.
