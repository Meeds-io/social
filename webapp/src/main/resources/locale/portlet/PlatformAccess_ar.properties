generalSettings.access.whatIsExternalUser=ما هو المستخدم الضيف؟
generalSettings.access.whatIsExternalUser.paragraph1=لدى المستخدمين الضيوف وصول محدود، ولا يمكنهم الانضمام إلى الفضاءات إلا عند دعوتهم من قبل مسؤولي الفضاءات.
generalSettings.access.whatIsExternalUser.paragraph2=لا يمكنهم الوصول إلى المحتوى الداخلي، بما في ذلك الفضاءات الداخلية ودليل الأشخاص ودليل الفضاءات.
generalSettings.access.whatIsExternalUser.paragraph3=صفحتهم الرئيسية مخصصة لمنع أي وصول غير مقصود إلى المناطق المقيدة.

generalSettings.access.whatIsSpaceHost=ما هو مضيف الفضاء؟
generalSettings.access.whatIsSpaceHost.paragraph1=عند إنشاء فضاء لاستقبال مجتمع ما، تصبح تلقائيًا مضيفًا للفضاء.
generalSettings.access.whatIsSpaceHost.paragraph2=يتيح لك ذلك تهيئة الفضاء لمجتمعك، بما في ذلك إدارة الأعضاء وإعدادات التطبيقات وإدارة المحتوى.
generalSettings.access.whatIsSpaceHost.paragraph3=نوصي أيضًا بتعيين أعضاء آخرين كمضيفين للفضاء، لتمكينهم من مساعدتك عند الحاجة.

generalSettings.access.whatIsRegisteredUser=ما هو المستخدم المسجل؟
generalSettings.access.whatIsRegisteredUser.paragraph1=ينقسم المستخدمون الذين يصلون إلى منصتنا إلى فئات مختلفة من المستخدمين المسجلين:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. الوصول المفتوح: يمكن لأي شخص إنشاء حساب، ويصبح بذلك مستخدمًا مسجلًا.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. الوصول المقيّد: يمكن فقط للمستخدمين الذين أنشأهم المسؤول ودعاهم الوصول إلى المنصة، ويُعتبرون مستخدمين مسجلين.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. وصول الضيوف: المستخدمون الضيوف المصرّح لهم، ذوو الوصول المحدود، هم أيضًا مستخدمون مسجلون لكنهم يُعرَّفون بصفة "ضيوف".

generalSettings.access.whatIsDefaultSpace=ما هو الفضاء الافتراضي؟
generalSettings.access.whatIsDefaultSpace.paragraph1=يضمن تعيين فضاء افتراضي أن يصل المستخدمون الجدد تلقائيًا إلى هذا الفضاء عند أول تسجيل دخول لهم.
generalSettings.access.whatIsDefaultSpace.paragraph2=يسهّل ذلك إعداد المجتمع للأعضاء الجدد من خلال توفير فضاءات لاستكشافها قبل المشاركة في أنشطة المجتمع الأخرى.
generalSettings.access.whatIsDefaultSpace.paragraph3=لا يزال بإمكان المستخدمين مغادرة الفضاء بسهولة إذا لم يثر اهتمامهم بعد تسجيل الدخول.

generalSettings.access.whatIsMandatorySpace=ما هو الفضاء الإلزامي؟
generalSettings.access.whatIsMandatorySpace.paragraph1=يضمن تعيين فضاء كإلزامي منح المستخدمين حق الوصول إليه تلقائيًا دون إمكانية الانسحاب منه. ويضمن ذلك تفاعل المستخدمين مع المحتوى والمجتمعات الأساسية.
generalSettings.access.whatIsMandatorySpace.paragraph2=على سبيل المثال، يضمن تعيين فضاء "التواصل" كفضاء إلزامي وصول الجميع إليه واستلامهم للرسائل.
generalSettings.access.whatIsMandatorySpace.paragraph3=يمكنك تحديد الفضاءات الإلزامية بناءً على ملف عضوية المستخدم، لتكييف وصوله إلى الفضاءات المخصصة لفئته.

