generalSettings.access.whatIsExternalUser=Apa itu pengguna luar?
generalSettings.access.whatIsExternalUser.paragraph1=Pengguna tamu memiliki akses terbatas dan hanya dapat bergabung ke ruang melalui undangan.
generalSettings.access.whatIsExternalUser.paragraph2=Mereka tidak dapat mengakses konten internal, termasuk ruang internal, direktori orang, dan direktori ruang.
generalSettings.access.whatIsExternalUser.paragraph3=Beranda mereka berbeda untuk mencegah akses yang tidak disengaja ke area terlarang.

generalSettings.access.whatIsSpaceHost=Apa itu host forum?
generalSettings.access.whatIsSpaceHost.paragraph1=Saat Anda membuat ruang untuk bergabung dalam komunitas, Anda otomatis menjadi admin ruang.
generalSettings.access.whatIsSpaceHost.paragraph2=Ini mengizinkan Anda untuk mengonfigurasi forum untuk komunitas Anda, termasuk pengelolaan anggota, pengaturan aplikasi, dan pengelolaan konten.\n\n\n\n\n
generalSettings.access.whatIsSpaceHost.paragraph3=Kami juga merekomendasikan mengidentifikasi anggota lain sebagai host forum, memberi mereka wewang untuk membantu Anda sesuai kebutuhan.

generalSettings.access.whatIsRegisteredUser=Apa itu pengguna yang sudah terdaftar?
generalSettings.access.whatIsRegisteredUser.paragraph1=Pengguna terdaftar adalah pengguna yang memiliki akun yang valid. Hal ini dapat terjadi dalam berbagai cara tergantung pada mode akses:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Akses Terbuka: Siapa pun dapat mendaftar, dan setelah mereka melakukannya, mereka menjadi pengguna terdaftar.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Akses Terbatas: Hanya pengguna - pengguna yang dibuat dan diundang oleh administrator yang dapat mengakses platform, dan mereka dianggap sebagai pengguna terdaftar.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Akses luar: Pengguna luar yang diotorisasi, dengan akses terbatas, juga merupakan pengguna terdaftar tetapi diidentifikasi sebagai "luar".

generalSettings.access.whatIsDefaultSpace=Apa itu forum bawaan?
generalSettings.access.whatIsDefaultSpace.paragraph1=Menetapkan ruang default memastikan bahwa pengguna baru, pada login pertama mereka, akan secara otomatis mengakses ruang ini.
generalSettings.access.whatIsDefaultSpace.paragraph2=Hal ini menyederhanakan orientasi komunitas dengan menyediakan ruang untuk bereksplorasi sebelum terlibat dalam aktivitas komunitas lainnya.
generalSettings.access.whatIsDefaultSpace.paragraph3=Pengguna masih dapat dengan cepat meninggalkan ruang tersebut jika tidak tertarik.

generalSettings.access.whatIsMandatorySpace=Apa itu forum wajib?
generalSettings.access.whatIsMandatorySpace.paragraph1=Menetapkan ruang sebagai wajib memastikan bahwa pengguna secara otomatis diberikan akses dan tidak dapat memilih untuk tidak ikut serta. Ini membantu mengekspos pengguna ke area kritis.
generalSettings.access.whatIsMandatorySpace.paragraph2=Misalnya, ruang "Komunikasi" wajib tempat Anda memasukkan informasi penting membantu menjangkau semua anggota.
generalSettings.access.whatIsMandatorySpace.paragraph3=Anda dapat memilih ruang wajib berdasarkan kelompok pengguna.

