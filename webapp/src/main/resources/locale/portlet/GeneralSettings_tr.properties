generalSettings.access.whatIsExternalUser=Misafir kullanıcı nedir?
generalSettings.access.whatIsExternalUser.paragraph1=Misafir kullanıcıların erişimi sınırlıdır ve alanlara yalnızca davet yoluyla katılabilirler.
generalSettings.access.whatIsExternalUser.paragraph2=Dahili alanlar, kişi dizini ve alan dizini dahil olmak üzere dahili içeriğe erişemezler.
generalSettings.access.whatIsExternalUser.paragraph3=Kısıtlı alanlara istemeden erişimin önüne geçmek için ana sayfaları farklıdır.

generalSettings.access.whatIsSpaceHost=Alan yöneticisi nedir?
generalSettings.access.whatIsSpaceHost.paragraph1=Bir topluluğu dahil etmek için bir alan oluşturduğunuzda otomatik olarak bir alan yöneticisi olursunuz.
generalSettings.access.whatIsSpaceHost.paragraph2=Bu, üye yönetimi, uygulama ayarları ve içerik yönetimi de dahil olmak üzere topluluğunuz için alanı yapılandırmanıza olanak tanır.
generalSettings.access.whatIsSpaceHost.paragraph3=Ayrıca, diğer üyeleri alan yöneticisi olarak belirlemenizi ve gerektiğinde size yardımcı olmalarını sağlamanızı öneririz.

generalSettings.access.whatIsRegisteredUser=Kayıtlı kullanıcı nedir?
generalSettings.access.whatIsRegisteredUser.paragraph1=Kayıtlı kullanıcılar geçerli bir hesaba sahip olan kullanıcılardır. Bu, erişim moduna bağlı olarak çeşitli şekillerde olabilir:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Açık Erişim: Herkes kayıt olabilir ve kayıt yaptırdıklarında kayıtlı kullanıcı olurlar.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Sınırlı Erişim: Yalnızca bir yönetici tarafından oluşturulan ve davet edilen kullanıcılar oturum açabilir ve kayıtlı kullanıcı olarak kabul edilebilir.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Misafir Erişimi: Sınırlı erişime sahip yetkili misafir kullanıcılar kayıtlı kullanıcılardır ancak adlarının yanında 🔹 işaretiyle misafir olarak tanımlanırlar.

generalSettings.access.whatIsDefaultSpace=Varsayılan alan nedir?
generalSettings.access.whatIsDefaultSpace.paragraph1=Varsayılan bir alan belirlemek, yeni kullanıcıların ilk oturum açışlarında bu alana otomatik olarak erişebilmelerini sağlar.
generalSettings.access.whatIsDefaultSpace.paragraph2=Bu, diğer topluluk etkinliklerine katılmadan önce keşfedilecek alanlar sağlayarak topluluk katılımını kolaylaştırır.
generalSettings.access.whatIsDefaultSpace.paragraph3=Kullanıcılar ilgilenmedikleri takdirde alanı hızla terk edebilirler.

generalSettings.access.whatIsMandatorySpace=Zorunlu alan nedir?
generalSettings.access.whatIsMandatorySpace.paragraph1=Bir alanı zorunlu olarak ayarlamak, kullanıcılara otomatik olarak erişim izni verilmesini ve devre dışı bırakılamamasını sağlar. Kullanıcıların kritik alanlara maruz kalmasına yardımcı olur.
generalSettings.access.whatIsMandatorySpace.paragraph2=Örneğin, önemli bilgilerin paylaşıldığı zorunlu bir "İletişim" alanı, tüm üyelere ulaşmanızı sağlar.
generalSettings.access.whatIsMandatorySpace.paragraph3=Kullanıcı gruplarına göre zorunlu alanları seçebilirsiniz.

