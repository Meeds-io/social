generalSettings.access.whatIsExternalUser=Хто такий гість?
generalSettings.access.whatIsExternalUser.paragraph1=Гості мають обмежений доступ і можуть приєднуватися до просторів лише за запрошенням адміністраторів просторів.
generalSettings.access.whatIsExternalUser.paragraph2=Вони не мають доступу до внутрішнього контенту, зокрема до внутрішніх просторів, каталогу людей і каталогу просторів.
generalSettings.access.whatIsExternalUser.paragraph3=Їхню домашню сторінку налаштовано так, щоб запобігти будь-якому ненавмисному доступу до обмежених розділів.

generalSettings.access.whatIsSpaceHost=Хто такий адміністратор простору?
generalSettings.access.whatIsSpaceHost.paragraph1=Коли ви створюєте простір, щоб залучити спільноту, ви автоматично стаєте адміністратором простору.
generalSettings.access.whatIsSpaceHost.paragraph2=Це дає змогу налаштовувати простір для вашої спільноти, зокрема керувати учасниками, налаштуваннями застосунків і контентом.
generalSettings.access.whatIsSpaceHost.paragraph3=Також радимо призначити інших учасників адміністраторами простору, щоб вони могли допомагати вам за потреби.

generalSettings.access.whatIsRegisteredUser=Хто такий зареєстрований користувач?
generalSettings.access.whatIsRegisteredUser.paragraph1=Користувачі, які мають доступ до нашої платформи, належать до різних категорій зареєстрованих користувачів:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Відкритий доступ: будь-хто може зареєструватися і після цього стає зареєстрованим користувачем.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Обмежений доступ: лише користувачі, створені та запрошені адміністратором, мають доступ до платформи, і вони вважаються зареєстрованими користувачами.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Гостьовий доступ: авторизовані гості з обмеженим доступом також є зареєстрованими користувачами, але позначаються як «гості».

generalSettings.access.whatIsDefaultSpace=Що таке типовий простір?
generalSettings.access.whatIsDefaultSpace.paragraph1=Типовий простір гарантує, що нові користувачі під час першого входу автоматично отримають доступ до цього простору.
generalSettings.access.whatIsDefaultSpace.paragraph2=Це спрощує залучення до спільноти, надаючи простори для ознайомлення перед участю в інших активностях спільноти.
generalSettings.access.whatIsDefaultSpace.paragraph3=Після входу користувачі можуть легко вийти з простору, якщо він їх не цікавить.

generalSettings.access.whatIsMandatorySpace=Що таке обов’язковий простір?
generalSettings.access.whatIsMandatorySpace.paragraph1=Якщо простір позначено як обов’язковий, користувачі автоматично отримують до нього доступ і не можуть від нього відмовитися. Це забезпечує залучення користувачів до важливого контенту та спільнот.
generalSettings.access.whatIsMandatorySpace.paragraph2=Наприклад, якщо позначити простір «Комунікація» як обов’язковий, усі користувачі матимуть до нього доступ і отримуватимуть повідомлення.
generalSettings.access.whatIsMandatorySpace.paragraph3=Ви можете задавати обов’язкові простори залежно від профілю членства користувача, адаптуючи його доступ до профільних просторів.

