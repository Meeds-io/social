generalSettings.access.whatIsExternalUser=O que é um utilizador convidado?
generalSettings.access.whatIsExternalUser.paragraph1=Os utilizadores convidados têm acesso limitado e só podem aderir a espaços quando são convidados pelos administradores de espaços.
generalSettings.access.whatIsExternalUser.paragraph2=Não podem aceder a conteúdos internos, incluindo espaços internos, o diretório de pessoas e o diretório de espaços.
generalSettings.access.whatIsExternalUser.paragraph3=A página inicial destes utilizadores é personalizada para evitar qualquer acesso involuntário a áreas restritas.

generalSettings.access.whatIsSpaceHost=O que é um anfitrião do espaço?
generalSettings.access.whatIsSpaceHost.paragraph1=Ao criar um espaço para integrar uma comunidade, torna-se automaticamente anfitrião do espaço.
generalSettings.access.whatIsSpaceHost.paragraph2=Isto permite-lhe configurar o espaço para a sua comunidade, incluindo a gestão de membros, as definições das aplicações e a gestão de conteúdos.
generalSettings.access.whatIsSpaceHost.paragraph3=Recomendamos também que identifique outros membros como anfitriões do espaço, para que o possam ajudar sempre que necessário.

generalSettings.access.whatIsRegisteredUser=O que é um utilizador registado?
generalSettings.access.whatIsRegisteredUser.paragraph1=Os utilizadores que acedem à nossa plataforma enquadram-se em diferentes categorias de utilizadores registados:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acesso aberto: qualquer pessoa pode registar-se e, depois de o fazer, passa a ser um utilizador registado.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acesso restrito: apenas os utilizadores criados e convidados pelo administrador podem aceder à plataforma e são considerados utilizadores registados.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Acesso de convidados: os utilizadores convidados autorizados, com acesso limitado, também são utilizadores registados, mas são identificados como "convidados".

generalSettings.access.whatIsDefaultSpace=O que é um espaço predefinido?
generalSettings.access.whatIsDefaultSpace.paragraph1=Definir um espaço predefinido garante que os novos utilizadores, no primeiro início de sessão, acedem automaticamente a esse espaço.
generalSettings.access.whatIsDefaultSpace.paragraph2=Isto simplifica a integração na comunidade, ao disponibilizar espaços para explorar antes de participar noutras atividades da comunidade.
generalSettings.access.whatIsDefaultSpace.paragraph3=Os utilizadores podem sair facilmente do espaço se este não lhes interessar depois de iniciarem sessão.

generalSettings.access.whatIsMandatorySpace=O que é um espaço obrigatório?
generalSettings.access.whatIsMandatorySpace.paragraph1=Definir um espaço como obrigatório garante que os utilizadores recebem acesso automaticamente e não podem sair. Isto garante o envolvimento dos utilizadores com conteúdos e comunidades essenciais.
generalSettings.access.whatIsMandatorySpace.paragraph2=Por exemplo, marcar um espaço "Comunicação" como obrigatório garante o acesso universal e a receção das mensagens.
generalSettings.access.whatIsMandatorySpace.paragraph3=Pode especificar espaços obrigatórios com base no perfil de adesão de um utilizador, adaptando o seu acesso aos espaços associados ao perfil.

