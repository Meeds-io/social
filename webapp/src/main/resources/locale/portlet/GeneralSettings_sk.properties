generalSettings.access.whatIsExternalUser=Čo je hosťujúci používateľ?
generalSettings.access.whatIsExternalUser.paragraph1=Hosťujúci používatelia majú obmedzený prístup a môžu sa pripojiť k priestorom iba na základe pozvánky.
generalSettings.access.whatIsExternalUser.paragraph2=Nemôžu pristupovať k internému obsahu vrátane interných priestorov, adresára ľudí a adresára priestoru.
generalSettings.access.whatIsExternalUser.paragraph3=Ich domovská stránka je odlišná, aby sa zabránilo akémukoľvek neúmyselnému prístupu do zakázaných oblastí.

generalSettings.access.whatIsSpaceHost=Čo je správca priestoru?
generalSettings.access.whatIsSpaceHost.paragraph1=Keď vytvoríte priestor na zaradenie do komunity, automaticky sa stanete správcom priestoru.
generalSettings.access.whatIsSpaceHost.paragraph2=To vám umožní nakonfigurovať priestor pre vašu komunitu vrátane správy členov, nastavení aplikácií a správy obsahu.
generalSettings.access.whatIsSpaceHost.paragraph3=Odporúčame tiež identifikovať ostatných členov ako správcov priestoru a umožniť im, aby vám podľa potreby pomáhali.

generalSettings.access.whatIsRegisteredUser=Čo je registrovaný užívateľ?
generalSettings.access.whatIsRegisteredUser.paragraph1=Registrovaní používatelia sú používatelia, ktorí majú platný účet. To sa môže stať rôznymi spôsobmi v závislosti od režimu prístupu:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Otvorený prístup: Každý sa môže zaregistrovať a keď tak urobí, stane sa registrovaným používateľom.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Obmedzený prístup: Iba používatelia vytvorení a pozvaní správcom sa môžu prihlásiť a byť považovaní za registrovaných používateľov.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Hosťovský prístup: Autorizovaní hosťujúci používatelia s obmedzeným prístupom sú registrovaní používatelia, no identifikujú sa ako hostia s 🔹 za menom.

generalSettings.access.whatIsDefaultSpace=Čo je predvolený priestor?
generalSettings.access.whatIsDefaultSpace.paragraph1=Nastavenie predvoleného priestoru zaisťuje, že noví používatelia pri prvom prihlásení automaticky získajú tento priestor.
generalSettings.access.whatIsDefaultSpace.paragraph2=To zjednodušuje registráciu v komunite tým, že poskytuje priestory na preskúmanie pred zapojením sa do iných aktivít komunity.
generalSettings.access.whatIsDefaultSpace.paragraph3=Používatelia môžu stále rýchlo opustiť priestor, ak nemajú záujem.

generalSettings.access.whatIsMandatorySpace=Čo je povinný priestor?
generalSettings.access.whatIsMandatorySpace.paragraph1=Nastavenie priestoru ako povinného zaisťuje, že používateľom bude automaticky udelený prístup a nebudú sa môcť odhlásiť. Pomáha vystavovať používateľov kritickým oblastiam.
generalSettings.access.whatIsMandatorySpace.paragraph2=Napríklad povinný priestor „Komunikácia“, kam posúvate dôležité informácie, pomáha dostať sa ku všetkým členom.
generalSettings.access.whatIsMandatorySpace.paragraph3=Môžete vybrať povinné medzery na základe skupín používateľov.

