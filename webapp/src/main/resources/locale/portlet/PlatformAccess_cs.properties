generalSettings.access.whatIsExternalUser=Kdo je host?
generalSettings.access.whatIsExternalUser.paragraph1=Hosté mají omezený přístup a mohou se připojit k prostorům, pouze pokud je pozvou správci prostorů.
generalSettings.access.whatIsExternalUser.paragraph2=Nemají přístup k internímu obsahu, včetně interních prostorů, adresáře lidí a adresáře prostorů.
generalSettings.access.whatIsExternalUser.paragraph3=Jejich domovská stránka je přizpůsobena, aby se zabránilo jakémukoli neúmyslnému přístupu do vyhrazených oblastí.

generalSettings.access.whatIsSpaceHost=Kdo je správce prostoru?
generalSettings.access.whatIsSpaceHost.paragraph1=Když vytvoříte prostor pro zapojení komunity, automaticky se stanete správcem prostoru.
generalSettings.access.whatIsSpaceHost.paragraph2=To vám umožní konfigurovat prostor pro vaši komunitu, včetně správy členů, nastavení aplikací a správy obsahu.
generalSettings.access.whatIsSpaceHost.paragraph3=Doporučujeme také určit další členy jako správce prostoru, aby vám mohli podle potřeby pomáhat.

generalSettings.access.whatIsRegisteredUser=Co je registrovaný uživatel?
generalSettings.access.whatIsRegisteredUser.paragraph1=Uživatelé, kteří přistupují k naší platformě, patří do různých kategorií registrovaných uživatelů:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Otevřený přístup: Kdokoli se může zaregistrovat a po registraci se stává registrovaným uživatelem.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Omezený přístup: Přístup k platformě mají pouze uživatelé vytvoření a pozvaní správcem a jsou považováni za registrované uživatele.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Přístup pro hosty: Autorizovaní hosté s omezeným přístupem jsou také registrovaní uživatelé, ale jsou označeni jako „hosté“.

generalSettings.access.whatIsDefaultSpace=Co je výchozí prostor?
generalSettings.access.whatIsDefaultSpace.paragraph1=Nastavení výchozího prostoru zajistí, že noví uživatelé budou mít při prvním přihlášení automaticky přístup k tomuto prostoru.
generalSettings.access.whatIsDefaultSpace.paragraph2=To usnadňuje zapojení do komunity, protože nabízí prostory k prozkoumání před zapojením do dalších komunitních aktivit.
generalSettings.access.whatIsDefaultSpace.paragraph3=Uživatelé mohou prostor po přihlášení snadno opustit, pokud je nezajímá.

generalSettings.access.whatIsMandatorySpace=Co je to povinný prostor?
generalSettings.access.whatIsMandatorySpace.paragraph1=Nastavení prostoru jako povinného zajistí, že uživatelé automaticky získají přístup a nemohou se odhlásit. Tím je zajištěno zapojení uživatelů do klíčového obsahu a komunit.
generalSettings.access.whatIsMandatorySpace.paragraph2=Například označení prostoru „Komunikace“ jako povinného zaručí přístup všem a doručení zpráv.
generalSettings.access.whatIsMandatorySpace.paragraph3=Povinné prostory můžete určit podle profilu členství uživatele a přizpůsobit tak jeho přístup k profilovaným prostorům.

