generalSettings.access.whatIsExternalUser=什么是访客用户？
generalSettings.access.whatIsExternalUser.paragraph1=访客用户的访问权限有限，只有在受到空间管理员邀请时才能加入空间。
generalSettings.access.whatIsExternalUser.paragraph2=他们无法访问内部内容，包括内部空间、人员目录和空间目录。
generalSettings.access.whatIsExternalUser.paragraph3=他们的主页经过定制，以防止无意中访问受限区域。

generalSettings.access.whatIsSpaceHost=什么是空间管理员？
generalSettings.access.whatIsSpaceHost.paragraph1=当您为接纳一个社区而创建空间时，您将自动成为空间管理员。
generalSettings.access.whatIsSpaceHost.paragraph2=这允许您为您的社区配置空间，包括成员管理、应用程序设置和内容管理。
generalSettings.access.whatIsSpaceHost.paragraph3=我们还建议将其他成员设为空间管理员，让他们在需要时协助您。

generalSettings.access.whatIsRegisteredUser=什么是注册用户？
generalSettings.access.whatIsRegisteredUser.paragraph1=访问我们平台的用户分为以下几类注册用户：
generalSettings.access.whatIsRegisteredUser.paragraph2=1. 开放访问：任何人都可以注册，注册后即成为注册用户。
generalSettings.access.whatIsRegisteredUser.paragraph3=2. 受限访问：只有由管理员创建和邀请的用户才能访问平台，他们被视为注册用户。
generalSettings.access.whatIsRegisteredUser.paragraph4=3. 访客访问：获得授权的访客用户访问权限有限，他们也是注册用户，但被标识为“访客”。

generalSettings.access.whatIsDefaultSpace=什么是默认空间？
generalSettings.access.whatIsDefaultSpace.paragraph1=设置默认空间可确保新用户在首次登录时自动进入此空间。
generalSettings.access.whatIsDefaultSpace.paragraph2=这为社区成员提供了可在参与其他社区活动之前探索的空间，从而简化了社区入职流程。
generalSettings.access.whatIsDefaultSpace.paragraph3=如果用户登录后对该空间不感兴趣，仍可轻松退出。

generalSettings.access.whatIsMandatorySpace=什么是必选空间？
generalSettings.access.whatIsMandatorySpace.paragraph1=将空间设为必选可确保用户自动获得访问权限且无法退出。这可确保用户参与关键内容和社区。
generalSettings.access.whatIsMandatorySpace.paragraph2=例如，将“沟通”空间设为必选，可确保所有人都能访问并接收消息。
generalSettings.access.whatIsMandatorySpace.paragraph3=您可以根据用户的成员资格个人资料指定必选空间，从而为其定制可访问的空间。

