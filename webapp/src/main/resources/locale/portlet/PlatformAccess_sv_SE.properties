generalSettings.access.whatIsExternalUser=Vad är en gästanvändare?
generalSettings.access.whatIsExternalUser.paragraph1=Gästanvändare har begränsad åtkomst och kan bara gå med i utrymmen när de bjuds in av administratörer för utrymmen.
generalSettings.access.whatIsExternalUser.paragraph2=De har inte åtkomst till internt innehåll, inklusive interna utrymmen, personkatalogen och utrymmeskatalogen.
generalSettings.access.whatIsExternalUser.paragraph3=Deras startsida är anpassad för att förhindra oavsiktlig åtkomst till begränsade områden.

generalSettings.access.whatIsSpaceHost=Vad är en administratör för ett utrymme?
generalSettings.access.whatIsSpaceHost.paragraph1=När du skapar ett utrymme för att introducera en gemenskap blir du automatiskt administratör för utrymmet.
generalSettings.access.whatIsSpaceHost.paragraph2=Detta gör att du kan konfigurera utrymmet för din gemenskap, inklusive medlemshantering, appinställningar och innehållshantering.
generalSettings.access.whatIsSpaceHost.paragraph3=Vi rekommenderar också att du utser andra medlemmar till administratörer för utrymmet, så att de kan hjälpa dig vid behov.

generalSettings.access.whatIsRegisteredUser=Vad är en registrerad användare?
generalSettings.access.whatIsRegisteredUser.paragraph1=Användare som kommer åt vår plattform faller in i olika kategorier av registrerade användare:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Öppen åtkomst: Vem som helst kan registrera sig och blir då registrerad användare.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Begränsad åtkomst: Endast användare som skapats och bjudits in av administratören kan komma åt plattformen, och de anses vara registrerade användare.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Gäståtkomst: Behöriga gästanvändare, med begränsad åtkomst, är också registrerade användare men identifieras som "gäster".

generalSettings.access.whatIsDefaultSpace=Vad är ett standardutrymme?
generalSettings.access.whatIsDefaultSpace.paragraph1=När du anger ett standardutrymme får nya användare automatiskt åtkomst till utrymmet vid sin första inloggning.
generalSettings.access.whatIsDefaultSpace.paragraph2=Detta förenklar introduktionen i gemenskapen genom att erbjuda utrymmen att utforska innan användarna deltar i andra gemenskapsaktiviteter.
generalSettings.access.whatIsDefaultSpace.paragraph3=Användare kan ändå enkelt lämna utrymmet efter inloggningen om det inte intresserar dem.

generalSettings.access.whatIsMandatorySpace=Vad är ett obligatoriskt utrymme?
generalSettings.access.whatIsMandatorySpace.paragraph1=När du anger ett utrymme som obligatoriskt får användarna automatiskt åtkomst och kan inte välja bort det. Det säkerställer att användarna tar del av viktigt innehåll och viktiga gemenskaper.
generalSettings.access.whatIsMandatorySpace.paragraph2=Om du till exempel markerar utrymmet "Kommunikation" som obligatoriskt garanteras att alla har åtkomst och tar emot meddelanden.
generalSettings.access.whatIsMandatorySpace.paragraph3=Du kan ange obligatoriska utrymmen utifrån en användares medlemsprofil och anpassa åtkomsten till profilerade utrymmen.

