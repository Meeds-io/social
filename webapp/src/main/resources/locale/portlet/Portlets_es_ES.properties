GroupsManagement.organizationalUnit.help.paragraph3=Un subgrupo también puede designarse como unidad organizativa. En ese caso, los administradores delegados del subgrupo no pueden gestionar ni desactivar las cuentas de los administradores delegados que pertenecen a la unidad organizativa padre.


