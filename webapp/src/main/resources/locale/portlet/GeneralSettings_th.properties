generalSettings.access.whatIsExternalUser=ผู้ใช้ทั่วไปคืออะไร?
generalSettings.access.whatIsExternalUser.paragraph1=ผู้ใช้ที่เป็นแขกมีสิทธิ์การเข้าถึงที่จำกัดและสามารถเข้าร่วมพื้นที่ได้โดยคำเชิญเท่านั้น
generalSettings.access.whatIsExternalUser.paragraph2=พวกเขาไม่สามารถเข้าถึงเนื้อหาภายในได้ รวมถึงพื้นที่ภายใน ไดเร็กทอรีบุคคล และไดเร็กทอรีพื้นที่
generalSettings.access.whatIsExternalUser.paragraph3=หน้าแรกของพวกเขาแตกต่างกันเพื่อป้องกันการเข้าถึงพื้นที่จำกัดโดยไม่ได้ตั้งใจ

generalSettings.access.whatIsSpaceHost=ผู้ดูแลพื้นที่คืออะไร?
generalSettings.access.whatIsSpaceHost.paragraph1=เมื่อคุณสร้างพื้นที่เพื่อออนบอร์ดชุมชน คุณจะกลายเป็นผู้ดูแลพื้นที่โดยอัตโนมัติ
generalSettings.access.whatIsSpaceHost.paragraph2=ซึ่งจะทำให้คุณสามารถกำหนดค่าพื้นที่สำหรับชุมชนของคุณ รวมถึงการจัดการสมาชิก การตั้งค่าแอปพลิเคชัน และการจัดการเนื้อหา
generalSettings.access.whatIsSpaceHost.paragraph3=นอกจากนี้เรายังแนะนำให้ระบุสมาชิกคนอื่นๆ ว่าเป็นผู้ดูแลพื้นที่ เพื่อให้พวกเขาสามารถช่วยเหลือคุณได้ตามต้องการ

generalSettings.access.whatIsRegisteredUser=ผู้ใช้ที่ลงทะเบียนคืออะไร?
generalSettings.access.whatIsRegisteredUser.paragraph1=ผู้ใช้ที่ลงทะเบียนคือผู้ใช้ที่มีบัญชีที่ถูกต้อง สิ่งนี้สามารถเกิดขึ้นได้หลายวิธีขึ้นอยู่กับโหมดการเข้าถึง:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. การเข้าถึงแบบเปิด: ทุกคนสามารถสมัครได้ และเมื่อสมัครแล้ว พวกเขาจะกลายเป็นผู้ใช้ที่ลงทะเบียน
generalSettings.access.whatIsRegisteredUser.paragraph3=2. การเข้าถึงแบบจำกัด: เฉพาะผู้ใช้ที่สร้างและเชิญโดยผู้ดูแลระบบเท่านั้นที่สามารถลงชื่อเข้าใช้และถือเป็นผู้ใช้ที่ลงทะเบียนได้
generalSettings.access.whatIsRegisteredUser.paragraph4=3. การเข้าถึงของแขก: ผู้ใช้เกสท์ที่ได้รับอนุญาตซึ่งมีการเข้าถึงแบบจำกัดคือผู้ใช้ที่ลงทะเบียน แต่จะถูกระบุว่าเป็นแขกที่มี 🔹 หลังชื่อของพวกเขา

generalSettings.access.whatIsDefaultSpace=พื้นที่เริ่มต้นคืออะไร?
generalSettings.access.whatIsDefaultSpace.paragraph1=การตั้งค่าพื้นที่เริ่มต้นจะทำให้มั่นใจได้ว่าผู้ใช้ใหม่จะสามารถเข้าถึงพื้นที่นี้โดยอัตโนมัติเมื่อเข้าสู่ระบบครั้งแรก
generalSettings.access.whatIsDefaultSpace.paragraph2=สิ่งนี้ช่วยลดความซับซ้อนของการเริ่มต้นชุมชนโดยจัดให้มีพื้นที่ให้สำรวจก่อนที่จะมีส่วนร่วมในกิจกรรมชุมชนอื่นๆ
generalSettings.access.whatIsDefaultSpace.paragraph3=ผู้ใช้ยังสามารถออกจากพื้นที่ได้อย่างรวดเร็วหากพวกเขาไม่สนใจ

generalSettings.access.whatIsMandatorySpace=พื้นที่บังคับคืออะไร?
generalSettings.access.whatIsMandatorySpace.paragraph1=การกำหนดพื้นที่ให้บังคับจะทำให้ผู้ใช้ได้รับสิทธิ์เข้าถึงโดยอัตโนมัติและไม่สามารถยกเลิกได้ นอกจากนี้ยังช่วยให้ผู้ใช้เข้าถึงพื้นที่สำคัญๆ ได้อีกด้วย
generalSettings.access.whatIsMandatorySpace.paragraph2=ตัวอย่างเช่น ช่อง "การสื่อสาร" ที่จำเป็นต้องกรอกข้อมูลที่จำเป็น เพื่อให้สามารถเข้าถึงสมาชิกทุกคนได้
generalSettings.access.whatIsMandatorySpace.paragraph3=คุณสามารถเลือกพื้นที่บังคับตามกลุ่มผู้ใช้ได้

