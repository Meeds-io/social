generalSettings.access.whatIsExternalUser=What is a guest user?
generalSettings.access.whatIsExternalUser.paragraph1=Guest users have limited access and can only join spaces when invited by space admins.
generalSettings.access.whatIsExternalUser.paragraph2=Eles não podem acessar conteúdo interno, incluindo espaços internos, diretório de pessoas e diretórios de espaços.
generalSettings.access.whatIsExternalUser.paragraph3=Sua homepage está personalizada para evitar qualquer acesso não intencional a áreas restritas.

generalSettings.access.whatIsSpaceHost=O que é um host do espaço?
generalSettings.access.whatIsSpaceHost.paragraph1=Quando você cria um espaço para integrar uma comunidade, você automaticamente se torna um anfitrião do espaço.
generalSettings.access.whatIsSpaceHost.paragraph2=Isso permite a você configurar o espaço para sua comunidade, incluindo gerenciamento de membros, configurações de aplicativos e gerenciamento de conteúdo.
generalSettings.access.whatIsSpaceHost.paragraph3=Recomendamos também identificar outros membros como hosts do espaço, capacitando-os a ajudá-lo conforme necessário.

generalSettings.access.whatIsRegisteredUser=O que é um usuário registrado?
generalSettings.access.whatIsRegisteredUser.paragraph1=Os usuários que acessam nossa plataforma caem em diferentes categorias de usuários registrados:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acesso aberto: Qualquer um pode se registrar e, uma vez que o faça, eles se tornam usuários registrados.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acesso restrito: Somente usuários criados e convidados pelo administrador podem acessar a plataforma e eles são considerados usuários registrados.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Acesso externo: Usuários externos autorizados, com acesso limitado, também são usuários registrados, mas são identificados como "externos".

generalSettings.access.whatIsDefaultSpace=O que é um espaço padrão?
generalSettings.access.whatIsDefaultSpace.paragraph1=A configuração de um espaço padrão garante que novos usuários, após o seu primeiro login, acessem automaticamente este espaço.
generalSettings.access.whatIsDefaultSpace.paragraph2=Isso simplifica a integração com a comunidade fornecendo espaços para explorar antes de se envolver em outras atividades da comunidade.
generalSettings.access.whatIsDefaultSpace.paragraph3=Os usuários ainda podem sair facilmente do espaço se ele não os interessar após o login.

generalSettings.access.whatIsMandatorySpace=O que é um espaço obrigatório?
generalSettings.access.whatIsMandatorySpace.paragraph1=Definir um espaço como obrigatório garante que os usuários tenham acesso automaticamente concedido e não podem optar pelo opt-out. Isso garante um engajamento com conteúdo crítico e comunidades.
generalSettings.access.whatIsMandatorySpace.paragraph2=Por exemplo, marcar um espaço de "Comunicação" como uma garantia obrigatória de acesso universal e de recepção de mensagens.
generalSettings.access.whatIsMandatorySpace.paragraph3=Você pode especificar espaços obrigatórios com base no perfil de associação de um usuário, ajustando seus acessos aos espaços em destaque.

