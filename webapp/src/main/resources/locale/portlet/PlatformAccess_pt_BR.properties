generalSettings.access.whatIsExternalUser=What is an external user?
generalSettings.access.whatIsExternalUser.paragraph1=Usuários externos têm acesso limitado à plataforma e só podem entrar em espaços quando convidados por hosts do espaço.
generalSettings.access.whatIsExternalUser.paragraph2=Eles não podem acessar conteúdo interno, incluindo espaços internos, diretório de pessoas e diretórios de espaços.
generalSettings.access.whatIsExternalUser.paragraph3=Their homepage is customized to prevent any unintentional access to restricted areas.

generalSettings.access.whatIsSpaceHost=What is a space host?
generalSettings.access.whatIsSpaceHost.paragraph1=Quando você cria um espaço para integrar uma comunidade, você automaticamente se torna um anfitrião do espaço.
generalSettings.access.whatIsSpaceHost.paragraph2=Isso permite a você configurar o espaço para sua comunidade, incluindo gerenciamento de membros, configurações de aplicativos e gerenciamento de conteúdo.
generalSettings.access.whatIsSpaceHost.paragraph3=We also recommend identifying other members as space hosts, empowering them to assist you as needed.

generalSettings.access.whatIsRegisteredUser=What is a registered user?
generalSettings.access.whatIsRegisteredUser.paragraph1=Os usuários que acessam nossa plataforma caem em diferentes categorias de usuários registrados:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Access: Anyone can sign up, and once they do, they become registered users.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acesso restrito: Somente usuários criados e convidados pelo administrador podem acessar a plataforma e eles são considerados usuários registrados.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. External Access: Authorized external users, with limited access, are also registered users but are identified as "external".

generalSettings.access.whatIsDefaultSpace=What is a default space?
generalSettings.access.whatIsDefaultSpace.paragraph1=Setting a default space ensures that new users, upon their first login, will automatically access this space.
generalSettings.access.whatIsDefaultSpace.paragraph2=This simplifies community onboarding by providing spaces to explore before engaging in other community activities.
generalSettings.access.whatIsDefaultSpace.paragraph3=Users can still easily exit the space if it doesn't interest them after logging in.

generalSettings.access.whatIsMandatorySpace=What is a mandatory space?
generalSettings.access.whatIsMandatorySpace.paragraph1=Definir um espaço como obrigatório garante que os usuários tenham acesso automaticamente concedido e não podem optar pelo opt-out. Isso garante um engajamento com conteúdo crítico e comunidades.
generalSettings.access.whatIsMandatorySpace.paragraph2=For example, marking a "Communication" space as mandatory guarantees universal access and message reception.
generalSettings.access.whatIsMandatorySpace.paragraph3=You can specify mandatory spaces based on a user's membership profile, tailoring their access to profiled spaces.

