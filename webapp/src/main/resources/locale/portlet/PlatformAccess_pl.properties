generalSettings.access.whatIsExternalUser=Kim jest gość?
generalSettings.access.whatIsExternalUser.paragraph1=Goście mają ograniczony dostęp i mogą dołączać do przestrzeni tylko na zaproszenie administratorów przestrzeni.
generalSettings.access.whatIsExternalUser.paragraph2=Nie mają dostępu do treści wewnętrznych, w tym przestrzeni wewnętrznych, katalogu osób i katalogu przestrzeni.
generalSettings.access.whatIsExternalUser.paragraph3=Ich strona główna jest dostosowana, aby zapobiec niezamierzonemu dostępowi do ograniczonych obszarów.

generalSettings.access.whatIsSpaceHost=Kim jest administrator przestrzeni?
generalSettings.access.whatIsSpaceHost.paragraph1=Osoba, która tworzy przestrzeń dla społeczności, automatycznie zostaje jej administratorem.
generalSettings.access.whatIsSpaceHost.paragraph2=Umożliwia to skonfigurowanie przestrzeni dla społeczności, w tym zarządzanie członkami, ustawieniami aplikacji i treścią.
generalSettings.access.whatIsSpaceHost.paragraph3=Zalecamy również wyznaczenie innych członków na administratorów przestrzeni, aby mogli pomagać w razie potrzeby.

generalSettings.access.whatIsRegisteredUser=Kim jest zarejestrowany użytkownik?
generalSettings.access.whatIsRegisteredUser.paragraph1=Użytkownicy platformy należą do różnych kategorii użytkowników zarejestrowanych:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Otwarty dostęp: każdy może się zarejestrować i po rejestracji staje się użytkownikiem zarejestrowanym.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ograniczony dostęp: dostęp do platformy mają tylko użytkownicy utworzeni i zaproszeni przez administratora; są oni uznawani za użytkowników zarejestrowanych.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Dostęp dla gości: autoryzowani goście z ograniczonym dostępem są również użytkownikami zarejestrowanymi, ale są oznaczeni jako „goście”.

generalSettings.access.whatIsDefaultSpace=Czym jest domyślna przestrzeń?
generalSettings.access.whatIsDefaultSpace.paragraph1=Ustawienie domyślnej przestrzeni sprawi, że nowi użytkownicy, po pierwszym zalogowaniu, automatycznie uzyskają dostęp do tej przestrzeni.
generalSettings.access.whatIsDefaultSpace.paragraph2=Ułatwia to wdrażanie w społeczności, udostępniając przestrzenie do poznania przed podjęciem innych aktywności w społeczności.
generalSettings.access.whatIsDefaultSpace.paragraph3=Po zalogowaniu użytkownicy mogą łatwo opuścić przestrzeń, jeśli ich nie interesuje.

generalSettings.access.whatIsMandatorySpace=Czym jest przestrzeń obowiązkowa?
generalSettings.access.whatIsMandatorySpace.paragraph1=Ustawienie przestrzeni jako obowiązkowej sprawia, że użytkownicy automatycznie uzyskują do niej dostęp i nie mogą zrezygnować. Zapewnia to zaangażowanie użytkowników w kluczowe treści i społeczności.
generalSettings.access.whatIsMandatorySpace.paragraph2=Na przykład oznaczenie przestrzeni „Komunikacja” jako obowiązkowej gwarantuje powszechny dostęp i odbiór komunikatów.
generalSettings.access.whatIsMandatorySpace.paragraph3=Obowiązkowe przestrzenie można określić na podstawie profilu członkostwa użytkownika, dostosowując dostęp do profilowanych przestrzeni.

