generalSettings.access.whatIsExternalUser=Кто такой гость?
generalSettings.access.whatIsExternalUser.paragraph1=Гости имеют ограниченный доступ и могут вступать в пространства только по приглашению администраторов пространств.
generalSettings.access.whatIsExternalUser.paragraph2=Им недоступен внутренний контент, включая внутренние пространства, каталог людей и каталог пространств.
generalSettings.access.whatIsExternalUser.paragraph3=Их домашняя страница настроена так, чтобы исключить случайный доступ к закрытым разделам.

generalSettings.access.whatIsSpaceHost=Кто такой администратор пространства?
generalSettings.access.whatIsSpaceHost.paragraph1=Когда вы создаете пространство для привлечения сообщества, вы автоматически становитесь администратором пространства.
generalSettings.access.whatIsSpaceHost.paragraph2=Это позволяет вам настраивать пространство для вашего сообщества, включая управление участниками, настройки приложений и управление контентом.
generalSettings.access.whatIsSpaceHost.paragraph3=Мы также рекомендуем назначить администраторами пространства других участников, чтобы они могли помогать вам при необходимости.

generalSettings.access.whatIsRegisteredUser=Что такое зарегистрированный пользователь?
generalSettings.access.whatIsRegisteredUser.paragraph1=Пользователи, имеющие доступ к платформе, относятся к разным категориям зарегистрированных пользователей:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Открытый доступ: зарегистрироваться может любой, после чего он становится зарегистрированным пользователем.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ограниченный доступ: доступ к платформе есть только у пользователей, созданных и приглашенных администратором, и они считаются зарегистрированными пользователями.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Гостевой доступ: авторизованные гости с ограниченным доступом также являются зарегистрированными пользователями, но обозначаются как «гости».

generalSettings.access.whatIsDefaultSpace=Что такое пространство по умолчанию?
generalSettings.access.whatIsDefaultSpace.paragraph1=Пространство по умолчанию гарантирует, что новые пользователи при первом входе автоматически получат доступ к этому пространству.
generalSettings.access.whatIsDefaultSpace.paragraph2=Это упрощает вовлечение в сообщество: у пользователей есть пространства для знакомства до участия в других активностях сообщества.
generalSettings.access.whatIsDefaultSpace.paragraph3=Пользователи по-прежнему могут легко покинуть пространство после входа, если оно им неинтересно.

generalSettings.access.whatIsMandatorySpace=Что такое обязательное пространство?
generalSettings.access.whatIsMandatorySpace.paragraph1=Если пространство отмечено как обязательное, пользователи автоматически получают к нему доступ и не могут от него отказаться. Это обеспечивает вовлечение пользователей в важный контент и сообщества.
generalSettings.access.whatIsMandatorySpace.paragraph2=Например, если отметить пространство «Коммуникации» как обязательное, все пользователи гарантированно получат к нему доступ и будут получать сообщения.
generalSettings.access.whatIsMandatorySpace.paragraph3=Вы можете задавать обязательные пространства на основе членства пользователя, адаптируя его доступ к профильным пространствам.

generalSettings.access.restrictedChangeInformation1=Только зарегистрированные пользователи смогут получить доступ к платформе.
generalSettings.access.restrictedChangeInformation2=Это не повлияет на уже существующих пользователей
generalSettings.access.openChangeInformation1=Каждый сможет получить доступ к платформе посредством самостоятельной регистрации.
generalSettings.access.openChangeInformation2=Это не повлияет на уже существующих пользователей
