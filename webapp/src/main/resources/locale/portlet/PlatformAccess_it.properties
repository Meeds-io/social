generalSettings.access.whatIsExternalUser=Che cos'è un utente ospite?
generalSettings.access.whatIsExternalUser.paragraph1=Gli utenti ospiti hanno un accesso limitato e possono unirsi agli spazi solo su invito dei gestori degli spazi.
generalSettings.access.whatIsExternalUser.paragraph2=Non possono accedere a contenuti interni, compresi gli spazi interni, la directory delle persone e la directory degli spazi.
generalSettings.access.whatIsExternalUser.paragraph3=La loro homepage è personalizzata per evitare qualsiasi accesso involontario alle aree riservate.

generalSettings.access.whatIsSpaceHost=Che cos'è un gestore dello spazio?
generalSettings.access.whatIsSpaceHost.paragraph1=Quando crea uno spazio per accogliere una comunità, Lei diventa automaticamente gestore dello spazio.
generalSettings.access.whatIsSpaceHost.paragraph2=Questo Le permette di configurare lo spazio per la Sua comunità, compresa la gestione dei membri, le impostazioni delle applicazioni e la gestione dei contenuti.
generalSettings.access.whatIsSpaceHost.paragraph3=Le consigliamo inoltre di designare altri membri come gestori dello spazio, affinché possano assisterLa quando necessario.

generalSettings.access.whatIsRegisteredUser=Cos'è un utente registrato?
generalSettings.access.whatIsRegisteredUser.paragraph1=Gli utenti che accedono alla piattaforma rientrano in diverse categorie di utenti registrati:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Accesso aperto: Chiunque può iscriversi e, una volta fatto, diventa un utente registrato.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Accesso limitato: Solo gli utenti creati e invitati dall'amministratore possono accedere alla piattaforma e sono considerati utenti registrati.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Accesso ospite: gli utenti ospiti autorizzati, con accesso limitato, sono anch'essi utenti registrati ma sono identificati come "ospiti".

generalSettings.access.whatIsDefaultSpace=Che cos'è uno spazio predefinito?
generalSettings.access.whatIsDefaultSpace.paragraph1=L'impostazione di uno spazio predefinito assicura che i nuovi utenti si uniscano automaticamente a questo spazio, al primo accesso.
generalSettings.access.whatIsDefaultSpace.paragraph2=Questo semplifica l'inserimento nella comunità, offrendo spazi da esplorare prima di partecipare ad altre attività della comunità.
generalSettings.access.whatIsDefaultSpace.paragraph3=Dopo l'accesso, gli utenti possono comunque uscire facilmente dallo spazio se non è di loro interesse.

generalSettings.access.whatIsMandatorySpace=Che cos'è uno spazio obbligatorio?
generalSettings.access.whatIsMandatorySpace.paragraph1=L'impostazione di uno spazio come obbligatorio garantisce che gli utenti vi abbiano accesso automaticamente e non possano abbandonarlo. Questo assicura il coinvolgimento degli utenti con contenuti e comunità essenziali.
generalSettings.access.whatIsMandatorySpace.paragraph2=Ad esempio, rendere obbligatorio uno spazio "Comunicazione" garantisce a tutti l'accesso e la ricezione dei messaggi.
generalSettings.access.whatIsMandatorySpace.paragraph3=È possibile specificare spazi obbligatori in base al profilo di appartenenza dell'utente, adattandone l'accesso agli spazi profilati.

