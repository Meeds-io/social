generalSettings.access.whatIsExternalUser=ゲストユーザーとは？
generalSettings.access.whatIsExternalUser.paragraph1=ゲストユーザーのアクセスは制限されており、スペース管理者に招待された場合にのみスペースに参加できます。
generalSettings.access.whatIsExternalUser.paragraph2=内部スペース、ユーザーディレクトリ、スペースディレクトリなどの内部コンテンツにはアクセスできません。
generalSettings.access.whatIsExternalUser.paragraph3=ホームページは、制限された領域に意図せずアクセスすることがないようカスタマイズされています。

generalSettings.access.whatIsSpaceHost=スペース管理者とは？
generalSettings.access.whatIsSpaceHost.paragraph1=コミュニティを迎え入れるためにスペースを作成すると、自動的にスペース管理者になります。
generalSettings.access.whatIsSpaceHost.paragraph2=これにより、メンバー管理、アプリケーション設定、コンテンツ管理など、コミュニティ向けにスペースを設定できます。
generalSettings.access.whatIsSpaceHost.paragraph3=他のメンバーもスペース管理者に指定し、必要に応じてサポートしてもらうことをお勧めします。

generalSettings.access.whatIsRegisteredUser=登録ユーザーとは？
generalSettings.access.whatIsRegisteredUser.paragraph1=プラットフォームにアクセスするユーザーは、次のような登録ユーザーのカテゴリーに分かれます:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. オープンアクセス: 誰でもサインアップでき、サインアップすると登録ユーザーになります。
generalSettings.access.whatIsRegisteredUser.paragraph3=2. 制限付きアクセス: 管理者が作成して招待したユーザーのみがプラットフォームにアクセスでき、これらのユーザーは登録ユーザーとみなされます。
generalSettings.access.whatIsRegisteredUser.paragraph4=3. ゲストアクセス: アクセスが制限された承認済みのゲストユーザーも登録ユーザーですが、「ゲスト」として識別されます。

generalSettings.access.whatIsDefaultSpace=デフォルトのスペースとは？
generalSettings.access.whatIsDefaultSpace.paragraph1=デフォルトのスペースを設定すると、新規ユーザーは初回ログイン時に自動的にこのスペースにアクセスできます。
generalSettings.access.whatIsDefaultSpace.paragraph2=他のコミュニティ活動に参加する前に探索できるスペースを用意することで、コミュニティへのオンボーディングが簡単になります。
generalSettings.access.whatIsDefaultSpace.paragraph3=ログイン後に興味がなければ、ユーザーはいつでも簡単にスペースから退出できます。

generalSettings.access.whatIsMandatorySpace=必須スペースとは？
generalSettings.access.whatIsMandatorySpace.paragraph1=スペースを必須に設定すると、ユーザーには自動的にアクセス権が付与され、オプトアウトできなくなります。これにより、重要なコンテンツやコミュニティへのユーザーの参加を確実にします。
generalSettings.access.whatIsMandatorySpace.paragraph2=たとえば、「コミュニケーション」スペースを必須にすると、全員がアクセスしてメッセージを受け取れるようになります。
generalSettings.access.whatIsMandatorySpace.paragraph3=ユーザーのメンバーシッププロフィールに基づいて必須スペースを指定し、プロフィールに応じたスペースへのアクセスを調整できます。

