generalSettings.access.whatIsExternalUser=Apa itu pengguna tamu?
generalSettings.access.whatIsExternalUser.paragraph1=Pengguna tamu memiliki akses terbatas dan hanya dapat bergabung dengan ruang jika diundang oleh admin ruang.
generalSettings.access.whatIsExternalUser.paragraph2=Mereka tidak dapat mengakses konten internal, termasuk ruang internal, direktori orang, dan direktori ruang.
generalSettings.access.whatIsExternalUser.paragraph3=Halaman beranda mereka disesuaikan untuk mencegah akses yang tidak disengaja ke area terbatas.

generalSettings.access.whatIsSpaceHost=Apa itu admin ruang?
generalSettings.access.whatIsSpaceHost.paragraph1=Saat Anda membuat ruang untuk menghimpun komunitas, Anda otomatis menjadi admin ruang.
generalSettings.access.whatIsSpaceHost.paragraph2=Ini memungkinkan Anda mengonfigurasi ruang untuk komunitas Anda, termasuk pengelolaan anggota, pengaturan aplikasi, dan pengelolaan konten.
generalSettings.access.whatIsSpaceHost.paragraph3=Kami juga menyarankan untuk menetapkan anggota lain sebagai admin ruang, agar mereka dapat membantu Anda sesuai kebutuhan.

generalSettings.access.whatIsRegisteredUser=Apa itu pengguna terdaftar?
generalSettings.access.whatIsRegisteredUser.paragraph1=Pengguna yang mengakses platform kami terbagi ke dalam beberapa kategori pengguna terdaftar:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Akses Terbuka: Siapa pun dapat mendaftar, dan setelah mereka melakukannya, mereka menjadi pengguna terdaftar.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Akses Terbatas: Hanya pengguna yang dibuat dan diundang oleh administrator yang dapat mengakses platform, dan mereka dianggap sebagai pengguna terdaftar.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Akses Tamu: Pengguna tamu yang diizinkan, dengan akses terbatas, juga merupakan pengguna terdaftar tetapi diidentifikasi sebagai "tamu".

generalSettings.access.whatIsDefaultSpace=Apa itu ruang bawaan?
generalSettings.access.whatIsDefaultSpace.paragraph1=Menetapkan ruang bawaan memastikan bahwa pengguna baru, saat pertama kali masuk, akan otomatis mengakses ruang ini.
generalSettings.access.whatIsDefaultSpace.paragraph2=Hal ini menyederhanakan orientasi komunitas dengan menyediakan ruang untuk bereksplorasi sebelum terlibat dalam aktivitas komunitas lainnya.
generalSettings.access.whatIsDefaultSpace.paragraph3=Pengguna tetap dapat dengan mudah keluar dari ruang jika ruang tersebut tidak menarik bagi mereka setelah masuk.

generalSettings.access.whatIsMandatorySpace=Apa itu ruang wajib?
generalSettings.access.whatIsMandatorySpace.paragraph1=Menetapkan ruang sebagai wajib memastikan pengguna otomatis mendapatkan akses dan tidak dapat memilih keluar. Hal ini memastikan keterlibatan pengguna dengan konten dan komunitas penting.
generalSettings.access.whatIsMandatorySpace.paragraph2=Misalnya, menandai ruang "Komunikasi" sebagai wajib menjamin akses untuk semua orang dan penerimaan pesan.
generalSettings.access.whatIsMandatorySpace.paragraph3=Anda dapat menentukan ruang wajib berdasarkan profil keanggotaan pengguna, sehingga akses mereka disesuaikan ke ruang yang diprofilkan.

