generalSettings.access.whatIsExternalUser=Ce este un utilizator extern?
generalSettings.access.whatIsExternalUser.paragraph1=Utilizatorii externi au acces limitat la platformă și se pot alătura spațiilor doar atunci când sunt invitați de gazdele spațiale.
generalSettings.access.whatIsExternalUser.paragraph2=Nu pot accesa conținutul intern, inclusiv spațiile interne, directorul de persoane și directorul de spații.
generalSettings.access.whatIsExternalUser.paragraph3=Pagina lor de start este personalizată pentru a preveni orice acces neintenționat la zonele restricționate.

generalSettings.access.whatIsSpaceHost=Ce este o gazdă a spațiului?
generalSettings.access.whatIsSpaceHost.paragraph1=Când creezi un spaţiu pentru a intra într-o comunitate, devii automat o gazdă de spaţiu.
generalSettings.access.whatIsSpaceHost.paragraph2=Acest lucru vă permite să configurați spațiul pentru comunitatea dvs., inclusiv managementul membrilor, setările aplicației și gestionarea conținutului.
generalSettings.access.whatIsSpaceHost.paragraph3=De asemenea, recomandăm identificarea altor membri ca gazde spațiale, permițându-le să te asiste după cum este necesar.

generalSettings.access.whatIsRegisteredUser=Ce este un utilizator înregistrat?
generalSettings.access.whatIsRegisteredUser.paragraph1=Utilizatorii care accesează platforma noastră se încadrează în diferite categorii de utilizatori înregistrați:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acces liber: Oricine se poate înregistra, şi odată ce o fac, devine utilizatori înregistraţi.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acces restricționat: Numai utilizatorii creați și invitați de un administrator se pot conecta și pot fi considerați utilizatori înregistrați.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Acces extern: Utilizatorii externi autorizaţi, cu acces limitat, sunt, de asemenea, utilizatori înregistraţi, dar sunt identificaţi ca "externi".

generalSettings.access.whatIsDefaultSpace=Ce este spațiul implicit?
generalSettings.access.whatIsDefaultSpace.paragraph1=Setarea unui spaţiu implicit asigură că utilizatorii noi, la prima lor conectare, vor accesa automat acest spaţiu.
generalSettings.access.whatIsDefaultSpace.paragraph2=Aceasta simplifică înregistrarea în comunitate prin asigurarea de spații pentru explorare înainte de a se angaja în alte activități comunitare.
generalSettings.access.whatIsDefaultSpace.paragraph3=Utilizatorii pot ieși cu ușurință din spațiu dacă nu îi interesează după autentificare.

generalSettings.access.whatIsMandatorySpace=Ce este un spațiu obligatoriu?
generalSettings.access.whatIsMandatorySpace.paragraph1=Stabilirea unui spațiu ca obligatoriu asigură că utilizatorilor li se acordă automat acces și nu pot renunța. Acest lucru asigură implicarea utilizatorilor în conținut critic și comunități.
generalSettings.access.whatIsMandatorySpace.paragraph2=De exemplu, marcarea unui spaţiu de „comunicare” ca obligatoriu garantează accesul universal şi recepţia mesajelor.
generalSettings.access.whatIsMandatorySpace.paragraph3=Poți specifica spații obligatorii bazate pe profilul de membru al unui utilizator, adaptându-și accesul la spațiile profilate.

