generalSettings.access.whatIsExternalUser=¿Qué es un usuario invitado?
generalSettings.access.whatIsExternalUser.paragraph1=Los usuarios invitados tienen un acceso limitado y solo pueden unirse a espacios cuando los invitan los administradores de espacio.
generalSettings.access.whatIsExternalUser.paragraph2=No pueden acceder al contenido interno, incluidos los espacios internos, el directorio de personas y el directorio de espacios.
generalSettings.access.whatIsExternalUser.paragraph3=Su página de inicio está personalizada para evitar cualquier acceso involuntario a zonas restringidas.

generalSettings.access.whatIsSpaceHost=¿Qué es un anfitrión espacial?
generalSettings.access.whatIsSpaceHost.paragraph1=Cuando crea un espacio para incorporar a una comunidad, se convierte automáticamente en anfitrión del espacio.
generalSettings.access.whatIsSpaceHost.paragraph2=Esto le permite configurar el espacio para su comunidad, incluyendo administración de miembros, configuración de aplicaciones y gestión de contenido.
generalSettings.access.whatIsSpaceHost.paragraph3=También le recomendamos designar a otros miembros como anfitriones del espacio, para que puedan ayudarle cuando sea necesario.

generalSettings.access.whatIsRegisteredUser=¿Qué es un usuario registrado?
generalSettings.access.whatIsRegisteredUser.paragraph1=Los usuarios que acceden a nuestra plataforma se dividen en distintas categorías de usuarios registrados:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acceso abierto: cualquiera puede registrarse y, una vez registrado, se convierte en usuario registrado.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acceso restringido: solo los usuarios creados e invitados por el administrador pueden acceder a la plataforma, y se consideran usuarios registrados.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Acceso de invitados: los usuarios invitados autorizados, con acceso limitado, también son usuarios registrados, pero se identifican como "invitados".

generalSettings.access.whatIsDefaultSpace=¿Qué es un espacio por defecto?
generalSettings.access.whatIsDefaultSpace.paragraph1=Establecer un espacio por defecto garantiza que los nuevos usuarios accedan automáticamente a este espacio en su primer inicio de sesión.
generalSettings.access.whatIsDefaultSpace.paragraph2=Esto simplifica la incorporación de la comunidad proporcionando espacios para explorar antes de participar en otras actividades comunitarias.
generalSettings.access.whatIsDefaultSpace.paragraph3=Los usuarios pueden salir fácilmente del espacio después de iniciar sesión si no les interesa.

generalSettings.access.whatIsMandatorySpace=¿Qué es un espacio obligatorio?
generalSettings.access.whatIsMandatorySpace.paragraph1=Establecer un espacio como obligatorio garantiza que los usuarios obtengan acceso automáticamente y no puedan abandonarlo. Así se asegura la participación de los usuarios en los contenidos y comunidades esenciales.
generalSettings.access.whatIsMandatorySpace.paragraph2=Por ejemplo, marcar un espacio "Comunicación" como obligatorio garantiza que todos tengan acceso y reciban los mensajes.
generalSettings.access.whatIsMandatorySpace.paragraph3=Puede especificar espacios obligatorios según el perfil de pertenencia de un usuario, adaptando su acceso a los espacios correspondientes a su perfil.

