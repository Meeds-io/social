generalSettings.access.whatIsExternalUser=ما هو المستخدم الخارجي؟
generalSettings.access.whatIsExternalUser.paragraph1=للمستخدمين الخارجيين إمكانية محدودة للوصول إلى المنصة ويمكنهم الانضمام إلى المساحات فقط عند دعوتهم من قبل مضيفي الفضاء.
generalSettings.access.whatIsExternalUser.paragraph2=لا يمكنهم الوصول إلى المحتوى الداخلي، بما في ذلك المساحات الداخلية، ودليل الأشخاص، ودليل المسافات.
generalSettings.access.whatIsExternalUser.paragraph3=صفحة الاستقبال مصممة لمنع أي وصول غير مقصود إلى المناطق المحظورة.

generalSettings.access.whatIsSpaceHost=ما هو مسؤول الفضاء؟
generalSettings.access.whatIsSpaceHost.paragraph1=عند إنشاء مساحة على متن مجتمع ما، تصبح تلقائياً مضيفاً للفضاء.
generalSettings.access.whatIsSpaceHost.paragraph2=هذا يسمح لك بتهيئة المساحة لمجتمعك، بما في ذلك إدارة الأعضاء، وإعدادات التطبيق، وإدارة المحتوى.
generalSettings.access.whatIsSpaceHost.paragraph3=ونوصي أيضا بتحديد الأعضاء الآخرين بوصفهم مضيفين للفضاء، وتمكينهم من مساعدتك حسب الحاجة.

generalSettings.access.whatIsRegisteredUser=ما هو المستخدم المسجل؟
generalSettings.access.whatIsRegisteredUser.paragraph1=المستخدمين الذين يصلون إلى منصتنا يندرجون في فئات مختلفة من المستخدمين المسجلين:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. الوصول المفتوح: يمكن لأي شخص أن يسجل، وبمجرد القيام بذلك، يصبح مستخدمين مسجلين.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. الوصول المقيد: يمكن فقط للمستخدمين الذين تم إنشاؤهم ودعوتهم بواسطة المسؤول تسجيل الدخول واعتبارهم مستخدمين مسجلين.
generalSettings.access.whatIsRegisteredUser.paragraph4=3 - الوصول الخارجي: المستعملون الخارجيون المصرح لهم بالوصول المحدود، هم أيضا مستخدمون مسجلون ولكنهم يعتبرون ”خارجيين“.

generalSettings.access.whatIsDefaultSpace=ما هي المساحة الافتراضية؟
generalSettings.access.whatIsDefaultSpace.paragraph1=ويضمن تعيين المساحة الافتراضية للمستخدمين الجدد، عند تسجيل دخولهم الأول، الوصول تلقائياً إلى هذا الفضاء.
generalSettings.access.whatIsDefaultSpace.paragraph2=وهذا يبسِّط عملية الصعود إلى داخل المجتمع المحلي بتوفير أماكن لاستكشافها قبل الانخراط في أنشطة مجتمعية أخرى.
generalSettings.access.whatIsDefaultSpace.paragraph3=يمكن للمستخدمين الخروج بسهولة من المساحة إذا لم يهتمهم بعد تسجيل الدخول.

generalSettings.access.whatIsMandatorySpace=ما هو الحيز الإلزامي؟
generalSettings.access.whatIsMandatorySpace.paragraph1=ويضمن تعيين مساحة إلزامية وصول المستخدمين تلقائيًا ولا يمكن اختيارهم للخروج. وهذا يضمن مشاركة المستخدمين مع المحتوى الحيوي والمجتمعات المحلية.
generalSettings.access.whatIsMandatorySpace.paragraph2=وعلى سبيل المثال، فإن وضع علامة على فضاء "الاتصال" كعنصر إلزامي يضمن الوصول الشامل واستقبال الرسائل.
generalSettings.access.whatIsMandatorySpace.paragraph3=يمكنك تحديد المساحات الإلزامية استناداً إلى الملف الشخصي لعضوية المستخدم، وتكييف وصولهم إلى المساحات الشخصية.

