generalSettings.access.whatIsExternalUser=מהו משתמש אורח?
generalSettings.access.whatIsExternalUser.paragraph1=למשתמשים אורחים יש גישה מוגבלת והם יכולים להצטרף למרחבים רק על ידי הזמנה.
generalSettings.access.whatIsExternalUser.paragraph2=הם לא יכולים לגשת לתוכן פנימי, כולל חללים פנימיים, ספריית האנשים וספריית החלל.
generalSettings.access.whatIsExternalUser.paragraph3=דף הבית שלהם שונה כדי למנוע כל גישה לא מכוונת לאזורים מוגבלים.

generalSettings.access.whatIsSpaceHost=מה זה מנהל שטח?
generalSettings.access.whatIsSpaceHost.paragraph1=כאשר אתה יוצר מרחב להכנסת קהילה, אתה הופך אוטומטית למנהל מרחב.
generalSettings.access.whatIsSpaceHost.paragraph2=זה מאפשר לך להגדיר את המרחב עבור הקהילה שלך, כולל ניהול חברים, הגדרות יישומים וניהול תוכן.
generalSettings.access.whatIsSpaceHost.paragraph3=אנו ממליצים גם לזהות חברים אחרים כמנהלי שטח, להעצים אותם לסייע לך לפי הצורך.

generalSettings.access.whatIsRegisteredUser=מהו משתמש רשום?
generalSettings.access.whatIsRegisteredUser.paragraph1=משתמשים רשומים הם משתמשים שיש להם חשבון חוקי. זה יכול לקרות בדרכים שונות בהתאם למצב הגישה:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. גישה פתוחה: כל אחד יכול להירשם, וברגע שהוא עושה זאת, הם הופכים למשתמשים רשומים.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. גישה מוגבלת: רק משתמשים שנוצרו והוזמנו על ידי מנהל מערכת יכולים להיכנס ולהיחשב כמשתמשים רשומים.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. גישת אורח: משתמשים אורחים מורשים עם גישה מוגבלת הם משתמשים רשומים אך מזוהים כאורחים עם 🔹 אחרי שמם.

generalSettings.access.whatIsDefaultSpace=מהו מרחב ברירת מחדל?
generalSettings.access.whatIsDefaultSpace.paragraph1=הגדרת מרחב ברירת מחדל מבטיחה שמשתמשים חדשים, עם הכניסה הראשונה שלהם, יגשו אוטומטית למרחב זה.
generalSettings.access.whatIsDefaultSpace.paragraph2=זה מפשט את ההצטרפות לקהילה על ידי מתן מרחבים לחקור לפני השתתפות בפעילויות קהילתיות אחרות.
generalSettings.access.whatIsDefaultSpace.paragraph3=משתמשים עדיין יכולים לעזוב במהירות את המקום אם הם לא מעוניינים.

generalSettings.access.whatIsMandatorySpace=מהו חלל חובה?
generalSettings.access.whatIsMandatorySpace.paragraph1=הגדרת מרחב כחובה מבטיחה שהמשתמשים יקבלו גישה אוטומטית ולא יוכלו לבטל את הסכמתם. זה עוזר לחשוף את המשתמשים לאזורים קריטיים.
generalSettings.access.whatIsMandatorySpace.paragraph2=לדוגמה, מרחב "תקשורת" חובה שבו אתה דוחף מידע חיוני עוזר להגיע לכל החברים.
generalSettings.access.whatIsMandatorySpace.paragraph3=ניתן לבחור מרחבים חובה על סמך קבוצות משתמשים.

