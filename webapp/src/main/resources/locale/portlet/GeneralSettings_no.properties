generalSettings.access.whatIsExternalUser=Hva er en ekstern bruker?
generalSettings.access.whatIsExternalUser.paragraph1=Eksterne brukere har begrenset tilgang til plattformer, og kan bare bli med i mellomrom når de blir invitert av vertene.
generalSettings.access.whatIsExternalUser.paragraph2=De har ikke tilgang til internt innhold, inkludert interne plasser, folkemappen, og mellomrom katalogen.
generalSettings.access.whatIsExternalUser.paragraph3=Hjemmesiden blir tilpasset for å forhindre utilsiktet tilgang til begrensede områder.

generalSettings.access.whatIsSpaceHost=Hva er verten til rommet?
generalSettings.access.whatIsSpaceHost.paragraph1=Når du oppretter et lokale for å ombord i et fellesskap, blir du automatisk en romvert.
generalSettings.access.whatIsSpaceHost.paragraph2=Dette gjør at du kan konfigurere området for ditt samfunn, inkludert medlems administrasjon, programinnstillinger og innholdshåndtering.
generalSettings.access.whatIsSpaceHost.paragraph3=Vi anbefaler også å identifisere andre medlemmer som verter, gi dem muligheten til å hjelpe deg ved behov.

generalSettings.access.whatIsRegisteredUser=Hva er en registrert bruker?
generalSettings.access.whatIsRegisteredUser.paragraph1=Brukere som har tilgang til vår plattform, faller inn i ulike kategorier av registrerte brukere:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Åpne tilgang: Alle kan registrere seg og når de har gjort det, blir de registrerte brukere.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Begrenset tilgang: Bare brukere opprettet og invitert av en administrator kan logge på og betraktes som registrerte brukere.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Ekstern tilgang: Autoriserte eksterne brukere, med begrenset tilgang, er også registrerte brukere, men identifisert som "eksternt".

generalSettings.access.whatIsDefaultSpace=Hva er et standardgrupperom?
generalSettings.access.whatIsDefaultSpace.paragraph1=Ved å sette et standardområde sikrer du at nye brukere, ved første innlogging, får du automatisk tilgang til dette fellesskapet.
generalSettings.access.whatIsDefaultSpace.paragraph2=Dette forenkler fellesskapets onboarding ved å la rommene utforske før de deltar i andre samfunnsaktiviteter.
generalSettings.access.whatIsDefaultSpace.paragraph3=Brukere kan fremdeles enkelt forlate plassen hvis den ikke interesserer seg etter innlogging.

generalSettings.access.whatIsMandatorySpace=Hva er et obligatorisk mellomrom?
generalSettings.access.whatIsMandatorySpace.paragraph1=Å angi et mellomrom som obligatorisk sørger for at brukerne automatisk får tilgang og ikke kan velge ut. Dette sikrer at brukeren går inn med kritisk innhold og samfunn.
generalSettings.access.whatIsMandatorySpace.paragraph2=For eksempel vil merking av «Kommunikasjon» plass som obligatoriske garantier for universell tilgang og mottakelse av budskap.
generalSettings.access.whatIsMandatorySpace.paragraph3=Du kan angi obligatoriske fellesskap basert på en brukers medlemskapsprofil, og tilpasse deres tilgang til profilerte lokaler.

