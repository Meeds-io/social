generalSettings.access.whatIsExternalUser=게스트 사용자란 무엇입니까?
generalSettings.access.whatIsExternalUser.paragraph1=게스트 사용자는 액세스가 제한되어 있으며 초대를 통해서만 공간에 참여할 수 있습니다.
generalSettings.access.whatIsExternalUser.paragraph2=내부 스페이스, 사용자 디렉터리, 스페이스 디렉터리를 포함한 내부 콘텐츠에 액세스할 수 없습니다.
generalSettings.access.whatIsExternalUser.paragraph3=제한 구역에 의도치 않게 접근하는 것을 방지하기 위해 홈페이지가 다릅니다.

generalSettings.access.whatIsSpaceHost=스페이스 관리자란 무엇인가요?
generalSettings.access.whatIsSpaceHost.paragraph1=커뮤니티에 온보딩하기 위해 공간을 만들면 자동으로 공간 관리자가 됩니다.
generalSettings.access.whatIsSpaceHost.paragraph2=이를 통해 회원 관리, 애플리케이션 설정, 콘텐츠 관리 등 커뮤니티 공간을 구성할 수 있습니다.
generalSettings.access.whatIsSpaceHost.paragraph3=또한 다른 구성원을 스페이스 관리자로 식별하여 필요에 따라 귀하를 지원할 수 있는 권한을 부여하는 것이 좋습니다.

generalSettings.access.whatIsRegisteredUser=등록된 사용자란 무엇입니까?
generalSettings.access.whatIsRegisteredUser.paragraph1=등록된 사용자는 유효한 계정을 가지고 있는 사용자입니다. 이는 액세스 모드에 따라 다양한 방식으로 발생할 수 있습니다.
generalSettings.access.whatIsRegisteredUser.paragraph2=1. 오픈 액세스(Open Access): 누구나 가입할 수 있으며 가입하면 등록된 사용자가 됩니다.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. 접근 제한: 관리자가 생성하고 초대한 사용자만 로그인할 수 있으며 등록된 사용자로 간주됩니다.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. 게스트 액세스: 제한된 액세스 권한을 가진 승인된 게스트 사용자는 등록된 사용자이지만 이름 뒤에 🔹가 표시되어 게스트로 식별됩니다.

generalSettings.access.whatIsDefaultSpace=기본 공간이란 무엇입니까?
generalSettings.access.whatIsDefaultSpace.paragraph1=기본 공간을 설정하면 신규 사용자가 처음 로그인할 때 자동으로 이 공간에 액세스할 수 있습니다.
generalSettings.access.whatIsDefaultSpace.paragraph2=이는 다른 커뮤니티 활동에 참여하기 전에 탐색할 공간을 제공하여 커뮤니티 온보딩을 단순화합니다.
generalSettings.access.whatIsDefaultSpace.paragraph3=사용자는 관심이 없으면 빠르게 공간을 떠날 수 있습니다.

generalSettings.access.whatIsMandatorySpace=필수 공간이란 무엇입니까?
generalSettings.access.whatIsMandatorySpace.paragraph1=스페이스를 필수로 설정하면 사용자에게 자동으로 액세스 권한이 부여되고 거부할 수 없습니다. 이는 사용자를 중요한 영역에 노출시키는 데 도움이 됩니다.
generalSettings.access.whatIsMandatorySpace.paragraph2=예를 들어 필수 정보를 푸시하는 필수 "커뮤니케이션" 공간은 모든 회원에게 다가가는 데 도움이 됩니다.
generalSettings.access.whatIsMandatorySpace.paragraph3=사용자 그룹에 따라 필수 공간을 선택할 수 있습니다.

