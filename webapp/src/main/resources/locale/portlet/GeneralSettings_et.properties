generalSettings.access.whatIsExternalUser=Mis on külaliskasutaja?
generalSettings.access.whatIsExternalUser.paragraph1=Külaliskasutajatel on piiratud juurdepääs ja nad saavad ruumidega liituda ainult kutse alusel.
generalSettings.access.whatIsExternalUser.paragraph2=Nad ei pääse juurde sisemisele sisule, sh siseruumidele, inimeste kataloogile ja ruumikataloogile.
generalSettings.access.whatIsExternalUser.paragraph3=Nende koduleht on erinev, et vältida tahtmatut juurdepääsu piiratud aladele.

generalSettings.access.whatIsSpaceHost=Mis on ruumiadministraator?
generalSettings.access.whatIsSpaceHost.paragraph1=Kui loote kogukonna liitumiseks ruumi, saate automaatselt ruumi administraatoriks.
generalSettings.access.whatIsSpaceHost.paragraph2=See võimaldab teil konfigureerida oma kogukonna ruumi, sealhulgas liikmete haldust, rakenduse seadeid ja sisuhaldust.
generalSettings.access.whatIsSpaceHost.paragraph3=Samuti soovitame tuvastada teised liikmed ruumiadministraatoritena, andes neile võimaluse teid vajadusel aidata.

generalSettings.access.whatIsRegisteredUser=Mis on registreeritud kasutaja?
generalSettings.access.whatIsRegisteredUser.paragraph1=Registreeritud kasutajad on kasutajad, kellel on kehtiv konto. See võib olenevalt juurdepääsurežiimist juhtuda mitmel viisil:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Avatud juurdepääs: kõik saavad registreeruda ja kui nad seda teevad, saavad nad registreeritud kasutajateks.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Piiratud juurdepääs: ainult administraatori loodud ja kutsutud kasutajad saavad sisse logida ja neid peetakse registreeritud kasutajateks.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Külalisjuurdepääs: piiratud juurdepääsuga volitatud külaliskasutajad on registreeritud kasutajad, kuid neid identifitseeritakse külalistena, kelle nime järel on 🔹.

generalSettings.access.whatIsDefaultSpace=Mis on vaikeruum?
generalSettings.access.whatIsDefaultSpace.paragraph1=Vaikeruumi määramine tagab, et uued kasutajad pääsevad esimesel sisselogimisel sellele ruumile automaatselt juurde.
generalSettings.access.whatIsDefaultSpace.paragraph2=See lihtsustab kogukonnaga liitumist, pakkudes ruume, mida enne muude kogukonna tegevustega tegelemist uurida.
generalSettings.access.whatIsDefaultSpace.paragraph3=Kasutajad saavad endiselt kiiresti ruumist lahkuda, kui nad pole huvitatud.

generalSettings.access.whatIsMandatorySpace=Mis on kohustuslik ruum?
generalSettings.access.whatIsMandatorySpace.paragraph1=Ruumi kohustuslikuks määramine tagab, et kasutajatele antakse automaatselt juurdepääs ja nad ei saa loobuda. See aitab kasutajatel kriitilistes piirkondades kokku puutuda.
generalSettings.access.whatIsMandatorySpace.paragraph2=Näiteks aitab kõigi liikmeteni jõuda kohustuslik ruum "Suhtlemine", kuhu surute olulise teabe.
generalSettings.access.whatIsMandatorySpace.paragraph3=Kohustuslikke ruume saate valida kasutajarühmade alusel.

