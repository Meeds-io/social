generalSettings.access.whatIsExternalUser=Wat is een externe gebruiker?
generalSettings.access.whatIsExternalUser.paragraph1=Externe gebruikers hebben beperkte platformtoegang en kunnen alleen toetreden tot ruimtes wanneer ze worden uitgenodigd door ruimtehosts.
generalSettings.access.whatIsExternalUser.paragraph2=Ze hebben geen toegang tot interne inhoud, met inbegrip van interne ruimten, de mensen directory, en spaties map.
generalSettings.access.whatIsExternalUser.paragraph3=Hun homepage wordt aangepast om onbedoelde toegang tot beperkte gebieden te voorkomen.

generalSettings.access.whatIsSpaceHost=Wat is een ruimtehost?
generalSettings.access.whatIsSpaceHost.paragraph1=Wanneer je een ruimte maakt om een gemeenschap te weren, word je automatisch een space host
generalSettings.access.whatIsSpaceHost.paragraph2=Hiermee kunt u de ruimte voor uw community configureren, met inbegrip van het lid, programma-instellingen en inhoudsbeheer.
generalSettings.access.whatIsSpaceHost.paragraph3=We raden je ook aan om andere leden te identificeren als ruimte-hosts, zodat ze je naar behoren kunnen helpen.

generalSettings.access.whatIsRegisteredUser=Wat is een geregistreerde gebruiker?
generalSettings.access.whatIsRegisteredUser.paragraph1=Gebruikers die toegang hebben tot ons platform vallen in verschillende categorieën van geregistreerde gebruikers:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Toegang: Iedereen kan zich inschrijven en zodra ze dat doen, worden ze geregistreerde gebruikers.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Beperkte toegang: Alleen gebruikers die door een beheerder zijn aangemaakt en uitgenodigd, kunnen zich aanmelden en worden beschouwd als geregistreerde gebruikers.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Externe toegang: Geautoriseerde externe gebruikers met beperkte toegang, zijn ook geregistreerde gebruikers maar zijn geïdentificeerd als "external".

generalSettings.access.whatIsDefaultSpace=Wat is een standaard ruimte?
generalSettings.access.whatIsDefaultSpace.paragraph1=Het instellen van een standaard ruimte zorgt ervoor dat nieuwe gebruikers bij de eerste login automatisch toegang krijgen tot deze ruimte.
generalSettings.access.whatIsDefaultSpace.paragraph2=Dit vereenvoudigt de onboarding van de community door het aanbieden van ruimtes om te verkennen alvorens deel te nemen aan andere gemeenschapsactiviteiten.
generalSettings.access.whatIsDefaultSpace.paragraph3=Gebruikers kunnen de ruimte gemakkelijk verlaten als ze er niet bij zijn nadat ze zijn ingelogd.

generalSettings.access.whatIsMandatorySpace=Wat is een verplichte ruimte?
generalSettings.access.whatIsMandatorySpace.paragraph1=Een ruimte instellen als verplicht zorgt ervoor dat gebruikers automatisch toegang krijgen en zich niet kunnen afmelden. Dit zorgt voor gebruikersbetrokkenheid met kritieke inhoud en gemeenschappen.
generalSettings.access.whatIsMandatorySpace.paragraph2=Bijvoorbeeld het markeren van een "communicatie"-ruimte als verplichte garanties voor universele toegang en het ontvangen van berichten.
generalSettings.access.whatIsMandatorySpace.paragraph3=Je kunt verplichte spaties opgeven op basis van een lidmaatschap profiel van een gebruiker en hun toegang aanpassen aan profielspaties.

