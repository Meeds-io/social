generalSettings.access.whatIsExternalUser=Ano ang guest user?
generalSettings.access.whatIsExternalUser.paragraph1=Ang mga bisitang user ay may limitadong access at maaari lamang sumali sa mga espasyo sa pamamagitan ng imbitasyon.
generalSettings.access.whatIsExternalUser.paragraph2=Hindi nila maa-access ang panloob na nilalaman, kabilang ang mga panloob na espasyo, ang direktoryo ng mga tao, at ang direktoryo ng espasyo.
generalSettings.access.whatIsExternalUser.paragraph3=Iba ang kanilang homepage upang maiwasan ang anumang hindi sinasadyang pag-access sa mga pinaghihigpitang lugar.

generalSettings.access.whatIsSpaceHost=Ano ang isang space admin?
generalSettings.access.whatIsSpaceHost.paragraph1=Kapag gumawa ka ng space para i-onboard ang isang komunidad, awtomatiko kang magiging space admin.
generalSettings.access.whatIsSpaceHost.paragraph2=Binibigyang-daan ka nitong i-configure ang espasyo para sa iyong komunidad, kabilang ang pamamahala ng miyembro, mga setting ng application, at pamamahala ng nilalaman.
generalSettings.access.whatIsSpaceHost.paragraph3=Inirerekomenda din namin ang pagtukoy sa iba pang mga miyembro bilang mga admin ng espasyo, na nagbibigay ng kapangyarihan sa kanila na tulungan ka kung kinakailangan.

generalSettings.access.whatIsRegisteredUser=Ano ang isang rehistradong gumagamit?
generalSettings.access.whatIsRegisteredUser.paragraph1=Ang mga rehistradong user ay mga user na may wastong account. Ito ay maaaring mangyari sa iba't ibang paraan depende sa access mode:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Buksan ang Access: Kahit sino ay maaaring mag-sign up, at kapag nagawa na nila, sila ay magiging mga rehistradong user.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Restricted Access: Tanging ang mga user na nilikha at inimbitahan ng isang administrator ang maaaring mag-sign in at maituturing na mga rehistradong user.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Pag-access sa Bisita: Ang mga awtorisadong user ng bisita na may limitadong access ay mga rehistradong user ngunit kinikilala bilang mga bisitang may 🔹 pagkatapos ng kanilang pangalan.

generalSettings.access.whatIsDefaultSpace=Ano ang isang default na espasyo?
generalSettings.access.whatIsDefaultSpace.paragraph1=Ang pagtatakda ng default na espasyo ay nagsisiguro na ang mga bagong user, sa kanilang unang pag-login, ay awtomatikong maa-access ang espasyong ito.
generalSettings.access.whatIsDefaultSpace.paragraph2=Pinapasimple nito ang onboarding ng komunidad sa pamamagitan ng pagbibigay ng mga puwang upang tuklasin bago makisali sa iba pang aktibidad ng komunidad.
generalSettings.access.whatIsDefaultSpace.paragraph3=Ang mga user ay maaari pa ring mabilis na umalis sa espasyo kung hindi sila interesado.

generalSettings.access.whatIsMandatorySpace=Ano ang isang ipinag-uutos na espasyo?
generalSettings.access.whatIsMandatorySpace.paragraph1=Ang pagtatakda ng espasyo bilang mandatory ay nagsisiguro na ang mga user ay awtomatikong nabibigyan ng access at hindi maaaring mag-opt out. Nakakatulong itong ilantad ang mga user sa mga kritikal na lugar.
generalSettings.access.whatIsMandatorySpace.paragraph2=Halimbawa, ang isang ipinag-uutos na espasyo ng "Komunikasyon" kung saan mo itutulak ang mahahalagang impormasyon ay nakakatulong na maabot ang lahat ng miyembro.
generalSettings.access.whatIsMandatorySpace.paragraph3=Maaari kang pumili ng mga mandatoryong espasyo batay sa mga pangkat ng user.

