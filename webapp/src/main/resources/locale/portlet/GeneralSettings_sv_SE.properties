generalSettings.access.whatIsExternalUser=Vad är en extern användare?
generalSettings.access.whatIsExternalUser.paragraph1=Externa användare har begränsad plattformsåtkomst och kan bara ansluta till mellanslag när de är inbjudna av webbhotell.
generalSettings.access.whatIsExternalUser.paragraph2=De kan inte få tillgång till internt innehåll, inklusive interna utrymmen, personkatalogen och rumskatalogen.
generalSettings.access.whatIsExternalUser.paragraph3=Deras hemsida är anpassad för att förhindra oavsiktlig tillgång till begränsade områden.

generalSettings.access.whatIsSpaceHost=Vad är en rymdvärd?
generalSettings.access.whatIsSpaceHost.paragraph1=När du skapar ett utrymme att skriva ombord på en gemenskap, blir du automatiskt en webb-ytvärd.
generalSettings.access.whatIsSpaceHost.paragraph2=Detta gör att du kan konfigurera utrymmet för din gemenskap, inklusive medlemshantering, programinställningar och innehållshantering.
generalSettings.access.whatIsSpaceHost.paragraph3=Vi rekommenderar också att identifiera andra medlemmar som rymdvärdar, ge dem möjlighet att hjälpa dig vid behov.

generalSettings.access.whatIsRegisteredUser=Vad är en registrerad användare?
generalSettings.access.whatIsRegisteredUser.paragraph1=Användare som kommer åt vår plattform faller in i olika kategorier av registrerade användare:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Access: Vem som helst kan registrera sig, och när de gör det, blir de registrerade användare.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Begränsad åtkomst: Endast användare skapade och inbjudna av en administratör kan logga in och betraktas som registrerade användare.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Extern åtkomst: Auktoriserade externa användare, med begränsad åtkomst, är också registrerade användare men identifieras som "externa".

generalSettings.access.whatIsDefaultSpace=Vad är ett standardutrymme?
generalSettings.access.whatIsDefaultSpace.paragraph1=Om du sätter ett standardutrymme ser du till att nya användare, vid deras första inloggning, automatiskt kommer åt detta utrymme.
generalSettings.access.whatIsDefaultSpace.paragraph2=Detta förenklar gemenskapsponboarding genom att ge utrymme att utforska innan du deltar i andra gemenskapsaktiviteter.
generalSettings.access.whatIsDefaultSpace.paragraph3=Användare kan fortfarande enkelt avsluta utrymmet om det inte intresserar dem efter inloggning.

generalSettings.access.whatIsMandatorySpace=Vad är ett obligatoriskt utrymme?
generalSettings.access.whatIsMandatorySpace.paragraph1=Att ställa in ett utrymme som obligatoriskt säkerställer att användare automatiskt får åtkomst och inte kan välja ut. Detta säkerställer användarens engagemang med kritiskt innehåll och gemenskaper.
generalSettings.access.whatIsMandatorySpace.paragraph2=Till exempel att markera ett "Kommunikation" utrymme som obligatoriskt garanterar universell åtkomst och meddelandemottagning.
generalSettings.access.whatIsMandatorySpace.paragraph3=Du kan ange obligatoriska utrymmen baserat på en användares medlemsprofil, skräddarsy deras tillgång till profilerade utrymmen.

