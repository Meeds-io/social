generalSettings.access.whatIsExternalUser=Mi az a vendég felhasználó?
generalSettings.access.whatIsExternalUser.paragraph1=A vendégfelhasználók korlátozott hozzáféréssel rendelkeznek, és csak meghívással csatlakozhatnak a terekhez.
generalSettings.access.whatIsExternalUser.paragraph2=Nem férhetnek hozzá a belső tartalmakhoz, beleértve a belső tereket, a személyek könyvtárát és a területi könyvtárat.
generalSettings.access.whatIsExternalUser.paragraph3=A honlapjuk más, hogy megakadályozzák a nem szándékos hozzáférést a korlátozott területekhez.

generalSettings.access.whatIsSpaceHost=Mi az a téradminisztrátor?
generalSettings.access.whatIsSpaceHost.paragraph1=Amikor létrehozol egy teret egy közösséghez, automatikusan téradminisztrátor leszel.
generalSettings.access.whatIsSpaceHost.paragraph2=Ez lehetővé teszi a közösség tárának konfigurálását, beleértve a tagkezelést, az alkalmazásbeállításokat és a tartalomkezelést.
generalSettings.access.whatIsSpaceHost.paragraph3=Azt is javasoljuk, hogy a többi tagot téradminisztrátorként azonosítsa, és felhatalmazza őket, hogy szükség esetén segítsenek.

generalSettings.access.whatIsRegisteredUser=Mi a regisztrált felhasználó?
generalSettings.access.whatIsRegisteredUser.paragraph1=A regisztrált felhasználók azok a felhasználók, akik érvényes fiókkal rendelkeznek. Ez a hozzáférési módtól függően többféleképpen történhet:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Nyílt hozzáférés: Bárki regisztrálhat, és amint megteszi, regisztrált felhasználóvá válik.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Korlátozott hozzáférés: Csak az adminisztrátor által létrehozott és meghívott felhasználók jelentkezhetnek be, és csak regisztrált felhasználóknak tekinthetők.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Vendég hozzáférés: A korlátozott hozzáférésű, jogosult vendégfelhasználók regisztrált felhasználók, de vendégként azonosítják őket a nevük után 🔹-vel.

generalSettings.access.whatIsDefaultSpace=Mi az alapértelmezett szóköz?
generalSettings.access.whatIsDefaultSpace.paragraph1=Az alapértelmezett terület beállítása biztosítja, hogy az új felhasználók az első bejelentkezéskor automatikusan hozzáférjenek ehhez a területhez.
generalSettings.access.whatIsDefaultSpace.paragraph2=Ez leegyszerűsíti a közösségbe való belépést azáltal, hogy tereket biztosít a felfedezésre, mielőtt más közösségi tevékenységekbe kezdene.
generalSettings.access.whatIsDefaultSpace.paragraph3=A felhasználók továbbra is gyorsan elhagyhatják a teret, ha nem érdeklik őket.

generalSettings.access.whatIsMandatorySpace=Mi az a kötelező szóköz?
generalSettings.access.whatIsMandatorySpace.paragraph1=A szóköz kötelezővé tétele biztosítja, hogy a felhasználók automatikusan hozzáférést kapjanak, és nem iratkozhatnak le. Segít kitenni a felhasználókat a kritikus területeknek.
generalSettings.access.whatIsMandatorySpace.paragraph2=Például egy kötelező „Kommunikációs” terület, ahová az alapvető információkat továbbíthatja, minden taghoz eljut.
generalSettings.access.whatIsMandatorySpace.paragraph3=A kötelező tereket felhasználói csoportok alapján választhatja ki.

