GroupsManagement.organizationalUnit.help.item2=Să modifice conturile de utilizator existente (informații despre cont, apartenențe etc.).
GroupsManagement.organizationalUnit.help.item3=Să dezactiveze conturile de utilizator.
GroupsManagement.organizationalUnit.help.paragraph3=Un subgrup poate fi, de asemenea, desemnat ca unitate organizațională. În acest caz, administratorii delegați ai subgrupului nu pot gestiona sau dezactiva conturile administratorilor delegați care aparțin unității organizaționale părinte.


