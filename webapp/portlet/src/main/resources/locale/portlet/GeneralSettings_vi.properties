generalSettings.access.whatIsExternalUser=Người dùng bên ngoài là gì?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=Họ không thể truy cập nội dung nội bộ, bao gồm không gian nội bộ, thư mục người và thư mục không gian.
generalSettings.access.whatIsExternalUser.paragraph3=Trang chủ của họ được tùy chỉnh để ngăn chặn mọi truy cập không chủ ý vào các khu vực bị hạn chế.

generalSettings.access.whatIsSpaceHost=Máy chủ không gian là gì?
generalSettings.access.whatIsSpaceHost.paragraph1=Khi tạo không gian để tham gia cộng đồng, bạn sẽ tự động trở thành người tổ chức không gian.
generalSettings.access.whatIsSpaceHost.paragraph2=Điều này cho phép bạn định cấu hình không gian cho cộng đồng của mình, bao gồm quản lý thành viên, cài đặt ứng dụng và quản lý nội dung.
generalSettings.access.whatIsSpaceHost.paragraph3=Chúng tôi cũng khuyên bạn nên xác định các thành viên khác là người tổ chức không gian, trao quyền cho họ để hỗ trợ bạn khi cần.

generalSettings.access.whatIsRegisteredUser=Người dùng đã đăng ký là gì?
generalSettings.access.whatIsRegisteredUser.paragraph1=Người dùng truy cập nền tảng của chúng tôi thuộc các loại người dùng đã đăng ký khác nhau:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Truy cập mở: Bất kỳ ai cũng có thể đăng ký và sau khi đăng ký, họ sẽ trở thành người dùng đã đăng ký.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Quyền truy cập hạn chế: Chỉ những người dùng được quản trị viên tạo và mời mới có thể truy cập vào nền tảng và họ được coi là người dùng đã đăng ký.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Truy cập bên ngoài: Người dùng bên ngoài được ủy quyền, với quyền truy cập hạn chế, cũng là người dùng đã đăng ký nhưng được xác định là "bên ngoài".

generalSettings.access.whatIsDefaultSpace=Không gian mặc định là gì?
generalSettings.access.whatIsDefaultSpace.paragraph1=Đặt không gian mặc định đảm bảo rằng người dùng mới, khi đăng nhập lần đầu, sẽ tự động truy cập vào không gian này.
generalSettings.access.whatIsDefaultSpace.paragraph2=Điều này giúp đơn giản hóa việc tham gia cộng đồng bằng cách cung cấp không gian để khám phá trước khi tham gia vào các hoạt động cộng đồng khác.
generalSettings.access.whatIsDefaultSpace.paragraph3=Người dùng vẫn có thể dễ dàng thoát khỏi không gian nếu nó không khiến họ quan tâm sau khi đăng nhập.

generalSettings.access.whatIsMandatorySpace=Một không gian bắt buộc là gì?
generalSettings.access.whatIsMandatorySpace.paragraph1=Việc đặt không gian là bắt buộc sẽ đảm bảo rằng người dùng được tự động cấp quyền truy cập và không thể chọn không tham gia. Điều này đảm bảo sự tương tác của người dùng với nội dung và cộng đồng quan trọng.
generalSettings.access.whatIsMandatorySpace.paragraph2=Ví dụ: đánh dấu không gian "Giao tiếp" là bắt buộc sẽ đảm bảo quyền truy cập phổ biến và nhận tin nhắn.
generalSettings.access.whatIsMandatorySpace.paragraph3=Bạn có thể chỉ định các không gian bắt buộc dựa trên hồ sơ thành viên của người dùng, điều chỉnh quyền truy cập của họ vào các không gian được định hình.

