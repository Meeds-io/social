generalSettings.access.whatIsExternalUser=什麼是訪客用戶？
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=他們無法存取內部內容，包括內部空間、人員目錄和空間目錄。
generalSettings.access.whatIsExternalUser.paragraph3=他們的主頁是不同的，以防止任何無意訪問受限區域。

generalSettings.access.whatIsSpaceHost=什麼是空間管理員？
generalSettings.access.whatIsSpaceHost.paragraph1=當您建立空間加入社群時，您將自動成為空間管理員。
generalSettings.access.whatIsSpaceHost.paragraph2=這允許您配置社群的空間，包括成員管理、應用程式設定和內容管理。
generalSettings.access.whatIsSpaceHost.paragraph3=我們也建議將其他成員指定為空間管理員，讓他們能夠根據需要為您提供協助。

generalSettings.access.whatIsRegisteredUser=什麼是註冊用戶？
generalSettings.access.whatIsRegisteredUser.paragraph1=註冊用戶是指擁有有效帳號的用戶。根據訪問模式，這可能以多種方式發生：
generalSettings.access.whatIsRegisteredUser.paragraph2=1.開放存取：任何人都可以註冊，一旦註冊，他們就成為註冊用戶.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. 限制存取：只有管理員建立和邀請的使用者才能登入並被視為註冊使用者。
generalSettings.access.whatIsRegisteredUser.paragraph4=3. 訪客訪問：具有有限訪問權限的授權訪客用戶是註冊用戶，但在姓名後面帶有 🔹 標識為訪客。

generalSettings.access.whatIsDefaultSpace=什麼是預設空間？
generalSettings.access.whatIsDefaultSpace.paragraph1=設定預設空間可確保新使用者在首次登入時自動存取該空間。
generalSettings.access.whatIsDefaultSpace.paragraph2=這透過在參與其他社區活動之前提供探索空間來簡化社區入職。
generalSettings.access.whatIsDefaultSpace.paragraph3=如果用戶不感興趣，仍然可以快速離開該空間。

generalSettings.access.whatIsMandatorySpace=什麼是強制空格？
generalSettings.access.whatIsMandatorySpace.paragraph1=將空格設定為強制可確保使用者自動獲得存取權限且無法選擇退出。它有助於讓用戶了解關鍵區域。
generalSettings.access.whatIsMandatorySpace.paragraph2=例如，強制性的「溝通」空間，您可以在其中推送重要訊息，有助於聯繫所有成員。
generalSettings.access.whatIsMandatorySpace.paragraph3=您可以根據使用者群組選擇必填空間。

