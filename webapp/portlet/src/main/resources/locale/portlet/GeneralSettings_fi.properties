generalSettings.access.whatIsExternalUser=Mikä on ulkoinen käyttäjä?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=He eivät voi käyttää sisäistä sisältöä, mukaan lukien sisätiloja, henkilöhakemistoa ja välilyöntihakemistoa.
generalSettings.access.whatIsExternalUser.paragraph3=Heidän kotisivunsa on räätälöity estämään tahaton pääsy rajoitetuille alueille.

generalSettings.access.whatIsSpaceHost=Mikä on avaruusisäntä?
generalSettings.access.whatIsSpaceHost.paragraph1=Kun luot avaruuden yhteisöön, sinusta tulee automaattisesti avaruuden isäntä.
generalSettings.access.whatIsSpaceHost.paragraph2=Tämän avulla voit määrittää yhteisösi tilaa mukaan lukien jäsenhallinta, sovellusasetukset ja sisällönhallinta.
generalSettings.access.whatIsSpaceHost.paragraph3=Suosittelemme myös muiden jäsenten tunnistamista avaruusisäntiksi, jotta he voivat auttaa sinua tarvittaessa.

generalSettings.access.whatIsRegisteredUser=Mikä on rekisteröitynyt käyttäjä?
generalSettings.access.whatIsRegisteredUser.paragraph1=Käyttäjät, jotka käyttävät alustaamme, kuuluvat eri ryhmiin rekisteröityjä käyttäjiä:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Open Access: Kuka tahansa voi rekisteröityä, ja kun he tekevät, heistä tulee rekisteröityneitä käyttäjiä.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Rajoitettu pääsy: Vain järjestelmänvalvojan luomat ja kutsumat käyttäjät voivat kirjautua sisään ja heitä voidaan pitää rekisteröityinä käyttäjinä.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Ulkoinen pääsy: Valtuutetut ulkoiset käyttäjät, joilla on rajoitettu pääsy, ovat myös rekisteröityjä käyttäjiä, mutta ne on määritelty "ulkoisiksi".

generalSettings.access.whatIsDefaultSpace=Mikä on oletustila?
generalSettings.access.whatIsDefaultSpace.paragraph1=Oletustilan asettaminen varmistaa, että uudet käyttäjät pääsevät tähän tilaan automaattisesti ensimmäisen kirjautumisensa yhteydessä.
generalSettings.access.whatIsDefaultSpace.paragraph2=Tämä yksinkertaistaa yhteisöä perehdyttämällä tilaa tutkia ennen kuin osallistuu muuhun yhteisön toimintaan.
generalSettings.access.whatIsDefaultSpace.paragraph3=Käyttäjät voivat silti helposti poistua tilasta, jos se ei kiinnosta niitä sisäänkirjautumisen jälkeen.

generalSettings.access.whatIsMandatorySpace=Mikä on pakollinen tila?
generalSettings.access.whatIsMandatorySpace.paragraph1=Tilan asettaminen pakolliseksi takaa, että käyttäjille myönnetään automaattisesti pääsy eikä heitä voi valita. Tämä takaa käyttäjän sitoutumisen kriittiseen sisältöön ja yhteisöihin.
generalSettings.access.whatIsMandatorySpace.paragraph2=Esimerkiksi "Viestintä" -tilan merkitseminen pakolliseksi takaa yleisen saatavuuden ja viestin vastaanottamisen.
generalSettings.access.whatIsMandatorySpace.paragraph3=Voit määrittää pakolliset välilyönnit käyttäjän jäsenprofiilin perusteella ja muokata niiden pääsyä profiloituihin välilyönteihin.

