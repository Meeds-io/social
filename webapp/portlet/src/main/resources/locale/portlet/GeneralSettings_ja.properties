generalSettings.access.whatIsExternalUser=外部ユーザーとは何ですか?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=内部のコンテンツ(内部のスペース、personディレクトリ、spacesディレクトリなど)にアクセスすることはできません。
generalSettings.access.whatIsExternalUser.paragraph3=彼らのホームページは、意図せずに制限区域へのアクセスを防ぐためにカスタマイズされています。

generalSettings.access.whatIsSpaceHost=スペース ホストとは何ですか?
generalSettings.access.whatIsSpaceHost.paragraph1=コミュニティにスペースを作成すると、自動的にスペースホストになります。
generalSettings.access.whatIsSpaceHost.paragraph2=これにより、メンバー管理、アプリケーション設定、コンテンツ管理など、コミュニティのスペースを構成できます。
generalSettings.access.whatIsSpaceHost.paragraph3=また、他のメンバーをスペースホストとして特定し、必要に応じて支援できるようにすることをお勧めします。

generalSettings.access.whatIsRegisteredUser=登録ユーザーとは何ですか？
generalSettings.access.whatIsRegisteredUser.paragraph1=私たちのプラットフォームにアクセスするユーザーは、登録ユーザーのカテゴリによって異なります:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. オープンアクセス:誰でもサインアップでき、一度登録されると登録ユーザーになります。
generalSettings.access.whatIsRegisteredUser.paragraph3=2. アクセス制限: 管理者によって作成され招待されたユーザーのみがプラットフォームにアクセスでき、それらのユーザーは登録ユーザーとみなされます。
generalSettings.access.whatIsRegisteredUser.paragraph4=3. 外部アクセス: アクセスが制限された外部ユーザーも登録されていますが、外部ユーザーとして識別されます。

generalSettings.access.whatIsDefaultSpace=デフォルトのスペースとは何ですか？
generalSettings.access.whatIsDefaultSpace.paragraph1=デフォルトのスペースを設定すると、新しいユーザーが最初のログイン時にこのスペースに自動的にアクセスするようになります。
generalSettings.access.whatIsDefaultSpace.paragraph2=これにより、他のコミュニティ活動に参加する前に探索できるスペースを提供することで、コミュニティのオンボーディングが簡素化されます。
generalSettings.access.whatIsDefaultSpace.paragraph3=ログイン後に興味がない場合でも、ユーザーは容易にスペースを抜けることができます。

generalSettings.access.whatIsMandatorySpace=必須スペースとは何ですか?
generalSettings.access.whatIsMandatorySpace.paragraph1=スペースを必須として設定すると、ユーザーは自動的にアクセスを許可され、オプトアウトできなくなります。これにより、重要なコンテンツやコミュニティとのユーザーのエンゲージメントが保証されます。
generalSettings.access.whatIsMandatorySpace.paragraph2=たとえば、「コミュニケーション」スペースを必須としてマークすると、ユニバーサルアクセスとメッセージ受信が保証されます。
generalSettings.access.whatIsMandatorySpace.paragraph3=ユーザのメンバシッププロフィールに基づいて必須のスペースを指定し、プロファイルされたスペースへのアクセスを調整できます。

