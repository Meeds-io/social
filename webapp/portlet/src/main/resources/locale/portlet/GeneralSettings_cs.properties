generalSettings.access.whatIsExternalUser=Co je externí uživatel?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=Nemohou přistupovat k vnitřnímu obsahu, včetně vnitřních prostor, adresáře a adresáře prostor.
generalSettings.access.whatIsExternalUser.paragraph3=Jejich domovská stránka je přizpůsobena, aby se zabránilo jakémukoli neúmyslnému přístupu do vyhrazených oblastí.

generalSettings.access.whatIsSpaceHost=Co je to vesmírný hostitel?
generalSettings.access.whatIsSpaceHost.paragraph1=Když vytvoříte prostor pro zapojení do komunity, automaticky se stanete vesmírným hostitelem.
generalSettings.access.whatIsSpaceHost.paragraph2=To vám umožní nakonfigurovat místo pro vaši komunitu, včetně správy členů, nastavení aplikací a správy obsahu.
generalSettings.access.whatIsSpaceHost.paragraph3=Doporučujeme také identifikovat další členy jako vesmírné hostitele, což jim podle potřeby umožní pomoci.

generalSettings.access.whatIsRegisteredUser=Co je registrovaný uživatel?
generalSettings.access.whatIsRegisteredUser.paragraph1=Uživatelé, kteří přistupují k naší platformě, patří do různých kategorií registrovaných uživatelů:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Otevřete přístup: kdokoliv se může zaregistrovat, a jakmile tak učiní, stane se registrovanými uživateli.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Omezený přístup: Pouze uživatelé vytvoření a pozvaní administrátorem se mohou přihlásit a být považováni za registrované uživatele.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Externí přístup: Autorizovaní externí uživatelé s omezeným přístupem jsou také registrovaní uživatelé, ale jsou označeni jako "externí".

generalSettings.access.whatIsDefaultSpace=Co je výchozí mezera?
generalSettings.access.whatIsDefaultSpace.paragraph1=Nastavení výchozího místa zajišťuje, že noví uživatelé budou automaticky přistupovat k tomuto prostoru.
generalSettings.access.whatIsDefaultSpace.paragraph2=To zjednodušuje zapojení komunity tím, že poskytuje prostor k prozkoumání před zapojením do jiných aktivit komunity.
generalSettings.access.whatIsDefaultSpace.paragraph3=Uživatelé mohou stále jednoduše opustit prostor, pokud je po přihlášení nezajímá.

generalSettings.access.whatIsMandatorySpace=Co je to povinný prostor?
generalSettings.access.whatIsMandatorySpace.paragraph1=Nastavení prostoru jako povinné zajišťuje, že uživatelům bude automaticky udělen přístup a nebude se odhlásit. To zajišťuje zapojení uživatelů do kritického obsahu a komunit.
generalSettings.access.whatIsMandatorySpace.paragraph2=Například označení prostoru "komunikace" jako povinného zaručuje všeobecný přístup a příjem zpráv.
generalSettings.access.whatIsMandatorySpace.paragraph3=Můžete zadat povinné mezery na základě uživatelského profilu, a to na míru jejich přístupu k profilovaným mezerám.

