generalSettings.access.whatIsExternalUser=Što je gost korisnik?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=Ne mogu pristupiti internom sadržaju, uključujući interne prostore, imenik ljudi i direktorij prostora.
generalSettings.access.whatIsExternalUser.paragraph3=Njihova početna stranica je drugačija kako bi se spriječio nenamjeran pristup ograničenim područjima.

generalSettings.access.whatIsSpaceHost=Što je administrator prostora?
generalSettings.access.whatIsSpaceHost.paragraph1=Kada stvorite prostor za pridruživanje zajednici, automatski postajete administrator prostora.
generalSettings.access.whatIsSpaceHost.paragraph2=To vam omogućuje da konfigurirate prostor za svoju zajednicu, uključujući upravljanje članovima, postavke aplikacija i upravljanje sadržajem.
generalSettings.access.whatIsSpaceHost.paragraph3=Također preporučujemo da druge članove identificirate kao administratore prostora, ovlašćujući ih da vam pomognu po potrebi.

generalSettings.access.whatIsRegisteredUser=Što je registrirani korisnik?
generalSettings.access.whatIsRegisteredUser.paragraph1=Registrirani korisnici su korisnici koji imaju važeći račun. To se može dogoditi na različite načine, ovisno o načinu pristupa:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Otvoreni pristup: Svatko se može prijaviti, a kada to učini, postaje registrirani korisnik.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Ograničeni pristup: Samo korisnici koje je stvorio i pozvao administrator mogu se prijaviti i smatrati registriranim korisnicima.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Pristup gosta: Ovlašteni gosti-korisnici s ograničenim pristupom su registrirani korisnici, ali se identificiraju kao gosti s 🔹 iza imena.

generalSettings.access.whatIsDefaultSpace=Što je zadani prostor?
generalSettings.access.whatIsDefaultSpace.paragraph1=Postavljanje zadanog prostora osigurava da će novi korisnici, nakon prve prijave, automatski pristupiti ovom prostoru.
generalSettings.access.whatIsDefaultSpace.paragraph2=To pojednostavljuje uključivanje u zajednicu pružanjem prostora za istraživanje prije nego što se uključite u druge aktivnosti zajednice.
generalSettings.access.whatIsDefaultSpace.paragraph3=Korisnici i dalje mogu brzo napustiti prostor ako nisu zainteresirani.

generalSettings.access.whatIsMandatorySpace=Što je obavezan prostor?
generalSettings.access.whatIsMandatorySpace.paragraph1=Postavljanje prostora kao obaveznog osigurava da se korisnicima automatski odobrava pristup i da se ne mogu isključiti. Pomaže izložiti korisnike kritičnim područjima.
generalSettings.access.whatIsMandatorySpace.paragraph2=Na primjer, obavezni prostor "Komunikacija" u koji unosite bitne informacije pomaže doprijeti do svih članova.
generalSettings.access.whatIsMandatorySpace.paragraph3=Možete odabrati obavezne prostore na temelju korisničkih grupa.

