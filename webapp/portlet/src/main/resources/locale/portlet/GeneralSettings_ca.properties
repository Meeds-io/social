generalSettings.access.whatIsExternalUser=Què és un usuari convidat?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=No poden accedir al contingut intern, inclosos els espais interns, el directori de persones i el directori d'espais.
generalSettings.access.whatIsExternalUser.paragraph3=La seva pàgina d'inici és diferent per evitar qualsevol accés no intencionat a zones restringides.

generalSettings.access.whatIsSpaceHost=Què és un administrador d'espais?
generalSettings.access.whatIsSpaceHost.paragraph1=Quan crees un espai per incorporar-te a una comunitat, et converteixes automàticament en administrador de l'espai.
generalSettings.access.whatIsSpaceHost.paragraph2=Això us permet configurar l'espai per a la vostra comunitat, inclosa la gestió de membres, la configuració de l'aplicació i la gestió de contingut.
generalSettings.access.whatIsSpaceHost.paragraph3=També recomanem que identifiquis altres membres com a administradors de l'espai, donant-los poder per ajudar-te segons sigui necessari.

generalSettings.access.whatIsRegisteredUser=Què és un usuari registrat?
generalSettings.access.whatIsRegisteredUser.paragraph1=Els usuaris registrats són usuaris que tenen un compte vàlid. Això pot passar de diverses maneres segons el mode d'accés:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Accés obert: qualsevol pot registrar-se i, un cop ho faci, es converteix en usuaris registrats.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Accés restringit: només els usuaris creats i convidats per un administrador poden iniciar sessió i ser considerats usuaris registrats.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Accés convidat: els usuaris convidats autoritzats amb accés limitat són usuaris registrats, però s'identifiquen com a convidats amb 🔹 després del seu nom.

generalSettings.access.whatIsDefaultSpace=Què és un espai predeterminat?
generalSettings.access.whatIsDefaultSpace.paragraph1=L'establiment d'un espai predeterminat garanteix que els usuaris nous, en el seu primer inici de sessió, accediran automàticament a aquest espai.
generalSettings.access.whatIsDefaultSpace.paragraph2=Això simplifica la incorporació de la comunitat proporcionant espais per explorar abans de participar en altres activitats de la comunitat.
generalSettings.access.whatIsDefaultSpace.paragraph3=Els usuaris encara poden abandonar ràpidament l'espai si no els interessa.

generalSettings.access.whatIsMandatorySpace=Què és un espai obligatori?
generalSettings.access.whatIsMandatorySpace.paragraph1=Establir un espai com a obligatori garanteix que els usuaris tinguin accés automàticament i que no puguin desactivar-se. Ajuda a exposar els usuaris a àrees crítiques.
generalSettings.access.whatIsMandatorySpace.paragraph2=Per exemple, un espai obligatori de "Comunicació" on introduïu informació essencial ajuda a arribar a tots els membres.
generalSettings.access.whatIsMandatorySpace.paragraph3=Podeu seleccionar espais obligatoris en funció dels grups d'usuaris.

