generalSettings.access.whatIsExternalUser=Kaj je gostujoči uporabnik?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=Ne morejo dostopati do notranje vsebine, vključno z notranjimi prostori, imenikom oseb in imenikom prostora.
generalSettings.access.whatIsExternalUser.paragraph3=Njihova domača stran je drugačna, da prepreči nenameren dostop do omejenih območij.

generalSettings.access.whatIsSpaceHost=Kaj je skrbnik prostora?
generalSettings.access.whatIsSpaceHost.paragraph1=Ko ustvarite prostor za vključitev v skupnost, samodejno postanete skrbnik prostora.
generalSettings.access.whatIsSpaceHost.paragraph2=To vam omogoča, da konfigurirate prostor za svojo skupnost, vključno z upravljanjem članov, nastavitvami aplikacij in upravljanjem vsebine.
generalSettings.access.whatIsSpaceHost.paragraph3=Priporočamo tudi, da druge člane identificirate kot skrbnike prostora in jih pooblastite, da vam po potrebi pomagajo.

generalSettings.access.whatIsRegisteredUser=Kaj je registriran uporabnik?
generalSettings.access.whatIsRegisteredUser.paragraph1=Registrirani uporabniki so uporabniki, ki imajo veljaven račun. To se lahko zgodi na različne načine, odvisno od načina dostopa:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Odprt dostop: Vsakdo se lahko prijavi in ​​ko to stori, postane registriran uporabnik.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Omejen dostop: samo uporabniki, ki jih ustvari in povabi skrbnik, se lahko prijavijo in veljajo za registrirane uporabnike.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Dostop gostov: Pooblaščeni gostujoči uporabniki z omejenim dostopom so registrirani uporabniki, vendar so identificirani kot gostje z 🔹 za svojim imenom.

generalSettings.access.whatIsDefaultSpace=Kaj je privzeti prostor?
generalSettings.access.whatIsDefaultSpace.paragraph1=Nastavitev privzetega prostora zagotavlja, da bodo novi uporabniki ob prvi prijavi samodejno dostopali do tega prostora.
generalSettings.access.whatIsDefaultSpace.paragraph2=To poenostavi vključitev v skupnost z zagotavljanjem prostorov za raziskovanje, preden se vključite v druge dejavnosti skupnosti.
generalSettings.access.whatIsDefaultSpace.paragraph3=Uporabniki lahko še vedno hitro zapustijo prostor, če jih ne zanima.

generalSettings.access.whatIsMandatorySpace=Kaj je obvezen prostor?
generalSettings.access.whatIsMandatorySpace.paragraph1=Nastavitev prostora kot obveznega zagotavlja, da se uporabnikom samodejno odobri dostop in se ne morejo odjaviti. Uporabnikom pomaga izpostaviti kritična področja.
generalSettings.access.whatIsMandatorySpace.paragraph2=Na primer, obvezni prostor za »komunikacijo«, kamor potisnete bistvene informacije, pomaga doseči vse člane.
generalSettings.access.whatIsMandatorySpace.paragraph3=Izberete lahko obvezne prostore glede na skupine uporabnikov.

