generalSettings.access.whatIsExternalUser=کاربر مهمان چیست?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=آنها نمی توانند به محتوای داخلی، از جمله فضاهای داخلی، فهرست افراد و فهرست فضا دسترسی داشته باشند.
generalSettings.access.whatIsExternalUser.paragraph3=صفحه اصلی آنها برای جلوگیری از هرگونه دسترسی ناخواسته به مناطق محدود متفاوت است.

generalSettings.access.whatIsSpaceHost=ادمین فضا چیست?
generalSettings.access.whatIsSpaceHost.paragraph1=وقتی فضایی را برای حضور در انجمن ایجاد می‌کنید، به‌طور خودکار مدیر فضا می‌شوید.
generalSettings.access.whatIsSpaceHost.paragraph2=این به شما امکان می‌دهد فضای جامعه خود را از جمله مدیریت اعضا، تنظیمات برنامه و مدیریت محتوا پیکربندی کنید.
generalSettings.access.whatIsSpaceHost.paragraph3=همچنین توصیه می‌کنیم اعضای دیگر را به‌عنوان ادمین‌های فضا شناسایی کنید و به آن‌ها اجازه دهید در صورت نیاز به شما کمک کنند.

generalSettings.access.whatIsRegisteredUser=کاربر ثبت نام شده چیست?
generalSettings.access.whatIsRegisteredUser.paragraph1=کاربران ثبت نام شده کاربرانی هستند که یک حساب کاربری معتبر دارند. این می تواند به روش های مختلفی بسته به حالت دسترسی اتفاق بیفتد:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. دسترسی آزاد: هر کسی می تواند ثبت نام کند، و پس از ثبت نام، کاربر ثبت نام شده می شود.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. دسترسی محدود: فقط کاربرانی که توسط یک مدیر ایجاد و دعوت شده اند می توانند وارد سیستم شوند و کاربران ثبت نام شده در نظر گرفته شوند.
generalSettings.access.whatIsRegisteredUser.paragraph4=3. دسترسی مهمان: کاربران مهمان مجاز با دسترسی محدود، کاربران ثبت نام شده هستند اما به عنوان مهمان با 🔹 پس از نام خود شناسایی می شوند.

generalSettings.access.whatIsDefaultSpace=فضای پیش فرض چیست?
generalSettings.access.whatIsDefaultSpace.paragraph1=تنظیم یک فضای پیش‌فرض تضمین می‌کند که کاربران جدید در اولین ورود خود، به طور خودکار به این فضا دسترسی خواهند داشت.
generalSettings.access.whatIsDefaultSpace.paragraph2=این کار با فراهم کردن فضاهایی برای کاوش قبل از درگیر شدن در سایر فعالیت های جامعه، ورود به انجمن را ساده می کند.
generalSettings.access.whatIsDefaultSpace.paragraph3=کاربران همچنان می توانند در صورت عدم علاقه به سرعت فضا را ترک کنند.

generalSettings.access.whatIsMandatorySpace=فضای اجباری چیست?
generalSettings.access.whatIsMandatorySpace.paragraph1=تنظیم یک فضا به عنوان اجباری تضمین می کند که کاربران به طور خودکار دسترسی دارند و نمی توانند انصراف دهند. این کمک می کند تا کاربران را در معرض مناطق بحرانی قرار دهند.
generalSettings.access.whatIsMandatorySpace.paragraph2=به عنوان مثال، یک فضای اجباری "ارتباطات" که در آن اطلاعات ضروری را فشار می دهید به دسترسی به همه اعضا کمک می کند.
generalSettings.access.whatIsMandatorySpace.paragraph3=می توانید فضاهای اجباری را بر اساس گروه های کاربری انتخاب کنید.

