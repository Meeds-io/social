generalSettings.access.whatIsExternalUser=¿Qué es un usuario externo?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=No pueden acceder al contenido interno, incluidos los espacios internos, el directorio de personas y el directorio de espacios.
generalSettings.access.whatIsExternalUser.paragraph3=Su página de inicio está personalizada para prevenir cualquier acceso no intencionado a áreas restringidas.

generalSettings.access.whatIsSpaceHost=¿Qué es un anfitrión espacial?
generalSettings.access.whatIsSpaceHost.paragraph1=Cuando creas un espacio a bordo de una comunidad, te convertirás automáticamente en un anfitrión del espacio.
generalSettings.access.whatIsSpaceHost.paragraph2=Esto le permite configurar el espacio para su comunidad, incluyendo administración de miembros, configuración de aplicaciones y gestión de contenido.
generalSettings.access.whatIsSpaceHost.paragraph3=También recomendamos identificar a otros miembros como anfitriones de espacio, habilitándolos para que le ayuden según sea necesario.

generalSettings.access.whatIsRegisteredUser=¿Qué es un usuario registrado?
generalSettings.access.whatIsRegisteredUser.paragraph1=Los usuarios que acceden a nuestra plataforma caen en diferentes categorías de usuarios registrados:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Acceso abierto: Cualquiera puede registrarse, y una vez que lo haga, se convierten en usuarios registrados.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Acceso restringido: solo los usuarios creados e invitados por un administrador pueden iniciar sesión y ser considerados usuarios registrados.
generalSettings.access.whatIsRegisteredUser.paragraph4=Acceso externo: Los usuarios externos autorizados, con acceso limitado, también son usuarios registrados pero se identifican como "externos".

generalSettings.access.whatIsDefaultSpace=¿Qué es un espacio predeterminado?
generalSettings.access.whatIsDefaultSpace.paragraph1=Establecer un espacio por defecto asegura que los nuevos usuarios, después de su primer inicio de sesión, accederán automáticamente a este espacio.
generalSettings.access.whatIsDefaultSpace.paragraph2=Esto simplifica la incorporación de la comunidad proporcionando espacios para explorar antes de participar en otras actividades comunitarias.
generalSettings.access.whatIsDefaultSpace.paragraph3=Los usuarios todavía pueden salir fácilmente del espacio si no les interesa después de iniciar sesión.

generalSettings.access.whatIsMandatorySpace=¿Qué es un espacio obligatorio?
generalSettings.access.whatIsMandatorySpace.paragraph1=Establecer un espacio como obligatorio asegura que a los usuarios se les conceda acceso automáticamente y que no pueden excluirse. Esto garantiza el compromiso de los usuarios con el contenido crítico y las comunidades.
generalSettings.access.whatIsMandatorySpace.paragraph2=Por ejemplo, marcar un espacio de "comunicación" como obligatorio garantiza el acceso universal y la recepción de mensajes.
generalSettings.access.whatIsMandatorySpace.paragraph3=Puede especificar espacios obligatorios basados en el perfil de membresía de un usuario, personalizando su acceso a espacios de perfil.

