generalSettings.access.whatIsExternalUser=Що таке зовнішній користувач?
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=Вони не можуть отримати доступ до внутрішнього змісту, включаючи внутрішні простори, каталог людей і каталог пробілів.
generalSettings.access.whatIsExternalUser.paragraph3=Їх домашня сторінка налаштована для запобігання ненавмисному доступу до обмежених сфер.

generalSettings.access.whatIsSpaceHost=Що таке космічний хост?
generalSettings.access.whatIsSpaceHost.paragraph1=Коли створюється простір для спільноти на борту, ви автоматично стаєте космічним хостом.
generalSettings.access.whatIsSpaceHost.paragraph2=Це дозволяє налаштувати простір для вашої спільноти, включаючи управління членами, параметри програми та керування вмістями.
generalSettings.access.whatIsSpaceHost.paragraph3=Ми також рекомендуємо визначити інших учасників як космічних хостів, наділивши їх повноваженнями вам допомагати.

generalSettings.access.whatIsRegisteredUser=Що таке зареєстрований користувач?
generalSettings.access.whatIsRegisteredUser.paragraph1=Користувачі, що мають доступ до нашої платформи потрапляють на різні категорії зареєстрованих користувачів:
generalSettings.access.whatIsRegisteredUser.paragraph2=1. Відкритий доступ: кожен може зареєструватися, і як тільки він це зробить, він став зареєстрованим користувачам.
generalSettings.access.whatIsRegisteredUser.paragraph3=2. Обмежений доступ: лише створені та запрошені адміністратором користувачі можуть входити та вважатися зареєстрованими користувачами
generalSettings.access.whatIsRegisteredUser.paragraph4=3. Зовнішній доступ: авторизовані зовнішні користувачі з обмеженим доступом, також зареєстровані користувачі, але вони ідентифікуються як "зовнішні".

generalSettings.access.whatIsDefaultSpace=Що таке типовий простір?
generalSettings.access.whatIsDefaultSpace.paragraph1=Встановлення типового простору забезпечує новий користувач після першого входу, автоматично отримає доступ до цього простору.
generalSettings.access.whatIsDefaultSpace.paragraph2=Це спрощує підготовку спільноти, забезпечуючи сприятливі місця для дослідження до участі в інших громадських заняттях.
generalSettings.access.whatIsDefaultSpace.paragraph3=Користувачі можуть легко вийти з простору, якщо вони не цікавляться їм після входу.

generalSettings.access.whatIsMandatorySpace=Що таке обов'язкова область?
generalSettings.access.whatIsMandatorySpace.paragraph1=Встановлення області як обов'язкового гарантує, що користувачам автоматично надається доступ і не може відмовитися. Це забезпечує залучення користувача до критичних даних і громад.
generalSettings.access.whatIsMandatorySpace.paragraph2=Наприклад, позначення простору "Спільнота" як обов'язкові гарантії загального доступу та отримання повідомлень.
generalSettings.access.whatIsMandatorySpace.paragraph3=Можна вказати обов'язкові пробіли на основі профілю членства користувача, користуючись їх доступом до профілів.

generalSettings.access.restrictedChangeInformation1=Лише зареєстровані користувачі зможуть отримати доступ до платформи.
generalSettings.access.restrictedChangeInformation2=Це не вплине на вже наявних користувачів
generalSettings.access.openChangeInformation1=Будь-хто зможе отримати доступ до платформи завдяки самостійній реєстрації.
generalSettings.access.openChangeInformation2=Це не вплине на існуючих користувачів
