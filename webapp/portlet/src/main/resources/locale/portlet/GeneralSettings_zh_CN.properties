generalSettings.access.whatIsExternalUser=什么是外部用户？
generalSettings.access.whatIsExternalUser.paragraph1=External users have limited platform access and can only join spaces when invited by space hosts.
generalSettings.access.whatIsExternalUser.paragraph2=他们无法访问内部内容，包括内部空间、人员目录和空间目录。
generalSettings.access.whatIsExternalUser.paragraph3=他们的主页定制是为了防止无意进入禁区。

generalSettings.access.whatIsSpaceHost=什么是空间主机？
generalSettings.access.whatIsSpaceHost.paragraph1=当你创建一个空间来登上一个社区时，你会自动成为一个空间主机。
generalSettings.access.whatIsSpaceHost.paragraph2=这允许您为您的社区配置空间，包括成员管理、应用程序设置和内容管理。
generalSettings.access.whatIsSpaceHost.paragraph3=我们还建议将其他成员确定为空间东道主，授权他们在需要时协助你。

generalSettings.access.whatIsRegisteredUser=什么是注册用户？
generalSettings.access.whatIsRegisteredUser.paragraph1=访问我们平台的用户属于注册用户的不同类别：
generalSettings.access.whatIsRegisteredUser.paragraph2=1. 开放访问：任何人都可以注册，一旦注册，就成为注册用户。
generalSettings.access.whatIsRegisteredUser.paragraph3=2. 限制访问：只有管理员创建和邀请的用户才能登录并被视为注册用户。
generalSettings.access.whatIsRegisteredUser.paragraph4=3. 外部访问：经授权的外部用户在有限的访问范围内也是注册用户，但被确定为“外部”用户。

generalSettings.access.whatIsDefaultSpace=什么是默认空间？
generalSettings.access.whatIsDefaultSpace.paragraph1=设置默认空间可以确保新用户在第一次登录时自动访问此空间。
generalSettings.access.whatIsDefaultSpace.paragraph2=这简化了社区登临的手续，为社区参与其他社区活动提供了探索空间。
generalSettings.access.whatIsDefaultSpace.paragraph3=如果用户登录后不感兴趣，用户仍然可以轻松地退出空间。

generalSettings.access.whatIsMandatorySpace=什么是必填空间？
generalSettings.access.whatIsMandatorySpace.paragraph1=设置空间是强制性的，可以确保用户自动获得访问权限，不能选择退出。这可以确保用户参与关键内容和社区。
generalSettings.access.whatIsMandatorySpace.paragraph2=例如，将一个“通信”空间标记为强制性的保证了普遍存取和消息接收。
generalSettings.access.whatIsMandatorySpace.paragraph3=您可以根据用户的会员身份资料指定必填空间，使他们能够访问配置文件的空间。

