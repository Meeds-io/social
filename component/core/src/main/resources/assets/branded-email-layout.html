<!DOCTYPE html>
<html lang="$LANG">
<head>
<meta charset="UTF-8">
$MAIL_HEAD
<title>$EMAIL_TITLE</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}
</style>
</head>
<body>
  <table
    border="0"
    cellpadding="0"
    cellspacing="0"
    width="600"
    bgcolor="$MAIL_SURFACE"
    align="center"
    class="mail-surface mail-text"
    style="background-color: $MAIL_SURFACE; font-size: 12px; color: $MAIL_TEXT; line-height: 18px; font-family: HelveticaNeue, Helvetica, Arial, sans-serif;">
    <tr>
      <td align="center" valign="middle">
        <table
          cellpadding="0" cellspacing="0" width="100%"
          bgcolor="$MAIL_SURFACE" align="center"
          class="mail-surface mail-border"
          style="border: 1px solid $MAIL_BORDER;">
          <tr>
            <td height="45" valign="middle"
              class="mail-bg mail-link"
              style="margin: 0; height: 45px; font-weight: bold; vertical-align: middle; background-color: $MAIL_BACKGROUND; font-family: 'HelveticaNeue Bold', Helvetica, Arial, sans-serif; color: $MAIL_LINK; font-size: 18px; text-align: center">
              $EMAIL_TITLE
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td bgcolor="$MAIL_SURFACE" class="mail-surface" style="background-color: $MAIL_SURFACE;">
        <table cellpadding="0" cellspacing="0" width="100%"
          bgcolor="$MAIL_SURFACE"
          class="mail-surface mail-border"
          style="background-color: $MAIL_SURFACE; border-bottom: 1px solid $MAIL_BORDER; border-left: 1px solid $MAIL_BORDER; border-right: 1px solid $MAIL_BORDER;">
          <tr>
            <td>
              <table border="0" cellpadding="0" cellspacing="0"
                width="92%" bgcolor="$MAIL_SURFACE" align="center"
                class="mail-surface mail-text"
                style="background-color: $MAIL_SURFACE; color: $MAIL_TEXT; line-height: 20px;">
                <tr>
                  <td align="left" bgcolor="$MAIL_SURFACE"
                    class="mail-surface"
                    style="background-color: $MAIL_SURFACE; padding: 10px 0;">
                    <p style="margin: 10px 0;">${Notification.label.SayHello} $USER_FULL_NAME,</p>
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td>
$EMAIL_CONTENT
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td bgcolor="$PRIMARY_COLOR" align="center"
        style="border: 1px solid $PRIMARY_COLOR;">
        <table
          border="0"
          cellpadding="0"
          cellspacing="0"
          width="92%"
          style="font-size: 12px; line-height: 18px; font-family: HelveticaNeue, verdana, arial, tahoma">
          <tr>
            <td align="left" valign="top"
              style="font-family: HelveticaNeue, Helvetica, Arial, sans-serif, serif; color: #ffffff; font-size: 13px;">
              <h3
                style="text-align: center; margin: 0; padding: 10px 0;">
                <a
                  target="_blank"
                  style="color: #ffffff; font-size: 13px; font-family: 'HelveticaNeue Bold', arial, tahoma, serif; font-weight: bold; text-decoration: none;"
                  href="$COMPANY_LINK"
                  title="$SITE_NAME">
                  $SITE_NAME
                </a>
              </h3>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
