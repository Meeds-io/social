UIActivity.label.Connect_and_discuss_with_others=Ühendage ja arutage teistega
UIActivity.label.Connect_and_discuss_with_others_details=Looge oma võrk, luues kolleegidega ühenduses teenuses {connections_link}. Nad saavad jälgida, kommenteerida või meeldida kõigile ideedele, meeleoludele, olekuvärskendustele, linkidele või dokumentidele, mida ülal jagate. Las arutelu algab!
