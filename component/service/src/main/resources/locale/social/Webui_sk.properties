UIActivity.label.Head_line=Toto je váš informačný kanál. Pomôže vám monitorovať dôležité aktivity vo vašich priestoroch a sieti.
UIActivity.label.Connect_and_discuss_with_others=Spojte sa a diskutujte s ostatnými
UIActivity.label.Connect_and_discuss_with_others_details=Vybudujte si sieť spojením s kolegami v {connections_link}. Budú môcť sledovať, komentovať alebo lajkovať všetky nápady, nálady, aktualizácie stavu, odkazy alebo dokumenty, ktoré zdieľate vyššie. Nechajte diskusiu začať!
UIActivity.label.Discover_the_power_of_social_collaboration=Objavte silu digitálnej spolupráce
UIActivity.label.Discover_the_power_of_social_collaboration_details=You can do a lot of useful things with {documents_link}, {wikis_link}, {forums_link} and {calendars_link} applications. The important things you do with them will be summarized automatically in the activity stream with just the right level of information to keep you and your network updated.
UIActivity.label.Use_spaces_for_team_or_project_matters=Využite priestory pre tímy a projekty
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Vytvorte alebo sa pripojte k spolupráci {spaces_link} pre svoje tímy, projekty alebo komunity. Priestory sú ideálnymi miestami na spoluprácu na konkrétnych témach. Všetky aktivity vo vašich priestoroch sú viditeľné vo vašom informačnom kanáli aktivít.
UIActivity.label.Anywhere_at_anytime=Kdekoľvek, kedykoľvek
UIActivity.label.Anywhere_at_anytime_details=Download mobile applications from the {iOS_App_Store_Link} and {Google_Play}. With your mobile device, you can also check the activity stream.
UIActivity.label.Welcome_Activity_Welcome_Onboard=👋 Vitajte na palube!
UIActivity.label.Welcome_Activity_Placeholder=Chcete začať spolupracovať s ostatnými?
UIActivity.label.Thanx_for_joing_meeds=Ďakujeme, že ste sa pripojili k {meeds Link}
UIActivity.label.empty_stream_write_post=Pridať príspevok
