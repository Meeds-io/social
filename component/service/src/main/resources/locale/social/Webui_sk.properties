UIActivity.label.empty_stream_only_admins_can_post=Obsah sem môžu pridávať iba správcovia a autori obsahu
UIActivity.label.paragraph_one={meeds Association link} poskytuje svojim členom implementáciu softvéru na rozpoznávanie zamestnancov.
UIActivity.label.paragraph_two=Členovia vkladajú tento nástroj uznávania a odmeňovania do svojich softvérových balíkov, aby ich gamifikovali a rozpoznali príspevky ich používateľov.
UIActivity.label.paragraph_three=Softvér obsahuje nasledujúce komponenty: informačný kanál sociálnej aktivity, adresár ľudí, priestory, spúšťač aplikácií, gamifikácia a nástroj na odmeňovanie.
UIActivity.label.paragraph_four=Môže byť použitý ako základný základ pre implementáciu nového softvéru alebo môže byť vložený do existujúceho softvéru prostredníctvom {APIs link}.
UIActivity.label.paragraph_five=Softvér je open source pod {odkazom na licenciu LGPL} a je distribuovaný zadarmo. Kód je dostupný na {GitHub link} a inštancie je možné spustiť cez {Docker link}.
UIActivity.label.Thanks_for_joing_company=Ďakujeme, že ste sa pripojili k {company name}
UIActivity.label.empty_stream_paragraph_one=Based on {product name}, this digital workplace solution helps you connect and engage your teams around a centralized interface.
UIActivity.label.empty_stream_paragraph_two={názov produktu} pomáha zlepšovať internú komunikáciu, podporovať spoluprácu a spravovať obchodné znalosti.
UIActivity.label.empty_stream_paragraph_three=Toto je váš informačný kanál. Pomôže vám monitorovať dôležité činnosti vo vašich priestoroch.
UIActivity.label.empty_stream_paragraph_four=Vybudujte si sieť spojením s kolegami v aplikácii Ľudia. Budú môcť sledovať, komentovať alebo lajkovať všetky nápady, nálady, aktualizácie stavu, odkazy alebo dokumenty, ktoré zdieľate vyššie.
UIActivity.label.empty_stream_paragraph_five=Vytvárajte priestory na spoluprácu alebo sa k nim pripojte pre svoje tímy, projekty alebo komunity.
