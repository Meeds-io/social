UIActivity.label.Welcome_Activity_Author=Chào mừng bạn đến với nền tảng cộng tác mới của bạn
UIActivity.label.Welcome_Activity_Posted_Time=chưa đến một phút trước
UIActivity.label.Head_line=Đây là nguồn cấp dữ liệu của bạn. Nó sẽ giúp bạn giám sát các hoạt động thiết yếu trong không gian và mạng của bạn.
UIActivity.label.Connect_and_discuss_with_others=Kết nối và thảo luận với những người khác
UIActivity.label.Connect_and_discuss_with_others_details=Xây dựng mạng xã hội của bạn bằng cách kết nối với các đồng nghiệp ở {connections_link}. Họ sẽ theo dõi, bình luận hay thích tất cả các ý tưởng, tâm trạng, cập nhật trạng thái, liên kết hoặc tài liệu mà bạn chia sẻ. Hãy bắt đầu các cuộc thảo luận !
UIActivity.label.Discover_the_power_of_social_collaboration=Khám phá sức mạnh của cộng tác kỹ thuật số
UIActivity.label.Discover_the_power_of_social_collaboration_details=Bạn có thể làm rất nhiều điều hữu ích với các ứng dụng {documents_link}, {wikis_link}, {forums_link} và {calendars_link}. Các hoạt động chính khi bạn thao tác với các ứng dụng trên sẽ được tự động ghi lại trong dòng hoạt động để bạn và mạng của bạn biết. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Sử dụng không gian cho các nhóm và dự án
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Tạo hoặc tham gia cộng tác {spaces_link} cho nhóm, dự án hoặc cộng đồng của bạn. Không gian là nơi lý tưởng để cộng tác về các chủ đề cụ thể. Tất cả hoạt động trong không gian của bạn đều hiển thị trên nguồn cấp dữ liệu hoạt động của bạn.
UIActivity.label.Anywhere_at_anytime=Bất cứ nơi nào, bất cứ lúc nào
UIActivity.label.Anywhere_at_anytime_details=Tải về các ứng dụng cho điện thoại di động từ {iOS_App_Store_Link} và {Google_Play}. Với điện thoại di động, bạn cũng có thể kiểm tra dòng hoạt động.
UIActivity.label.Welcome_Activity_Welcome_Onboard=👋 Chào mừng bạn lên tàu!
UIActivity.label.Welcome_Activity_Placeholder=Mong muốn bắt đầu cộng tác với những người khác?
UIActivity.label.Thanx_for_joing_meeds=Cảm ơn bạn đã tham gia {meeds Link}
UIActivity.label.empty_stream_write_post=Thêm bài đăng
UIActivity.label.empty_stream_send_kudos=Chúc mừng người khác
UIActivity.label.empty_stream_start_poll=Bắt đầu một cuộc thăm dò
UIActivity.label.empty_stream_write_article=Viết một tiêu đề
UIActivity.label.empty_stream_join_spaces=Tham Gia Không Gian
UIActivity.label.empty_stream_only_admins_can_post=Chỉ quản trị viên và người viết nội dung mới có thể thêm nội dung vào đây
UIActivity.label.paragraph_one={Liên kết hiệp hội meeds} cung cấp triển khai phần mềm nhận dạng nhân viên cho các thành viên của mình.
UIActivity.label.paragraph_two=Các thành viên nhúng công cụ công nhận và khen thưởng này vào kho phần mềm của họ để ứng dụng chúng và ghi nhận những đóng góp của người dùng.
UIActivity.label.paragraph_three=Phần mềm bao gồm các thành phần sau: nguồn cấp dữ liệu hoạt động xã hội, thư mục mọi người, không gian, trình khởi chạy ứng dụng, trò chơi và công cụ khen thưởng.
UIActivity.label.paragraph_four=Nó có thể được sử dụng làm cơ sở cốt lõi để triển khai phần mềm mới hoặc được nhúng vào phần mềm hiện có thông qua {APIs link}.
UIActivity.label.paragraph_five=Phần mềm này là nguồn mở theo {liên kết giấy phép LGPL} và được phân phối miễn phí. Mã có sẵn trên {GitHub link} và các phiên bản có thể được khởi chạy thông qua {Docker link}.
UIActivity.label.Thanks_for_joing_company=Cảm ơn bạn đã tham gia {tên công ty}
UIActivity.label.empty_stream_paragraph_one=Based on {product name}, this digital workplace solution helps you connect and engage your teams around a centralized interface.
UIActivity.label.empty_stream_paragraph_two={product name} giúp cải thiện hoạt động giao tiếp nội bộ, khuyến khích cộng tác và quản lý kiến ​​thức kinh doanh.
UIActivity.label.empty_stream_paragraph_three=Đây là nguồn cấp dữ liệu của bạn. Nó sẽ giúp bạn giám sát các hoạt động thiết yếu trong không gian của bạn.
UIActivity.label.empty_stream_paragraph_four=Xây dựng mạng lưới của bạn bằng cách kết nối với đồng nghiệp trong Mọi người. Họ sẽ có thể theo dõi, bình luận hoặc thích tất cả các ý tưởng, tâm trạng, cập nhật trạng thái, liên kết hoặc tài liệu mà bạn chia sẻ ở trên.
UIActivity.label.empty_stream_paragraph_five=Tạo hoặc tham gia Không gian cộng tác cho nhóm, dự án hoặc cộng đồng của bạn.
