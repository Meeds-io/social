UIActivity.label.Head_line=Ez a te hírfolyamod. Segít figyelemmel kísérni az alapvető tevékenységeket a terekben és a hálózatban.
UIActivity.label.Connect_and_discuss_with_others=Csatlakozz és beszélgess másokkal
UIActivity.label.Connect_and_discuss_with_others_details=Építse fel hálózatát kollégáival a {connections_link} szolgáltatásban. Követhetik, kommentálhatják vagy kedvelhetik az összes fent megosztott ötletet, hangulatot, állapotfrissítést, linket vagy dokumentumot. Kezdődjék a vita!
UIActivity.label.Discover_the_power_of_social_collaboration=Fedezze fel a digitális együttműködés erejét
UIActivity.label.Discover_the_power_of_social_collaboration_details=You can do a lot of useful things with {documents_link}, {wikis_link}, {forums_link} and {calendars_link} applications. The important things you do with them will be summarized automatically in the activity stream with just the right level of information to keep you and your network updated.
UIActivity.label.Use_spaces_for_team_or_project_matters=Használjon tereket csapatok és projektek számára
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Hozzon létre együttműködést {spaces_link}, vagy csatlakozzon hozzá csapatai, projektjei vagy közösségei számára. A terek ideális helyek adott témákkal kapcsolatos együttműködéshez. A tereid összes tevékenysége látható a tevékenységi hírcsatornában.
UIActivity.label.Anywhere_at_anytime=Bárhol, bármikor
UIActivity.label.Anywhere_at_anytime_details=Download mobile applications from the {iOS_App_Store_Link} and {Google_Play}. With your mobile device, you can also check the activity stream.
UIActivity.label.Welcome_Activity_Welcome_Onboard=👋 Üdvözlünk a fedélzeten!
UIActivity.label.Welcome_Activity_Placeholder=Szívesen kezdi el az együttműködést másokkal?
UIActivity.label.Thanx_for_joing_meeds=Köszönjük, hogy csatlakozott a {meeds Link} szolgáltatáshoz
UIActivity.label.empty_stream_write_post=Bejegyzés hozzáadása
UIActivity.label.empty_stream_send_kudos=Gratulálj másoknak
