UIActivity.label.empty_stream_write_article=Írj egy cikket
UIActivity.label.empty_stream_join_spaces=Csatlakozzon A Terekhez
UIActivity.label.empty_stream_only_admins_can_post=Csak a rendszergazdák és tartalomírók adhatnak hozzá tartalmat ide
UIActivity.label.paragraph_one=A {meeds Association link} alkalmazottai felismerő szoftver implementációt biztosít tagjai számára.
UIActivity.label.paragraph_two=A tagok beágyazzák ezt az elismerési és jutalmazó motort a szoftverkészleteikbe, hogy eljátsszák őket, és elismerjék felhasználói hozzájárulásaikat.
UIActivity.label.paragraph_three=A szoftver a következő összetevőket tartalmazza: közösségi tevékenység hírcsatorna, emberek címtár, terek, alkalmazásindító, gamification és jutalmazó motor.
UIActivity.label.paragraph_four=Használható alapjaként egy új szoftver megvalósításához, vagy beágyazható egy meglévő szoftverbe az {APIs link} segítségével.
UIActivity.label.paragraph_five=A szoftver nyílt forráskódú {az LGPL licenclink} alatt, és ingyenesen terjeszthető. A kód a {GitHub link} webhelyen érhető el, és a példányok a {Docker link} segítségével indíthatók el.
UIActivity.label.Thanks_for_joing_company=Köszönjük, hogy csatlakozott a(z) {company name}
UIActivity.label.empty_stream_paragraph_one=Based on {product name}, this digital workplace solution helps you connect and engage your teams around a centralized interface.
UIActivity.label.empty_stream_paragraph_two=A {product name} segít a belső kommunikáció javításában, az együttműködés ösztönzésében és az üzleti ismeretek kezelésében.
UIActivity.label.empty_stream_paragraph_three=This is your feed. It will help you monitor essential activities in your spaces.
UIActivity.label.empty_stream_paragraph_four=Építse fel hálózatát az emberekkel való kapcsolatfelvétel révén. Követhetik, kommentálhatják vagy kedvelhetik az összes fent megosztott ötletet, hangulatot, állapotfrissítést, linket vagy dokumentumot.
UIActivity.label.empty_stream_paragraph_five=Hozzon létre együttműködési tereket csapatai, projektjei vagy közösségei számára, vagy csatlakozzon hozzájuk.
