UIActivity.label.Welcome_Activity_Author=Добро пожаловать в вашу новую совместную платформу
UIActivity.label.Welcome_Activity_Posted_Time=меньше минуты назад
UIActivity.label.Head_line=Это ваша лента активности. Она поможет вам следить за важными событиями в ваших пространствах и в сети ваших контактов.
UIActivity.label.Connect_and_discuss_with_others=Подключайтесь и обсуждайте с другими
UIActivity.label.Connect_and_discuss_with_others_details=Постройте свою сеть, общаясь с коллегами в {connections_link}. Они будут иметь возможность отслеживать, комментировать и оценивать все идеи, настроения, обновления статуса, ссылки или документы, которыми вы делитесь с ними. Начните обсуждения!
UIActivity.label.Discover_the_power_of_social_collaboration=Откройте для себя возможности цифрового сотрудничества
UIActivity.label.Discover_the_power_of_social_collaboration_details=Вы можете сделать много полезных вещей с помощью приложений {documents_link}, {wikis_link}, {forums_link} и {calendars_link}. Важные вещи, которые вы делаете с их помощью, автоматически будут обобщены в ленте деятельности на нужном уровне информации, чтобы вы и ваша сеть оставались обновленными. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Используйте пространства для команд и проектов
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Создавайте {spaces_link} для совместной работы ваших команд, проектов или сообществ или присоединяйтесь к ним. Пространства идеально подходят для совместной работы над конкретными темами. Все, что происходит в ваших пространствах, отображается в вашей ленте активности.
UIActivity.label.Anywhere_at_anytime=Где угодно, в любое время
UIActivity.label.Anywhere_at_anytime_details=Скачайте мобильные приложения на {iOS_App_Store_Link} и {Google_Play}. Теперь вы сможете читать ленту активности с помощью вашего мобильного устройства.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Добро пожаловать на борт {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Желаете начать сотрудничество с другими?
UIActivity.label.Thanx_for_joing_meeds=Спасибо за присоединение к {meeds Link}
UIActivity.label.empty_stream_write_post=Напишите свой первый пост
UIActivity.label.empty_stream_send_kudos=Ценность чужого труда
UIActivity.label.empty_stream_start_poll=Начать опрос
UIActivity.label.empty_stream_write_article=Написать статью
UIActivity.label.empty_stream_join_spaces=Присоединиться к пространствам
UIActivity.label.empty_stream_only_admins_can_post=Только администраторы и redactors могут добавлять содержимое здесь
UIActivity.label.paragraph_one={meeds association link} предоставляет своим участникам реализацию программного обеспечения для распознавания сотрудников.
UIActivity.label.paragraph_two=Пользователи встраивают этот механизм признания и вознаграждения в свои программные комплекты для того, чтобы играть в них и распознавать вклад своих пользователей.
UIActivity.label.paragraph_three=Программное обеспечение включает следующие основные компоненты: ленту социальной активности, каталог людей, пространства, панель запуска приложений, систему геймификации и механизм вознаграждений.
UIActivity.label.paragraph_four=Он может быть использован в качестве базовой основы для новой реализации программного обеспечения или встроен в существующее программное обеспечение через {APIs link}.
UIActivity.label.paragraph_five=Программное обеспечение имеет открытый исходный код под {the LGPL license link} и распространяется бесплатно. Код доступен на {GitHub link}, а экземпляры можно запускать через {Docker link}}.
UIActivity.label.Thanks_for_joing_company=Спасибо за присоединение к {company name}
UIActivity.label.empty_stream_paragraph_one=На основе {product name}, это цифровое решение рабочего места, которое помогает вам подключать и вовлекать команды вокруг централизованного интерфейса.
UIActivity.label.empty_stream_paragraph_two={product name} помогает улучшить внутреннюю коммуникацию, поощрять сотрудничество и управлять бизнес-знаниями.
UIActivity.label.empty_stream_paragraph_three=Это ваша трансляция. Это поможет вам следить за важными вещами, происходящими в ваших помещениях.
UIActivity.label.empty_stream_paragraph_four=Создайте свою сеть, общаясь с коллегами в People. Они смогут подписываться, комментировать или отмечать «Нравится» все идеи, настроения, обновления статуса, ссылки или документы, которыми вы делитесь выше.
UIActivity.label.empty_stream_paragraph_five=Создавайте или присоединяйтесь к пространствам для совместной работы ваших команд, проектов или сообществ.
UIActivity.label.Welcome_Space=👋 Добро пожаловать в это пространство!
UIActivity.label.Welcome_Space_subtitle=Это пространство доступно только участникам и предназначено для централизации знаний сообщества.
