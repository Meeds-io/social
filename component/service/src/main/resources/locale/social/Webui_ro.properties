UIActivity.label.Discover_the_power_of_social_collaboration_details=Puteți face multe lucruri utile cu aplicațiile {documents_link}, {wikis_link}, {forums_link} și {calendars_link}. Lucrurile importante pe care le faceți cu ele vor fi rezumate automat în fluxul de activitate, cu nivelul potrivit de informații pentru a vă ține la curent pe dumneavoastră și rețeaua dumneavoastră.
