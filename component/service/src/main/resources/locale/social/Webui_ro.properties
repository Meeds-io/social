UIActivity.label.Use_spaces_for_team_or_project_matters_details=Creați {spaces_link} de colaborare pentru echipele, proiectele sau comunitățile dumneavoastră ori alăturați-vă acestora. Spațiile sunt locuri ideale pentru colaborarea pe teme specifice. Toate activitățile din spațiile dumneavoastră sunt vizibile în fluxul de activitate.
UIActivity.label.Anywhere_at_anytime=Oriunde, oricând
UIActivity.label.Anywhere_at_anytime_details=Descărcați aplicațiile mobile din {iOS_App_Store_Link} și {Google_Play}. De pe dispozitivul mobil puteți verifica și fluxul de activitate.
