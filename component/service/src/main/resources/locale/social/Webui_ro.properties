UIActivity.label.Head_line=Acesta este fluxul tău de activități. Te ajută să ai o vedere de ansamblu despre ceea ce se întâmplă în intranet.
UIActivity.label.Connect_and_discuss_with_others=Conectează-te și discută cu colegii
UIActivity.label.Connect_and_discuss_with_others_details=Dezvoltă-ți rețeaua de colaboratori prin conectarea cu colegii {connections_link}. Ei vor putea urmări, comenta sau aprecia toate ideile, postările, noutățile, link-urile sau documentele împărtășite mai sus. Să înceapă discuțiile!
UIActivity.label.Discover_the_power_of_social_collaboration=Descoperă puterea colaborării digitale
UIActivity.label.Discover_the_power_of_social_collaboration_details=Puteţi face o mulţime de lucruri utile cu aplicațiile pentru  {documents_link}, {wikis_link}, {forums_link} şi {calendars_link}. Cele mai importante lucruri veţi face vor fi rezumate automat în Fluxul de activitați, la nivelul potrivit pentru a te ține pe tine și colegii tăi cu informațiile la zi.
UIActivity.label.Use_spaces_for_team_or_project_matters=Folosiţi Spaţiile pentru echipe sau proiecte
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Creează sau înscrie-te în {spaces_link} pentru echipa ta, proiecte sau comunități. Spațiile sunt locuri ideale pentru colaborare pe teme specifice. Orice activitate din spațiile în care te-ai înscris apare și în fluxul de activitate.
UIActivity.label.Anywhere_at_anytime=Oriunde, oricând
UIActivity.label.Anywhere_at_anytime_details=Descarcă aplicaţiile mobile pentru {iOS_App_Store_Link} şi {Google_Play}. Cu dispozitivul mobil poți, de asemenea, verifica fluxul de activități.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Bine ai venit la bord {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Mai vechi să începi colaborarea cu alții?
UIActivity.label.Thanx_for_joing_meeds=Îți mulțumim că te-ai alăturat {meeds Link}
UIActivity.label.empty_stream_write_post=Scrie prima ta postare
