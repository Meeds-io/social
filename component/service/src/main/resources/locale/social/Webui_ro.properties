UIActivity.label.empty_stream_start_poll=Începe un sondaj
UIActivity.label.empty_stream_write_article=Scrie un articol
UIActivity.label.empty_stream_join_spaces=Alătură-te spațiilor
UIActivity.label.empty_stream_only_admins_can_post=Numai administratorii și redactorii pot adăuga conținut aici
UIActivity.label.paragraph_one={meeds association link} oferă membrilor săi o implementare software de recunoaștere pentru angajați.
UIActivity.label.paragraph_two=Membrii au încorporat acest motor de recunoaștere și recompensă în stivele lor de software pentru a le juca și pentru a le recunoaște contribuțiile utilizatorilor.
UIActivity.label.paragraph_three=Software-ul include următoarele componente principale, fluxul de activitate socială, directorul de persoane, spațiile, lansatorul de aplicații, gamificarea și recompensarea motorului.
UIActivity.label.paragraph_four=Poate fi folosit ca bază de bază pentru o nouă implementare software sau poate fi încorporat într-un software existent prin {APIs link}.
UIActivity.label.paragraph_five=Software-ul este open source sub {the LGPL license link} și este distribuit gratuit. Codul este disponibil pe {GitHub link} și instanțele pot fi lansate prin {Docker link}.
UIActivity.label.Thanks_for_joing_company=Îți mulțumim că te-ai alăturat {company name}
UIActivity.label.empty_stream_paragraph_one=Bazată pe {product name}, aceasta este o soluție de la locul de muncă digitală care te ajută să te conectezi și să implici echipele tale în jurul unei interfețe centralizate.
UIActivity.label.empty_stream_paragraph_two={product name} ajută la îmbunătățirea comunicării interne, încurajează colaborarea și gestionează cunoștințele de afaceri.
UIActivity.label.empty_stream_paragraph_three=Acesta este fluxul tău. Te va ajuta să fii atent la lucrurile importante care se întâmplă în spațiile tale.
UIActivity.label.empty_stream_paragraph_four=Construiți-vă rețeaua prin conectarea cu colegii din oameni. Ei vor putea urmări, comenta sau aprecia toate ideile, dispozițiile, actualizările statusului, linkurile sau documentele pe care le împărtășiți mai sus.
UIActivity.label.empty_stream_paragraph_five=Creează sau alătură-te spațiilor de colaborare pentru echipele, proiectele sau comunitățile.
