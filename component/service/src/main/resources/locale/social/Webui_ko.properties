UIActivity.label.empty_stream_join_spaces=스페이스 조인
UIActivity.label.empty_stream_only_admins_can_post=관리자와 콘텐츠 작성자만 여기에 콘텐츠를 추가할 수 있습니다.
UIActivity.label.paragraph_one={meeds 협회 링크}는 회원들에게 직원 인정 소프트웨어 구현을 제공합니다.
UIActivity.label.paragraph_two=회원들은 이러한 인식 및 보상 엔진을 소프트웨어 스택에 내장하여 게임화하고 사용자 기여를 인정합니다.
UIActivity.label.paragraph_three=이 소프트웨어에는 소셜 활동 피드, 사람 디렉토리, 스페이스, 앱 실행기, 게임화, 보상 엔진이 포함되어 있습니다.
UIActivity.label.paragraph_four=새로운 소프트웨어 구현을 위한 핵심 기반으로 사용할 수도 있고, {API 링크}를 통해 기존 소프트웨어에 내장할 수도 있습니다.
UIActivity.label.paragraph_five=소프트웨어는 {LGPL 라이선스 링크}에 따라 오픈 소스이며 무료로 배포됩니다. 코드는 {GitHub 링크}에서 사용할 수 있으며 인스턴스는 {Docker 링크}를 통해 시작할 수 있습니다.
UIActivity.label.Thanks_for_joing_company={회사 이름}에 가입해주셔서 감사합니다.
UIActivity.label.empty_stream_paragraph_one=Based on {product name}, this digital workplace solution helps you connect and engage your teams around a centralized interface.
UIActivity.label.empty_stream_paragraph_two={제품 이름}은 내부 커뮤니케이션을 개선하고 협업을 장려하며 비즈니스 지식을 관리하는 데 도움이 됩니다.
UIActivity.label.empty_stream_paragraph_three=이것은 당신의 피드입니다. 이것은 당신의 공간에서 필수적인 활동을 모니터링하는 데 도움이 될 것입니다.
UIActivity.label.empty_stream_paragraph_four=People에서 동료와 연결하여 네트워크를 구축하세요. 그들은 위에서 공유한 모든 아이디어, 분위기, 상태 업데이트, 링크 또는 문서를 팔로우, 댓글 달거나 좋아요를 누를 수 있습니다.
UIActivity.label.empty_stream_paragraph_five=팀, 프로젝트 또는 커뮤니티를 위한 협업 공간을 만들거나 참여하세요.
