UIActivity.label.Welcome_Activity_Posted_Time=1분도 안남았네요
UIActivity.label.Head_line=이것은 당신의 피드입니다. 이것은 당신의 공간과 네트워크에서 필수적인 활동을 모니터링하는 데 도움이 될 것입니다.
UIActivity.label.Connect_and_discuss_with_others=다른 사람들과 연결하고 토론하세요
UIActivity.label.Connect_and_discuss_with_others_details={connections_link}에서 동료와 연결하여 네트워크를 구축하세요. 그들은 위에서 공유한 모든 아이디어, 분위기, 상태 업데이트, 링크 또는 문서를 팔로우하거나, 댓글을 달거나, 좋아요를 누를 수 있습니다. 토론을 시작해 보세요!
UIActivity.label.Discover_the_power_of_social_collaboration=디지털 협업의 힘을 발견하세요
UIActivity.label.Discover_the_power_of_social_collaboration_details=You can do a lot of useful things with {documents_link}, {wikis_link}, {forums_link} and {calendars_link} applications. The important things you do with them will be summarized automatically in the activity stream with just the right level of information to keep you and your network updated.
UIActivity.label.Use_spaces_for_team_or_project_matters=팀과 프로젝트를 위한 공간 활용
UIActivity.label.Use_spaces_for_team_or_project_matters_details=팀, 프로젝트 또는 커뮤니티를 위한 협업 {spaces_link}을 만들거나 참여하세요. 스페이스는 특정 주제에 대한 협업에 이상적인 장소입니다. 스페이스의 모든 활동은 활동 피드에서 볼 수 있습니다.
UIActivity.label.Anywhere_at_anytime=언제 어디서나
UIActivity.label.Anywhere_at_anytime_details=Download mobile applications from the {iOS_App_Store_Link} and {Google_Play}. With your mobile device, you can also check the activity stream.
UIActivity.label.Welcome_Activity_Welcome_Onboard=👋 환영합니다!
