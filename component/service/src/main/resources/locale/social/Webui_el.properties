UIActivity.label.Welcome_Activity_Author=Καλώς ήρθατε στη νέα σας συνεργατική πλατφόρμα
UIActivity.label.Welcome_Activity_Posted_Time=πριν από λιγότερο από ένα λεπτό
UIActivity.label.Head_line=Αυτό είναι το ρεύμα δραστηριότητα σας. Θα σας βοηθήσει να παρακολουθείτε τα σημαντικά πράγματα που συμβαίνουν στο κοινωνικό ενδοδίκτυό σας.
UIActivity.label.Connect_and_discuss_with_others=Συνδεθείτε και συζητήστε με άλλους
UIActivity.label.Connect_and_discuss_with_others_details=Φτιάξτε το δικό σας δίκτυο επαφών συνδεόμενοι με συναδέλφους στις {connections_link}. Θα μπορούν να σας ακολουθούν, να σχολιάσουν ή να αρέσουν τις ιδέες σας, τη διάθεσή σας, τις ενημερώσεις στην κατάστασή σας και τις διευθύνσεις ή έγγραφα που μοιράζεστε. Ας ξεκινήσει η συζήτηση!
UIActivity.label.Discover_the_power_of_social_collaboration=Ανακαλύψτε τη δύναμη της κοινωνικής συνεργασίας
UIActivity.label.Discover_the_power_of_social_collaboration_details=Μπορείτε να κάνετε πολλά χρήσιμα πράγματα με τις  εφαρμογές {documents_link}, {wikis_link}, {forums_link} και {calendars_link}. Τα πιο σημαντικά θα συνοψίζονται αυτόματα στο ρεύμα δραστηριοτήτων στο σωστό επίπεδο λεπτομέρειας, ώστε να κρατάει εσάς και το δίκτυό σας ενημερωμένους. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Χρησιμοποιείστε τους Χώρους για ομαδικές υποθέσεις ή για κάποιο έργο
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Δημιουργήστε ή συμμετάσχετε σε μια συνεργατική ενότητα-χώρο {spaces_link} για τις ομάδες σας, τα έργα σας ή κοινότητες. Οι χώροι είναι ιδανικοί για συνεργασία σε κάποιο αντικείμενο. Όλη η δραστηριότητα που συμβαίνει στους χώρους σας είναι διαθέσιμη στη ροή γεγονότων.
UIActivity.label.Anywhere_at_anytime=Οπουδήποτε, οποτεδήποτε
UIActivity.label.Anywhere_at_anytime_details=Λήψη εφαρμογών για κινητά από το {iOS_App_Store_Link} και {Google_Play}. Με την συσκευή σας μπορείτε επίσης να ελέγχετε τη ροή δραστηριοτήτων.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Καλώς ήρθατε στο πλοίο {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Εύχομαι να αρχίσετε να συνεργάζεστε με τους άλλους?
UIActivity.label.Thanx_for_joing_meeds=Σας ευχαριστούμε για τη συμμετοχή σας στο {meeds Link}
UIActivity.label.empty_stream_write_post=Γράψτε την πρώτη σας δημοσίευση
UIActivity.label.empty_stream_send_kudos=Αξία εργασίας άλλων
UIActivity.label.empty_stream_start_poll=Ξεκινήστε μια δημοσκόπηση
UIActivity.label.empty_stream_write_article=Γράψτε ένα άρθρο
UIActivity.label.empty_stream_join_spaces=Συμμετοχή Σε Χώρους
UIActivity.label.empty_stream_only_admins_can_post=Μόνο οι διαχειριστές και οι redactors μπορούν να προσθέσουν περιεχόμενα εδώ
UIActivity.label.paragraph_one=Το {meeds association link} παρέχει στα μέλη του μια εφαρμογή λογισμικού αναγνώρισης εργαζομένων.
UIActivity.label.paragraph_two=Τα μέλη ενσωμάτωσαν αυτή την αναγνώριση και ανταμείβουν τη μηχανή στο λογισμικό τους στοίβες για να τους παίξουν και να αναγνωρίσουν τις συνεισφορές των χρηστών τους.
UIActivity.label.paragraph_three=Το λογισμικό περιλαμβάνει τα ακόλουθα κύρια συστατικά, το κοινωνικό ρεύμα δραστηριοτήτων, κατάλογο ανθρώπων, χώρους, εκτοξευτή εφαρμογών, gamification και ανταμείβει τη μηχανή.
UIActivity.label.paragraph_four=Μπορεί να χρησιμοποιηθεί ως βασική βάση για μια νέα εφαρμογή λογισμικού ή να ενσωματωθεί σε ένα υπάρχον λογισμικό μέσω {APIs link}.
UIActivity.label.paragraph_five=Το λογισμικό είναι ανοικτού κώδικα στο πλαίσιο {the LGPL license link} και διανέμεται δωρεάν. Ο κώδικας είναι διαθέσιμος στο {GitHub link} και οι περιπτώσεις μπορούν να εκκινηθούν μέσω {Docker link}.
UIActivity.label.Thanks_for_joing_company=Σας ευχαριστούμε για τη συμμετοχή σας στο {company name}
UIActivity.label.empty_stream_paragraph_one=Με βάση το {product name}, αυτή είναι μια ψηφιακή λύση στο χώρο εργασίας που σας βοηθά να συνδεθείτε και να εμπλέξετε τις ομάδες σας γύρω από μια κεντρική διεπαφή.
UIActivity.label.empty_stream_paragraph_two={product name} βοηθά στη βελτίωση της εσωτερικής επικοινωνίας, την ενθάρρυνση της συνεργασίας και τη διαχείριση της επιχειρηματικής γνώσης.
UIActivity.label.empty_stream_paragraph_three=Αυτό είναι το ρεύμα σας. Θα σας βοηθήσει να παρακολουθείτε σημαντικά πράγματα που συμβαίνουν στους χώρους σας.
UIActivity.label.empty_stream_paragraph_four=Φτιάξτε το δίκτυό σας με τη σύνδεση με τους συναδέλφους στο People. Θα είναι σε θέση να ακολουθήσουν, να σχολιάσουν ή όπως όλες τις ιδέες, διάθεση, ενημερώσεις κατάσταση, συνδέσμους ή έγγραφα που μοιράζονται παραπάνω.
UIActivity.label.empty_stream_paragraph_five=Δημιουργήστε ή συμμετάσχετε σε χώρους συνεργασίας για τις ομάδες, έργα ή κοινότητες.
UIActivity.label.Welcome_Space=Καλώς ήλθατε στο {space name}
UIActivity.label.Welcome_Space_subtitle=Μόνο προσβάσιμο στα μέλη, αυτός ο χώρος έχει ως στόχο να συγκεντρώσει τη γνώση της κοινότητας.
