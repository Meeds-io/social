UIActivity.label.Welcome_Activity_Author=Vítejte na nové platformě pro spolupráci
UIActivity.label.Welcome_Activity_Posted_Time=před méně než minutou
UIActivity.label.Head_line=Toto je váš sled aktivit. Pomůže vám sledovat důležité věci, které se dějí v sociální síti intranetu.
UIActivity.label.Connect_and_discuss_with_others=Připojte se a diskutujte s ostatními
UIActivity.label.Connect_and_discuss_with_others_details=Sestavte si svoji sít propojením se s kolegy v {connections_link}. Budou moci sledovat, komentovat nebo lajkovat všechny myšlenky, nálady, aktualizace stavů, odkazy nebo dokumenty, které zde sdílíte. Nechť začne diskuse!
UIActivity.label.Discover_the_power_of_social_collaboration=Objevte sílu sociální spolupráce
UIActivity.label.Discover_the_power_of_social_collaboration_details=S aplikacemi {documents_link}, {wikis_link}, {forums_link} a {calendars_link} můžete dělat spoustu užitečných věcí. Důležité věci, které v nich uděláte, budou automaticky shrnuty ve sledu aktivit do té správné formy, aby Vás a Vaši síť drželi v obraze. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Použijte skupiny pro týmové nebo projektové záeležitosti
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Vytvořte nebo se připojte ke spolupráci {spaces_link} v týmech, projektech či komunitách. Skupiny jsou ideálním místem pro spolupráci na konkrétních tématech. Veškerá činnost, která se děje ve vašich skupinách, je také k dispozici ve sledu aktivit.
UIActivity.label.Anywhere_at_anytime=Kdykoli a kdekoli
UIActivity.label.Anywhere_at_anytime_details=Stáhněte si mobilní aplikace z {iOS_App_Store_Link} a {Google_Play}. V mobilním zařízením pak můžete kontrolovat sled aktivit.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Vítejte na palubě {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Chceš začít spolupracovat s ostatními?
UIActivity.label.Thanx_for_joing_meeds=Děkujeme, že jste se připojili k {meeds Link}
UIActivity.label.empty_stream_write_post=Napište svůj první příspěvek
UIActivity.label.empty_stream_send_kudos=Hodnotit práci ostatních
UIActivity.label.empty_stream_start_poll=Zahájit anketu
UIActivity.label.empty_stream_write_article=Napsat článek
UIActivity.label.empty_stream_join_spaces=Připojit se do skupin
UIActivity.label.empty_stream_only_admins_can_post=Obsah zde mohou přidat pouze administrátoři a redaktory
UIActivity.label.paragraph_one={meeds association link} poskytuje svým členům implementaci softwaru pro rozpoznávání zaměstnanců.
UIActivity.label.paragraph_two=Členové vložili toto rozpoznání a odměňovali motory do svých softwarových zásobníků, aby je zgamovali a rozpoznali příspěvky svých uživatelů.
UIActivity.label.paragraph_three=Tyto prostředky jsou určeny na pokrytí výdajů na zaměstnance a správních výdajů agentury (hlavy 1 a 2) a provozních výdajů na pracovní program (hlava 3).
UIActivity.label.paragraph_four=Může být použit jako základní základ pro novou implementaci softwaru nebo vložen do stávajícího softwaru prostřednictvím {APIs link}.
UIActivity.label.paragraph_five=Tento software je open source pod {the LGPL license link} a je distribuován zdarma. Kód je k dispozici na {GitHub link} a instance mohou být spuštěny přes {Docker link}.
UIActivity.label.Thanks_for_joing_company=Děkujeme, že jste se připojili k {company name}
UIActivity.label.empty_stream_paragraph_one=Na základě {product name}je to digitální řešení na pracovišti, které vám pomůže propojit a zapojit vaše týmy kolem centralizovaného rozhraní.
UIActivity.label.empty_stream_paragraph_two={product name} pomáhá zlepšovat interní komunikaci, podporuje spolupráci a řízení obchodních znalostí.
UIActivity.label.empty_stream_paragraph_three=Toto je váš proud. Pomůže vám to sledovat důležité věci, které se odehrávají ve vašich prostorách.
UIActivity.label.empty_stream_paragraph_four=Sestavte si svou síť propojením s kolegy v Lidi. Budou moci sledovat, komentovat nebo podobně jako všechny myšlenky, nálady, aktualizace statusu, odkazy nebo dokumenty, které sdílíte výše.
UIActivity.label.empty_stream_paragraph_five=Vytvořte nebo se připojte ke spolupráci pro vaše týmy, projekty nebo komunity.
UIActivity.label.Welcome_Space=Vítejte v {space name}
UIActivity.label.Welcome_Space_subtitle=Tento prostor je přístupný pouze členům, má za cíl centralizovat znalosti komunity.
