UIActivity.label.Welcome_Activity_Author=Bem-vindo à sua nova Intranet Colaborativa
UIActivity.label.Welcome_Activity_Posted_Time=há menos de um minuto
UIActivity.label.Head_line=Este é o seu feed de atividades, que vai ajudá-lo a acompanhar o que de importante acontece na sua Intranet social.
UIActivity.label.Connect_and_discuss_with_others=Conecte-se e discuta com os outros
UIActivity.label.Connect_and_discuss_with_others_details=Construa sua rede ligando-se a colegas em {connections_link}. Eles serão capazes de seguir, comentar ou gostar todas as idéias, humores, atualizações de estado, hiperligações ou documentos que você partilhar acima. Comece a discussão!
UIActivity.label.Discover_the_power_of_social_collaboration=Descubra o poder da colaboração social
UIActivity.label.Discover_the_power_of_social_collaboration_details=Você pode fazer um monte de coisas úteis com os aplicativos {documents_link}, {wikis_link}, {forums_link} e {calendars_link}. As atividades importantes realizadas com eles aparecerão automaticamente no fluxo de atividade, apenas com o nível de informação necessário para manter você e sua rede atualizados. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Use espaços para assuntos de equipa ou projeto
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Crie {spaces_link} colaborativos ou adira às suas equipes, projetos ou comunidades. Espaços são lugares ideais para colaborar em temas específicos. Toda a atividade que acontece nos seus espaços também está disponível no feed de atividade.
UIActivity.label.Anywhere_at_anytime=Em qualquer lugar, a qualquer momento
UIActivity.label.Anywhere_at_anytime_details=Baixe o aplicativo móvel do {iOS_App_Store_Link} e {Google_Play}. Com o seu dispositivo móvel, você também pode checar o fluxo de atividade.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Bem-vindo ao tabuleiro {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Ansioso para começar a colaborar com os outros?
UIActivity.label.Thanx_for_joing_meeds=Obrigado por se juntar a {meeds Link}
UIActivity.label.empty_stream_write_post=Escreva o seu primeiro post
UIActivity.label.empty_stream_send_kudos=Valor do trabalho de outro
UIActivity.label.empty_stream_start_poll=Iniciar uma enquete
UIActivity.label.empty_stream_write_article=Escrever um artigo
UIActivity.label.empty_stream_join_spaces=Juntar-se aos Espaços
UIActivity.label.empty_stream_only_admins_can_post=Apenas administradores e redatores podem adicionar conteúdo aqui
UIActivity.label.paragraph_one=O {meeds association link} fornece uma implementação de software de reconhecimento de funcionário aos seus membros.
UIActivity.label.paragraph_two=Os membros incorporaram esse mecanismo de reconhecimento e recompensa nas suas pilhas de softwares para gamificar e reconhecer as contribuições dos usuários.
UIActivity.label.paragraph_three=O software inclui os seguintes componentes principais, fluxo de atividade social, diretório de pessoas, espaços, iniciador de aplicativos, mecanismo de gamificação e recompensas.
UIActivity.label.paragraph_four=Ele pode ser usado como uma base central para uma nova implementação de software ou ser incorporado em um software existente através do {APIs link}.
UIActivity.label.paragraph_five=O software é de código aberto abaixo do {the LGPL license link} e é distribuído gratuitamente. O código está disponível em {GitHub link} e instâncias podem ser iniciadas via {Docker link}.
UIActivity.label.Thanks_for_joing_company=Obrigado por se juntar a {company name}
UIActivity.label.empty_stream_paragraph_one=Com base em {product name}, esta é uma solução de trabalho digital que ajuda você a se conectar e envolver suas equipes através de uma interface centralizada.
UIActivity.label.empty_stream_paragraph_two={product name} ajuda a melhorar a comunicação interna, incentivar colaboração e gerenciar o conhecimento de negócio.
UIActivity.label.empty_stream_paragraph_three=Este é o seu stream, ele vai ajudá-lo a ficar de olho em coisas importantes acontecendo nos seus espaços.
UIActivity.label.empty_stream_paragraph_four=Construa sua rede conectando-se com os colegas das pessoas. Eles poderão seguir, comentar ou curtir todas as idéias, humores, atualizações de status, links ou documentos que você compartilhar acima.
UIActivity.label.empty_stream_paragraph_five=Crie ou junte-se aos espaços colaborativos para as suas equipes, projetos ou comunidades.
