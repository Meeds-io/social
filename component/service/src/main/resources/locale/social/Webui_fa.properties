UIActivity.label.Head_line=اینجا مکان اصلی برای به اشتراک گذاشتن اسناد، لینک ها، ایده ها و به روز رسانی ها در مورد آنچه که شما در حال کار بر روی آن هستید می باشد.
UIActivity.label.Connect_and_discuss_with_others=ارتباط و بحث با دیگران
UIActivity.label.Connect_and_discuss_with_others_details=با برقراری ارتباط با همکاران در {connections_link}، شبکه خود را بسازید. آن‌ها می‌توانند تمام ایده‌ها، حالت‌ها، به‌روزرسانی‌های وضعیت، پیوندها یا اسنادی را که در بالا به اشتراک می‌گذارید دنبال کنند، نظر بدهند یا درباره آنها بپسندند. L!
UIActivity.label.Discover_the_power_of_social_collaboration=کشف قدرت تعامل اجتماعی
UIActivity.label.Discover_the_power_of_social_collaboration_details=You can do a lot of useful things with {documents_link}, {wikis_link}, {forums_link} and {calendars_link} applications. The important things you do with them will be summarized automatically in the activity stream with just the right level of information to keep you and your network updated. 
UIActivity.label.Use_spaces_for_team_or_project_matters=برای مسائل گروهی و پروژه ها از فضاها استفاده کنید
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Create or join collaboration {spaces_link} for your teams, projects or communities. Spaces are ideal places for collaborating on specific topics. All activity that happens in your spaces is also available in the activity stream.
UIActivity.label.Anywhere_at_anytime=هر جا، هر زمان
UIActivity.label.Anywhere_at_anytime_details=Download mobile applications from the {iOS_App_Store_Link} and {Google_Play}. With your mobile device, you can also check the activity stream.
UIActivity.label.Welcome_Activity_Welcome_Onboard=👋 خوش آمدید!
UIActivity.label.Welcome_Activity_Placeholder=مشتاق شروع همکاری با دیگران هستید?
UIActivity.label.Thanx_for_joing_meeds=از اینکه به {meeds Link} پیوستید متشکریم
UIActivity.label.empty_stream_write_post=یک پست اضافه کنید
UIActivity.label.empty_stream_send_kudos=به دیگران تبریک بگویید
UIActivity.label.empty_stream_start_poll=شروع یک نظرسنجی
UIActivity.label.empty_stream_write_article=یک مقاله بنویس
