UIActivity.label.empty_stream_only_admins_can_post=فقط مدیران و نویسندگان محتوا می توانند محتوا را در اینجا اضافه کنند
UIActivity.label.paragraph_one={Meeds Association link} پیاده‌سازی نرم‌افزار شناسایی کارمندان را در اختیار اعضای خود قرار می‌دهد.
UIActivity.label.paragraph_two=اعضا این موتور شناسایی و پاداش را در پشته‌های نرم‌افزار خود تعبیه می‌کنند تا آنها را بازی‌سازی کنند و مشارکت‌های کاربران خود را تشخیص دهند.
UIActivity.label.paragraph_three=این نرم افزار شامل اجزای زیر است: فید فعالیت اجتماعی، فهرست افراد، فضاها، راه‌انداز برنامه، گیمیفیکیشن و موتور پاداش.
UIActivity.label.paragraph_four=It can be used as a core basis for a new software implementation or be embedded into an existing software through {APIs link}.
UIActivity.label.paragraph_five=این نرم افزار تحت {لینک مجوز LGPL} منبع باز است و به صورت رایگان توزیع می شود. کد در {GitHub link} موجود است و نمونه‌ها را می‌توان از طریق {Docker link} راه‌اندازی کرد.
UIActivity.label.Thanks_for_joing_company=از پیوستن شما به {company name} متشکریم
UIActivity.label.empty_stream_paragraph_one=Based on {product name}, this digital workplace solution helps you connect and engage your teams around a centralized interface.
UIActivity.label.empty_stream_paragraph_two={product name} به بهبود ارتباطات داخلی، تشویق همکاری و مدیریت دانش تجاری کمک می‌کند.
UIActivity.label.empty_stream_paragraph_three=این فید شماست. این به شما کمک می کند تا فعالیت های ضروری را در فضاهای خود نظارت کنید.
UIActivity.label.empty_stream_paragraph_four=شبکه خود را با ارتباط با همکاران در People بسازید. آن‌ها می‌توانند تمام ایده‌ها، حالت‌ها، به‌روزرسانی‌های وضعیت، پیوندها یا اسنادی را که در بالا به اشتراک می‌گذارید دنبال کنند، نظر بدهند یا درباره آنها بپسندند.
UIActivity.label.empty_stream_paragraph_five=فضاهای همکاری را برای تیم ها، پروژه ها یا جوامع خود ایجاد کنید یا به آنها بپیوندید.
