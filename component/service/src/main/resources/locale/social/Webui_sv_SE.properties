UIActivity.label.Head_line=Detta är din aktivitetsström. Det hjälper dig att hålla ett öga på viktiga saker som händer i dina utrymmen och människor nätverk.
UIActivity.label.Connect_and_discuss_with_others=Koppla dig och diskutera med andra
UIActivity.label.Connect_and_discuss_with_others_details=Bygg ditt nätverk, koppla dig med kolleger i {connections_link}. Dom kan då följa dig samt kommentera eller gilla alla dina idéer,  moder, statusuppdateringar och dokument som du delar. Låt diskussionen starta!
UIActivity.label.Discover_the_power_of_social_collaboration=Upptäck kraften i digitalt samarbete
UIActivity.label.Discover_the_power_of_social_collaboration_details=Du kan göra flera användbara saker med {documents_link}, {wikis_link}, {forums_link} och {calendars_link} applications. De viktigaste aktiviteterna du gör kommer att bli summerade automatiskt i ditt aktivitetsflöde med rätt nivå av information för att hålla dig uppdaterad. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Använd utrymmen för team och projekt
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Skapa eller gå med i {spaces_link} för samarbete för dina team, projekt eller gemenskaper. Utrymmen är perfekta för att samarbeta kring specifika ämnen. Alla aktiviteter i dina utrymmen visas i ditt aktivitetsflöde.
UIActivity.label.Anywhere_at_anytime=Varsomhelst, närsomhelst
UIActivity.label.Anywhere_at_anytime_details=Ladda ner mobila applikationer från {iOS_App_Store_Link} och {Google_Play}. Med din mobila enhet kan du följa och kontrollera ditt aktivitetsflöde.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Välkommen ombord {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Vill du börja samarbeta med andra?
UIActivity.label.Thanx_for_joing_meeds=Tack för att du gick med i {meeds Link}
UIActivity.label.empty_stream_write_post=Skriv ditt första inlägg
UIActivity.label.empty_stream_send_kudos=Värde andras arbete
UIActivity.label.empty_stream_start_poll=Starta en omröstning
UIActivity.label.empty_stream_write_article=Skriv en artikel
UIActivity.label.empty_stream_join_spaces=Gå med i utrymmen
UIActivity.label.empty_stream_only_admins_can_post=Endast administratörer och redactors kan lägga till innehåll här
UIActivity.label.paragraph_one={meeds association link} tillhandahåller en implementering av ett erkännande av anställdas programvara till sina medlemmar.
UIActivity.label.paragraph_two=Medlemmar bädda in denna igenkänning och belöningar motor i sina programvarustackar för att gamify dem och för att känna igen sina användares bidrag.
UIActivity.label.paragraph_three=Programvaran innehåller följande huvudkomponenter, social aktivitet ström, människor katalog, utrymmen, apps launcher, gamification och belöningar motor.
UIActivity.label.paragraph_four=Det kan användas som en kärngrund för en ny programvaruimplementering eller vara inbäddad i en befintlig programvara genom {APIs link}.
UIActivity.label.paragraph_five=Programvaran är öppen källkod under {the LGPL license link} och distribueras gratis. Koden finns på {GitHub link} och instanser kan startas via {Docker link}.
UIActivity.label.Thanks_for_joing_company=Tack för att du gick med i {company name}
UIActivity.label.empty_stream_paragraph_one=Baserat på {product name}är detta en digital arbetsplatslösning som hjälper dig att ansluta och engagera dina team runt ett centraliserat gränssnitt.
UIActivity.label.empty_stream_paragraph_two={product name} hjälper till att förbättra intern kommunikation, uppmuntra samarbete och hantera affärskunskap.
UIActivity.label.empty_stream_paragraph_three=Detta är din ström. Det hjälper dig att hålla ett öga på viktiga saker som händer i dina utrymmen.
UIActivity.label.empty_stream_paragraph_four=Bygg ditt nätverk genom att ansluta till kollegor i People. De kommer att kunna följa, kommentera eller som alla idéer, stämningar, statusuppdateringar, länkar eller dokument som du delar ovan.
