UIActivity.label.Head_line=Dit is uw activiteiten stroom. Het zal u helpen om een oogje in het zeil te houden op belangrijke dingen die gebeuren in uw sociale intranet.
UIActivity.label.Connect_and_discuss_with_others=Verbinding maken en discussie voeren met anderen
UIActivity.label.Connect_and_discuss_with_others_details=Bouw je netwerk door het connecten met collega's in {connections_link}. Zij kunnen u dan volgen, commentaar geven op, of uw ideeën waarderen, stemmingen, statusupdates, links of documenten delen. Laat de discussie beginnen!
UIActivity.label.Discover_the_power_of_social_collaboration=Ontdek de kracht van sociale samenwerking
UIActivity.label.Discover_the_power_of_social_collaboration_details=Je kunt een heleboel nuttige dingen doen met {documents_link}, {wikis_link}, {forums_link} en {calendars_link} toepassingen. De belangrijke dingen die je met hen doet zal automatisch worden samengevat in de activiteiten stroom met alleen het juiste niveau aan informatie om u en uw netwerk op de hoogte te houden. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Gebruik ruimtes voor team of project aangelegenheden
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Maken of deelnemen aan samenwerking {spaces_link} voor uw teams, projecten of gemeenschappen. Ruimtes zijn ideale plekken om samen te werken op specifieke onderwerpen. Alle activiteiten die in uw ruimte gebeurt is ook beschikbaar in de activiteit stroom.
UIActivity.label.Anywhere_at_anytime=Overal, altijd
UIActivity.label.Anywhere_at_anytime_details=Mobiele toepassingen downloaden van de {iOS_App_Store_Link} en {Google_Play}. Met uw mobiele apparaat, kunt u ook controleren de activiteit stroom.
UIActivity.label.Welcome_Activity_Welcome_Onboard=Welkom aan boord {user full name}!
UIActivity.label.Welcome_Activity_Placeholder=Eager om met anderen samen te werken?
UIActivity.label.Thanx_for_joing_meeds=Dank u voor het aansluiten bij {meeds Link}
UIActivity.label.empty_stream_write_post=Schrijf je eerste bericht
UIActivity.label.empty_stream_send_kudos=Waarde andermans werk
UIActivity.label.empty_stream_start_poll=Start een Poll
UIActivity.label.empty_stream_write_article=Schrijf een artikel
UIActivity.label.empty_stream_join_spaces=Samenvoegen van ruimten
UIActivity.label.empty_stream_only_admins_can_post=Alleen admins en redactors kunnen hier inhoud toevoegen
UIActivity.label.paragraph_one=De {meeds association link} biedt zijn leden een werknemersherkenningssoftware implementatie.
UIActivity.label.paragraph_two=Leden integreren deze herkenning en belonen engine in hun software om hen te gamificeren en hun bijdragen van gebruikers te herkennen.
UIActivity.label.paragraph_three=De software bevat de volgende hoofdcomponenten, sociale activiteit stream, mensen directorie, ruimten, apps launcher, gamificatie en beloningen engine.
UIActivity.label.paragraph_four=Het kan gebruikt worden als basisbasis voor een nieuwe software-implementatie of ingesloten worden in bestaande software via {APIs link}.
UIActivity.label.paragraph_five=De software is open source onder {the LGPL license link} en wordt gratis verspreid. De code is beschikbaar op {GitHub link} en er kunnen gevallen worden uitgevoerd via {Docker link}.
UIActivity.label.Thanks_for_joing_company=Dank u voor het aansluiten bij {company name}
UIActivity.label.empty_stream_paragraph_one=Gebaseerd op {product name}is dit een oplossing op digitale werkplek die je helpt je teams te verbinden en te betrekken rond een gecentraliseerde interface.
UIActivity.label.empty_stream_paragraph_two={product name} helpt de interne communicatie te verbeteren, samenwerking aan te moedigen en zakelijke kennis te beheren.
