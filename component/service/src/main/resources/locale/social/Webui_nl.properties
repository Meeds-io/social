UIActivity.label.empty_stream_paragraph_four=Bouw uw netwerk door verbinding te maken met collega's in Personen. Ze kunnen volgen, commentaar geven op of alle ideeën, stemmingen, statusupdates, links of documenten die u hierboven deelt waarderen.
