UIActivity.label.empty_stream_only_admins_can_post=רק מנהלים וכותבי תוכן יכולים להוסיף כאן תוכן
UIActivity.label.paragraph_one=ה-{meeds association link} מספק יישום תוכנת זיהוי עובדים לחבריו.
UIActivity.label.paragraph_two=חברים מטמיעים את מנוע ההכרה והתגמולים הזה בערימות התוכנה שלהם כדי להפוך אותם למשחקים ולזהות את תרומות המשתמשים שלהם.
UIActivity.label.paragraph_three=התוכנה כוללת את הרכיבים הבאים: פיד פעילות חברתית, ספריית אנשים, רווחים, משגר אפליקציות, gamification ומנוע מתגמל.
UIActivity.label.paragraph_four=זה יכול לשמש כבסיס ליבה להטמעת תוכנה חדשה או להיות מוטמע בתוכנה קיימת באמצעות {APIs link}.
UIActivity.label.paragraph_five=התוכנה היא בקוד פתוח תחת {the LGPL license link} ומופצת בחינם. הקוד זמין ב-{GitHub link} וניתן להפעיל מופעים באמצעות {Docker link}.
UIActivity.label.Thanks_for_joing_company=תודה שהצטרפת ל-{company name}
UIActivity.label.empty_stream_paragraph_one=Based on {product name}, this digital workplace solution helps you connect and engage your teams around a centralized interface.
UIActivity.label.empty_stream_paragraph_two={product name} עוזר לשפר את התקשורת הפנימית, לעודד שיתוף פעולה ולנהל ידע עסקי.
UIActivity.label.empty_stream_paragraph_three=זה הפיד שלך. זה יעזור לך לעקוב אחר פעילויות חיוניות במרחבים שלך.
UIActivity.label.empty_stream_paragraph_four=בנה את הרשת שלך על ידי חיבור עם עמיתים ב-People. הם יוכלו לעקוב, להגיב או לאהוב את כל הרעיונות, מצבי הרוח, עדכוני הסטטוס, הקישורים או המסמכים שאתה משתף למעלה.
UIActivity.label.empty_stream_paragraph_five=צור או הצטרף למרחבי שיתוף פעולה עבור הצוותים, הפרויקטים או הקהילות שלך.
