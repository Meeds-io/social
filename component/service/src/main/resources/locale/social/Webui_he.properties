UIActivity.label.Head_line=This is your activity stream. It will help you to keep an eye on important things happening in your social intranet.
UIActivity.label.Connect_and_discuss_with_others=להתחבר ולדון עם אחרים
UIActivity.label.Connect_and_discuss_with_others_details=בנה את הרשת שלך על ידי חיבור עם עמיתים ב-{connections_link}. הם יוכלו לעקוב, להגיב או לאהוב את כל הרעיונות, מצבי הרוח, עדכוני הסטטוס, הקישורים או המסמכים שאתה משתף למעלה. תנו לדיון להתחיל!
UIActivity.label.Discover_the_power_of_social_collaboration=Discover the power of social collaboration
UIActivity.label.Discover_the_power_of_social_collaboration_details=You can do a lot of useful things with {documents_link}, {wikis_link}, {forums_link} and {calendars_link} applications. The important things you do with them will be summarized automatically in the activity stream with just the right level of information to keep you and your network updated. 
UIActivity.label.Use_spaces_for_team_or_project_matters=Use spaces for team or project matters
UIActivity.label.Use_spaces_for_team_or_project_matters_details=Create or join collaboration {spaces_link} for your teams, projects or communities. Spaces are ideal places for collaborating on specific topics. All activity that happens in your spaces is also available in the activity stream.
UIActivity.label.Anywhere_at_anytime=בכל מקום ובכל זמן
UIActivity.label.Anywhere_at_anytime_details=Download mobile applications from the {iOS_App_Store_Link} and {Google_Play}. With your mobile device, you can also check the activity stream.
UIActivity.label.Welcome_Activity_Welcome_Onboard=👋 ברוכים הבאים למטוס!
UIActivity.label.Welcome_Activity_Placeholder=להוטים להתחיל לשתף פעולה עם אחרים?
UIActivity.label.Thanx_for_joing_meeds=תודה שהצטרפת ל-{meeds Link}
UIActivity.label.empty_stream_write_post=הוסף פוסט
